<script>
  /* =========================================================
   DASHBOARD MONITORING BPS BIREUEN - JS FINAL V2.4
   Compatible with Code.gs V2.4 + index.html SaaS Final
========================================================= */

  let APP_STATE = {
    payload: null,
    sls: null,
    currentSection: "overview",
    charts: {},
    tables: {},
    globalSearch: "",
    sidebarCollapsed: false,
    themeMode: "dark",
    filters: {
      kecamatanStatus: "",
      petugasKecamatan: "",
      petugasStatus: "",
      petugasIssue: "",
      pmlKecamatan: "",
      pmlStatus: "",
      pmlIssue: "",
      slsKecamatan: "",
      slsStatus: "",
      riskKecamatan: "",
      riskLevel: "",
      riskStatus: "",
      riskIssue: "",
    },
  };

  window.APP_STATE = APP_STATE;

  /* =========================================================
   INIT
========================================================= */

  document.addEventListener("DOMContentLoaded", function () {
    initShellUi();
    bindNavigation();
    bindActions();
    bindFilters();

    loadSuperDashboard(true);

    setInterval(function () {
      loadSuperDashboard(false);
    }, 300000);
  });

  /* =========================================================
   DATA LOADER
========================================================= */

  function loadSuperDashboard(showLoading = true) {
    if (showLoading) showLoadingState();

    google.script.run
      .withSuccessHandler(function (payload) {
        if (!payload || payload.success === false) {
          hideLoadingState();
          showErrorState(
            payload && payload.error
              ? payload.error
              : "Data dashboard tidak dapat dimuat.",
          );
          return;
        }

        payload.sls = payload.sls || emptySlsPayload("Data SLS tidak tersedia.");
        APP_STATE.payload = payload;
        APP_STATE.sls = payload.sls;

        hideLoadingState();
        renderAll(payload);
        showToast(
          "Data diperbarui",
          "Dashboard berhasil membaca sheet Progres dan Petugas.",
        );
      })
      .withFailureHandler(function (error) {
        hideLoadingState();
        showErrorState("Terjadi kesalahan pada server. Silakan hubungi administrator.");
        console.error(error);
      })
      .getSuperDashboardData();
  }

  function emptySlsPayload(message) {
    return {
      success: false,
      source: "EMPTY",
      module: "SLS",
      message: message || "Data SLS tidak tersedia.",
      summary: {},
      ranking: {},
      data: [],
    };
  }

  function showLoadingState() {
    addClass("loadingState", "");
    removeClass("loadingState", "d-none");
    addClass("errorState", "d-none");
    addClass("dashboardContent", "d-none");
  }

  function hideLoadingState() {
    addClass("loadingState", "d-none");
    removeClass("dashboardContent", "d-none");
  }

  function showErrorState(error) {
    removeClass("errorState", "d-none");
    addClass("dashboardContent", "d-none");

    const message =
      error && error.message ? error.message : String(error || "Unknown error");
    setText("errorMessage", message);
  }

  /* =========================================================
   MAIN RENDER
========================================================= */

  function renderAll(payload) {
    if (!payload || payload.success === false) {
      showErrorState(
        payload && payload.error
          ? payload.error
          : "Payload dashboard tidak valid.",
      );
      return;
    }

    renderSystem(payload);
    populateOperationalFilters(payload);
    renderDataAudit(payload);
    renderOverview(payload);
    renderKecamatan(payload.kecamatan);
    renderPetugas(payload.petugas);
    renderPml(payload.petugas);
    renderSls(payload.sls);
    renderRisk(payload.petugas);
    renderRaw(payload);

    applyGlobalSearch();
  }

  function populateOperationalFilters(payload) {
    const petugasRows = payload?.petugas?.data || [];
    const pmlRows = payload?.petugas?.pml?.data || [];
    const slsRows = payload?.sls?.data || [];
    const riskRows = payload?.petugas?.risk?.data || payload?.petugas?.data || [];

    populateSelectOptions(
      "filterPetugasKecamatan",
      getUniqueFieldValues(petugasRows, "kecamatanList", "kecamatan"),
      APP_STATE.filters.petugasKecamatan,
    );
    populateSelectOptions(
      "filterPmlKecamatan",
      getUniqueFieldValues(pmlRows, "kecamatanList", "kecamatan"),
      APP_STATE.filters.pmlKecamatan,
    );
    populateSelectOptions(
      "filterSlsKecamatan",
      getUniqueFieldValues(slsRows, "kecamatan"),
      APP_STATE.filters.slsKecamatan,
    );
    populateSelectOptions(
      "filterRiskKecamatan",
      getUniqueFieldValues(riskRows, "kecamatanList", "kecamatan"),
      APP_STATE.filters.riskKecamatan,
    );
  }

  function populateSelectOptions(id, values, selectedValue) {
    const el = document.getElementById(id);
    if (!el) return;

    const firstLabel = el.options && el.options[0] ? el.options[0].textContent : "Semua";
    const valueToKeep = selectedValue || el.value || "";

    el.innerHTML = "";
    const defaultOption = document.createElement("option");
    defaultOption.value = "";
    defaultOption.textContent = firstLabel;
    el.appendChild(defaultOption);

    values.forEach(function (value) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      el.appendChild(option);
    });

    el.value = values.includes(valueToKeep) ? valueToKeep : "";
  }

  function getUniqueFieldValues(rows, field, fallbackField) {
    return Array.from(
      new Set(
        rows
          .flatMap((item) => getRowValues(item, field, fallbackField))
          .filter(Boolean),
      ),
    ).sort((a, b) => a.localeCompare(b, "id"));
  }

  function getRowValues(item, field, fallbackField) {
    if (!item) return [];

    const rawValue = item[field];
    if (Array.isArray(rawValue)) {
      return rawValue.map((value) => safe(value, "").trim()).filter(Boolean);
    }

    if (rawValue) {
      return [safe(rawValue, "").trim()].filter(Boolean);
    }

    if (!fallbackField) return [];

    return safe(item[fallbackField], "")
      .split(",")
      .map((value) => value.trim())
      .filter(Boolean);
  }

  function renderSystem(payload) {
    const kecamatan = payload.kecamatan || {};
    const petugas = payload.petugas || {};
    const sls = payload.sls || {};

    setText(
      "kondisiData",
      safe(kecamatan.meta?.kondisiData, "Data kondisi tidak terbaca"),
    );
    setText("lastSync", safe(payload.generatedAt, "-"));
    setText("topbarLastSync", safe(payload.generatedAt, "-"));
    setText("lastPetugasDatetime", getLatestFieldText(sls.data || [], "datetime"));
    setText(
      "targetHarian",
      formatPercent(kecamatan.summary?.targetHarian || 0),
    );
    setText("dataMode", "Sheets");

    setText("diagVersion", payload.version || "-");
    setText("diagKecamatanSource", safe(kecamatan.source, "-"));
    setText("diagPetugasSource", safe(petugas.source, "-"));
    setText(
      "diagPetugasRows",
      formatNumber(petugas.meta?.totalRows || petugas.data?.length || 0),
    );

    if (kecamatan.success && petugas.success) {
      setText("sourceStatus", "Sheets OK");
      setText("topbarSourceStatus", "Sheets OK");
      setSourceDot("ok");
    } else if (kecamatan.success || petugas.success || sls.success) {
      setText("sourceStatus", "Sebagian OK");
      setText("topbarSourceStatus", "Sebagian OK");
      setSourceDot("warn");
    } else {
      setText("sourceStatus", "Gagal");
      setText("topbarSourceStatus", "Gagal");
      setSourceDot("bad");
    }
  }

  function renderDataAudit(payload) {
    const petugas = payload.petugas || {};
    const sls = payload.sls || {};
    const petugasRows = petugas.data || [];
    const pmlRows = petugas.pml?.data || [];
    const slsRows = sls.data || [];
    const auditPersen = sls.summary?.auditPersen || {};

    setText("auditMismatchSls", formatNumber(auditPersen.totalMismatch || 0));
    setText(
      "auditUnknownKecamatan",
      formatNumber(
        slsRows.filter((item) => item.kecamatan === "TIDAK DIKETAHUI").length,
      ),
    );
    setText(
      "auditPplNoEmail",
      formatNumber(petugasRows.filter((item) => !item.pplEmail).length),
    );
    setText(
      "auditPmlNoEmail",
      formatNumber(pmlRows.filter((item) => !item.pmlEmail).length),
    );
    setText(
      "auditTargetZero",
      formatNumber(slsRows.filter((item) => Number(item.targetFasih || 0) === 0).length),
    );
    setText("auditLastGenerated", safe(payload.generatedAt, "-"));
    setText("auditDataStale", getFreshnessLabel(getLatestFieldText(slsRows, "datetime")));
  }

  function setSourceDot(type) {
    const el = document.getElementById("sourceDot");
    if (!el) return;

    el.className = "source-dot";
    if (type === "ok") el.classList.add("ok");
    if (type === "bad") el.classList.add("bad");
  }

  /* =========================================================
   OVERVIEW
========================================================= */

  function renderOverview(payload) {
    const kecamatan = payload.kecamatan || {};
    const petugas = payload.petugas || {};
    const ks = kecamatan.summary || {};
    const ps = petugas.summary || {};

    setText("kpiTotalPrelist", formatNumber(ks.totalPrelist));
    setText("kpiTotalSubmit", formatNumber(ks.totalSubmit));
    setText("kpiTotalApprove", formatNumber(ks.totalApprove));
    setText("kpiTotalPPL", formatNumber(ks.totalPPL));

    setText("kpiSubmitCoverage", "Coverage " + formatPercent(ks.percentSubmit));
    setText(
      "kpiApproveCoverage",
      "Approve " + formatPercent(ks.percentApprove),
    );
    setText(
      "kpiTotalKecamatan",
      formatNumber(ks.totalKecamatan) + " kecamatan",
    );

    setText("miniKecamatanAman", formatNumber(ks.aboveTarget));
    setText("miniKecamatanBelow", formatNumber(ks.belowTarget));

    setText("miniPplElite", formatNumber(ps.elite));
    setText("miniPplKritis", formatNumber(ps.kritis));
    setText("miniTotalOpen", formatNumber(ps.totalOpen));
    setText("miniTotalDraft", formatNumber(ps.totalDraft));
    setText("insightOpenRate", formatPercent(ps.openRate));
    setText("insightDraftRate", formatPercent(ps.draftRate));
    setText("insightActivePpl", formatNumber(ps.activePPL));
    setText("insightTotalSls", formatNumber(ps.totalSLS));

    setText("miniApprovalBacklog", "0");
    setText("miniRejected", "0");

    setText("legendAboveTarget", formatNumber(ks.aboveTarget));
    setText("legendBelowTarget", formatNumber(ks.belowTarget));

    setText("qualityTotalOpen", formatNumber(ps.totalOpen));
    setText("qualityTotalDraft", formatNumber(ps.totalDraft));
    setText("qualityOpenRate", formatPercent(ps.openRate));
    setText("qualityDraftRate", formatPercent(ps.draftRate));

    setText("qualityApprovalRate", "0%");
    setText("qualityRejectedRate", "0%");

    renderKecamatanSubmitChart(
      kecamatan.rankingSubmit || [],
      ks.targetHarian || 0,
    );
    renderKecamatanStatusChart(ks);
    renderPetugasStatusChart(ps);
  }

  /* =========================================================
   KECAMATAN
========================================================= */

  function renderKecamatan(kecamatan) {
    if (!kecamatan || !kecamatan.success) {
      renderTableKecamatan([]);
      return;
    }

    const summary = kecamatan.summary || {};
    const data = kecamatan.data || [];

    renderLeaderboard(
      "listTopKecamatan",
      (kecamatan.rankingSubmit || []).slice(0, 7),
      function (item, index) {
        return {
          rank: index + 1,
          title: item.kecamatan,
          sub:
            formatNumber(item.submit) +
            " submit · " +
            formatNumber(item.jumlahPPL) +
            " PPL",
          value: formatPercent(item.percentSubmit),
          valueClass:
            item.percentSubmit >= summary.targetHarian ? "good" : "bad",
        };
      },
    );

    renderLeaderboard(
      "listWarningKecamatan",
      (kecamatan.warningList || []).slice(0, 7),
      function (item, index) {
        return {
          rank: index + 1,
          title: item.kecamatan,
          sub: "Selisih " + formatPercent(item.selisihPercent) + " dari target",
          value: formatPercent(item.percentSubmit),
          valueClass:
            item.percentSubmit >= summary.targetHarian ? "good" : "bad",
        };
      },
    );

    renderLeaderboard(
      "listBacklogKecamatan",
      (kecamatan.backlogList || []).slice(0, 7),
      function (item, index) {
        return {
          rank: index + 1,
          title: item.kecamatan,
          sub:
            formatNumber(item.submit) +
            " submit · " +
            formatNumber(item.approve) +
            " approve",
          value: formatNumber(item.approvalBacklog),
          valueClass: item.approvalBacklog > 1000 ? "bad" : "",
        };
      },
    );

    const filtered = data.filter(function (item) {
      return (
        !APP_STATE.filters.kecamatanStatus ||
        item.status === APP_STATE.filters.kecamatanStatus
      );
    });

    renderTableKecamatan(filtered);
  }

  function renderTableKecamatan(data) {
    destroyTable("tableKecamatan");

    APP_STATE.tables.tableKecamatan = $("#tableKecamatan").DataTable({
      data: data,
      pageLength: 17,
      lengthMenu: [10, 17, 25, 50],
      dom: "Bfrtip",
      buttons: tableButtons("Kecamatan_Bireuen"),
      order: [[4, "desc"]],
      columns: [
        { data: "kode", render: textRenderer },
        { data: "kecamatan", render: boldText },
        { data: "prelist", render: numberRenderer },
        { data: "submit", render: numberRenderer },
        { data: "percentSubmit", render: percentRenderer },
        { data: "selisihPercent", render: deltaPercentRenderer },
        { data: "approve", render: numberRenderer },
        { data: "percentApprove", render: percentRenderer },
        { data: "jumlahPPL", render: numberRenderer },
        { data: "approvalBacklog", render: numberRenderer },
        { data: "status", render: renderKecamatanStatusBadge },
      ],
      language: datatableLanguage(),
    });
  }

  /* =========================================================
   PETUGAS / PPL
========================================================= */

  function renderPetugas(petugas) {
    if (!petugas || !petugas.success) {
      renderPetugasUnavailable(petugas);
      return;
    }

    const summary = petugas.summary || {};
    const data = petugas.data || [];
    const filteredData = filterPetugasData(data);
    const topRealisasi = filteredData
      .slice()
      .sort((a, b) => Number(b.persenRealisasi || 0) - Number(a.persenRealisasi || 0));
    const bottomRealisasi = filteredData
      .slice()
      .sort((a, b) => Number(a.persenRealisasi || 0) - Number(b.persenRealisasi || 0));
    const highestRisk = filteredData
      .slice()
      .sort((a, b) => Number(b.riskScore || 0) - Number(a.riskScore || 0));

    setText("pplTotalLive", formatNumber(summary.totalPPL));
    setText("pplTotalPml", formatNumber(summary.totalPML));
    setText("pplTotalSls", formatNumber(summary.totalSLS));
    setText("pplTotalTarget", formatNumber(summary.totalTarget));
    setText("pplTotalBerhasil", formatNumber(summary.totalBerhasil));
    setText("pplPersenRealisasi", formatPercent(summary.persenRealisasi));
    setText("pplMedianRealisasi", formatPercent(summary.medianPercent));

    renderLeaderboard(
      "listTopPetugas",
      topRealisasi.slice(0, 7),
      function (item, index) {
        return {
          rank: index + 1,
          title: item.pplNama,
          sub:
            item.kecamatan +
            " · " +
            formatNumber(item.berhasilDidata) +
            "/" +
            formatNumber(item.targetFasih),
          value: formatPercent(item.persenRealisasi),
          valueClass: "good",
        };
      },
    );

    renderLeaderboard(
      "listBottomPetugas",
      bottomRealisasi.slice(0, 7),
      function (item, index) {
        return {
          rank: index + 1,
          title: item.pplNama,
          sub: item.kecamatan + " · open " + formatNumber(item.open),
          value: formatPercent(item.persenRealisasi),
          valueClass: "bad",
        };
      },
    );

    renderLeaderboard(
      "listRiskPetugas",
      highestRisk.slice(0, 7),
      function (item, index) {
        return {
          rank: index + 1,
          title: item.pplNama,
          sub: item.kecamatan + " · " + item.statusLabel,
          value: formatNumber(item.riskScore),
          valueClass: item.riskScore >= 70 ? "bad" : "",
        };
      },
    );

    renderPetugasFilterSummary(filteredData, data);
    renderTopPetugasChart(topRealisasi);
    renderPetugasOpenBerhasilChart(highestRisk.slice(0, 15));

    renderTablePetugas(filteredData);
  }

  function renderPetugasUnavailable(petugas) {
    setText("pplTotalLive", "0");
    setText("pplTotalPml", "0");
    setText("pplTotalSls", "0");
    setText("pplTotalTarget", "0");
    setText("pplTotalBerhasil", "0");
    setText("pplPersenRealisasi", "0%");
    setText("pplMedianRealisasi", "0%");

    setHtml("listTopPetugas", emptyBox("Data petugas belum tersedia."));
    setHtml(
      "listBottomPetugas",
      emptyBox("Cek sheet Petugas dan header export SERASI."),
    );
    setHtml("listRiskPetugas", emptyBox("Risk belum dapat dihitung."));

    renderTablePetugas([]);

    showToast(
      "Petugas tidak tersedia",
      safe(petugas?.message, "Sheet Petugas belum terbaca."),
      "warning",
    );
  }

  function filterPetugasData(data) {
    const kecamatan = APP_STATE.filters.petugasKecamatan;
    const status = APP_STATE.filters.petugasStatus;
    const issue = APP_STATE.filters.petugasIssue;

    return data.filter(function (item) {
      let ok = true;

      if (kecamatan)
        ok = ok && rowHasValue(item, "kecamatanList", "kecamatan", kecamatan);
      if (status) ok = ok && item.status === status;

      if (issue === "draft" || issue === "draft_high")
        ok = ok && isDraftHigh(item);
      if (issue === "open_high")
        ok =
          ok &&
          item.targetFasih &&
          item.open / item.targetFasih >= getOpenHighRatio();
      if (issue === "risk_high") ok = ok && item.riskScore >= 70;
      if (issue === "zero_progress") ok = ok && Number(item.berhasilDidata || 0) === 0;

      return ok;
    });
  }

  function renderPetugasFilterSummary(filteredData, allData) {
    const kecamatan = APP_STATE.filters.petugasKecamatan;
    const kritis = filteredData.filter((item) => item.status === "KRITIS").length;
    const perhatian = filteredData.filter((item) => item.status === "PERHATIAN").length;
    const totalOpen = sumBy(filteredData, "open");
    const totalDraft = sumBy(filteredData, "draft");
    const totalTarget = sumBy(filteredData, "targetFasih");
    const totalBerhasil = sumBy(filteredData, "berhasilDidata");
    const location = kecamatan ? " di " + kecamatan : "";

    setText(
      "summaryPetugasFilter",
      "Menampilkan " +
        formatNumber(filteredData.length) +
        " dari " +
        formatNumber(allData.length) +
        " PPL" +
        location +
        ". " +
        formatNumber(kritis) +
        " Kritis · " +
        formatNumber(perhatian) +
        " Perhatian · Open " +
        formatNumber(totalOpen) +
        " · Draft " +
        formatNumber(totalDraft) +
        " · Target " +
        formatNumber(totalTarget) +
        " · Berhasil " +
        formatNumber(totalBerhasil) +
        " · Realisasi " +
        formatPercent(calculatePercent(totalBerhasil, totalTarget)),
    );
  }

  function renderTablePetugas(data) {
    destroyTable("tablePetugas");

    APP_STATE.tables.tablePetugas = $("#tablePetugas").DataTable({
      data: data,
      pageLength: 25,
      lengthMenu: [10, 25, 50, 100, 250],
      dom: "Bfrtip",
      buttons: tableButtons("Petugas_PPL_Bireuen"),
      order: [[9, "desc"]],
      scrollX: true,
      columns: [
        { data: "no" },
        { data: "kecamatan", render: textRenderer },
        { data: "pplNama", render: boldText },
        { data: "pplEmail", render: emailText },
        { data: "pmlNama", render: textRenderer },
        { data: "pmlEmail", render: emailText },
        { data: "totalSLS", render: numberRenderer },
        { data: "targetFasih", render: numberRenderer },
        { data: "berhasilDidata", render: numberRenderer },
        { data: "persenRealisasi", render: percentRenderer },
        { data: "open", render: numberRenderer },
        { data: "draft", render: numberRenderer },
        { data: "riskScore", render: riskScoreRenderer },
        { data: "status", render: renderPetugasStatusBadge },
        { data: "datetime", render: textRenderer },
        {
          data: null,
          orderable: false,
          render: (data, type, row) => renderSlsJumpButton(row.pplNama),
        },
      ],
      language: datatableLanguage(),
    });
  }

  /* =========================================================
   PML / PENGAWAS
========================================================= */

  function renderPml(petugas) {
    if (!petugas || !petugas.success || !petugas.pml) {
      renderTablePml([]);
      return;
    }

    const pml = petugas.pml;
    const summary = pml.summary || {};
    const data = pml.data || [];
    const filteredData = filterPmlData(data);
    const topRealisasi = filteredData
      .slice()
      .sort((a, b) => Number(b.persenRealisasi || 0) - Number(a.persenRealisasi || 0));
    const highestRisk = filteredData
      .slice()
      .sort((a, b) => Number(b.riskScore || 0) - Number(a.riskScore || 0));

    setText("pmlTotal", formatNumber(summary.totalPML));
    setText("pmlTotalTarget", formatNumber(summary.totalTarget));
    setText("pmlTotalBerhasil", formatNumber(summary.totalBerhasil));
    setText("pmlAvgRealisasi", formatPercent(summary.avgRealisasi));
    setText("pmlTotalOpen", formatNumber(summary.totalOpen));
    setText("pmlTotalDraft", formatNumber(summary.totalDraft));

    setText("pmlTotalBacklog", "0");
    setText("pmlBacklogTinggi", "0");
    setText("pmlRejectedTinggi", "0");

    renderPmlFilterSummary(filteredData, data);
    renderTopPmlChart(topRealisasi);

    renderLeaderboard(
      "listPmlRisk",
      highestRisk.slice(0, 8),
      function (item, index) {
        return {
          rank: index + 1,
          title: item.pmlNama,
          sub:
            formatNumber(item.totalPPL) +
            " PPL · " +
            formatNumber(item.totalSLS) +
            " SLS",
          value: formatNumber(item.riskScore),
          valueClass: item.riskScore >= 70 ? "bad" : "",
        };
      },
    );

    setHtml("listPmlBacklog", "");

    renderTablePml(filteredData);
  }

  function filterPmlData(data) {
    const kecamatan = APP_STATE.filters.pmlKecamatan;
    const status = APP_STATE.filters.pmlStatus;
    const issue = APP_STATE.filters.pmlIssue;

    return data.filter(function (item) {
      let ok = true;

      if (kecamatan)
        ok = ok && rowHasValue(item, "kecamatanList", "kecamatan", kecamatan);
      if (status) ok = ok && item.status === status;

      if (issue === "draft" || issue === "draft_high")
        ok = ok && isDraftHigh(item);
      if (issue === "open_high")
        ok =
          ok &&
          item.targetFasih &&
          item.open / item.targetFasih >= getOpenHighRatio();
      if (issue === "risk_high") ok = ok && item.riskScore >= 70;
      if (issue === "low_realisasi")
        ok = ok && Number(item.persenRealisasi || 0) < 20;
      if (issue === "zero_progress") ok = ok && Number(item.berhasilDidata || 0) === 0;

      return ok;
    });
  }

  function renderPmlFilterSummary(filteredData, allData) {
    const kecamatan = APP_STATE.filters.pmlKecamatan;
    const kritis = filteredData.filter((item) => item.status === "KRITIS").length;
    const perhatian = filteredData.filter((item) => item.status === "PERHATIAN").length;
    const totalOpen = sumBy(filteredData, "open");
    const totalDraft = sumBy(filteredData, "draft");
    const totalTarget = sumBy(filteredData, "targetFasih");
    const totalBerhasil = sumBy(filteredData, "berhasilDidata");
    const location = kecamatan ? " di " + kecamatan : "";

    setText(
      "summaryPmlFilter",
      "Menampilkan " +
        formatNumber(filteredData.length) +
        " dari " +
        formatNumber(allData.length) +
        " PML" +
        location +
        ". " +
        formatNumber(kritis) +
        " Kritis · " +
        formatNumber(perhatian) +
        " Perhatian · Open " +

  function renderRisk(petugas) {
    if (!petugas || !petugas.success || !petugas.risk) {
      renderTableRisk([]);
      return;
    }

    const risk = petugas.risk;
    const data = risk.data || petugas.data || risk.highRiskList || [];
    const filteredData = filterRiskData(data);
    const summary = buildRiskSummary(filteredData);

    setText("riskHigh", formatNumber(summary.highRisk));
    setText("riskMedium", formatNumber(summary.mediumRisk));
    setText("riskLow", formatNumber(summary.lowRisk));
    setText("riskZeroProgress", formatNumber(summary.zeroProgress));
    setText("riskHighOpen", formatNumber(summary.highOpen));

    renderRiskDistributionChart(summary);

    renderLeaderboard(
      "listHighRisk",
      filteredData.slice(0, 10),
      function (item, index) {
        return {
          rank: index + 1,
          title: item.pplNama,
          sub: item.kecamatan + " · " + formatPercent(item.persenRealisasi),
          value: formatNumber(item.riskScore),
          valueClass: item.riskScore >= 70 ? "bad" : "",
        };
      },
    );

    renderTableRisk(filteredData);
  }

  function filterRiskData(data) {
    const kecamatan = APP_STATE.filters.riskKecamatan;
    const riskLevel = APP_STATE.filters.riskLevel;
    const status = APP_STATE.filters.riskStatus;
    const issue = APP_STATE.filters.riskIssue;

    return data.filter(function (item) {
      let ok = true;
      if (kecamatan)
        ok = ok && rowHasValue(item, "kecamatanList", "kecamatan", kecamatan);
      if (riskLevel) ok = ok && item.riskLabel === riskLevel;
      if (status) ok = ok && item.status === status;
      if (issue === "open_high")
        ok =
          ok &&
          item.targetFasih &&
          item.open / item.targetFasih >= getOpenHighRatio();
      if (issue === "draft_high") ok = ok && isDraftHigh(item);
      if (issue === "zero_progress") ok = ok && Number(item.berhasilDidata || 0) === 0;
      return ok;
    });
  }

  function buildRiskSummary(data) {
    return {
      highRisk: data.filter((item) => item.riskScore >= 70).length,
      mediumRisk: data.filter(
        (item) => item.riskScore >= 40 && item.riskScore < 70,
      ).length,
      lowRisk: data.filter((item) => item.riskScore < 40).length,
      zeroProgress: data.filter((item) => Number(item.berhasilDidata || 0) === 0)
        .length,
      highOpen: data.filter(
        (item) =>
          item.targetFasih && item.open / item.targetFasih >= getOpenHighRatio(),
      ).length,
    };
  }

  function makeChart(canvasId, config) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    if (APP_STATE.charts[canvasId]) {
      APP_STATE.charts[canvasId].destroy();
    }

    APP_STATE.charts[canvasId] = new Chart(canvas, config);
  }

  function horizontalBarOptions(formatter, stacked = false) {
    const theme = chartThemeColors();

    return {
      indexAxis: "y",
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: stacked,
          labels: { color: theme.legend, usePointStyle: true },
        },
        tooltip: {
          callbacks: {
            label: function (context) {
              return context.dataset.label + ": " + formatter(context.raw);
            },
          },
        },
      },
      scales: {
        x: {
          stacked: stacked,
          ticks: { color: theme.muted },
          grid: { color: theme.grid },
        },
        y: {
          stacked: stacked,
          ticks: {
            color: theme.text,
            font: { size: 11, weight: "700" },
            callback: function (value) {
              return shorten(this.getLabelForValue(value), 24);
            },
          },
          grid: { display: false },
        },
      },
    };
  }

  function doughnutOptions() {
    const theme = chartThemeColors();

    return {
      responsive: true,
      maintainAspectRatio: false,
      cutout: "68%",
      plugins: {
        legend: {
          position: "bottom",
          labels: {
            color: theme.text,
            usePointStyle: true,
            padding: 16,
          },
        },
      },
    };
  }

  function riskDistributionOptions() {
    const theme = chartThemeColors();

    return {
      indexAxis: "y",
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function (context) {
              return "Jumlah PPL: " + formatNumber(context.raw);
            },
          },
        },
      },
      scales: {
        x: {
          beginAtZero: true,
          ticks: {
            color: theme.muted,
            precision: 0,
          },
          grid: { color: theme.grid },
        },
        y: {
          ticks: {
            color: theme.text,
            font: { size: 13, weight: "800" },
          },
          grid: { display: false },
        },
      },
    };
  }

  function chartThemeColors() {
    const isLight = document.body.classList.contains("theme-light");

    return {
      text: isLight ? "#0f172a" : "#f8fafc",
      muted: isLight ? "#475569" : "#cbd5e1",
      legend: isLight ? "#1f2937" : "#e5e7eb",
      grid: isLight ? "rgba(15, 23, 42, 0.1)" : "rgba(255,255,255,.08)",
    };
  }

  function bindNavigation() {
    document.querySelectorAll(".nav-item").forEach(function (button) {
      const label = button.querySelector("span");
      if (label) button.setAttribute("title", label.textContent.trim());

      button.addEventListener("click", function () {
        switchSection(button.getAttribute("data-section"));
        closeMobileSidebar();
      });
    });

    document.querySelectorAll("[data-section-jump]").forEach(function (button) {
      button.addEventListener("click", function () {
        switchSection(button.getAttribute("data-section-jump"));
        closeMobileSidebar();
      });
    });
  }

  function switchSection(section) {
    APP_STATE.currentSection = section;

    document.querySelectorAll(".nav-item").forEach(function (button) {
      button.classList.toggle(
        "active",
        button.getAttribute("data-section") === section,
      );
    });

    document.querySelectorAll(".page-section").forEach(function (el) {
      el.classList.toggle("active", el.id === "section-" + section);
    });

    setTimeout(function () {
      Object.values(APP_STATE.charts).forEach((chart) => {
        try {
          chart.resize();
        } catch (e) {}
      });

      Object.values(APP_STATE.tables).forEach((table) => {
        try {
          table.columns.adjust();
        } catch (e) {}
      });
    }, 150);
  }

    document.querySelectorAll("[data-petugas-quick]").forEach(function (button) {
      button.addEventListener("click", function () {
        applyPetugasQuickFilter(button.getAttribute("data-petugas-quick"));
      });

      button.addEventListener("click", function () {

      });
    });

    document.addEventListener("click", function (event) {
      const button = event.target.closest("[data-sls-jump]");
      if (!button) return;
      jumpToSlsDetail(button.getAttribute("data-sls-jump"));
    });

    bindClick("btnCopyJson", copyJsonPayload);
    bindClick("btnDownloadJson", downloadJsonPayload);

    const globalSearch = document.getElementById("globalSearch");
    if (globalSearch) {
      globalSearch.addEventListener(
        "input",
        debounce(function () {
          APP_STATE.globalSearch = globalSearch.value.trim();
          applyGlobalSearch();
        }, 250),
      );
    }

    bindClick("btnClearSearch", function () {
      if (!globalSearch) return;
      globalSearch.value = "";
      APP_STATE.globalSearch = "";
      applyGlobalSearch();
      globalSearch.focus();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key !== "/" || event.ctrlKey || event.metaKey || event.altKey) {
        return;
      }

      const tag = document.activeElement
        ? document.activeElement.tagName.toLowerCase()
        : "";
      if (tag === "input" || tag === "textarea" || tag === "select") return;

      event.preventDefault();
      if (globalSearch) globalSearch.focus();
    });
  }

      renderRisk(APP_STATE.payload.petugas);
    });
  }

  function applyPetugasQuickFilter(type) {
    if (type === "reset") {
      APP_STATE.filters.petugasKecamatan = "";
      APP_STATE.filters.petugasStatus = "";
      APP_STATE.filters.petugasIssue = "";
    } else if (type === "KRITIS") {
      APP_STATE.filters.petugasStatus = "KRITIS";
      APP_STATE.filters.petugasIssue = "";
    } else {
      APP_STATE.filters.petugasStatus = "";
      APP_STATE.filters.petugasIssue = type;
    }

    syncFilterControl("filterPetugasKecamatan", APP_STATE.filters.petugasKecamatan);
    syncFilterControl("filterPetugasStatus", APP_STATE.filters.petugasStatus);
    syncFilterControl("filterPetugasIssue", APP_STATE.filters.petugasIssue);
    renderPetugas(APP_STATE.payload.petugas);
  }

  function applyPmlQuickFilter(type) {
    if (type === "reset") {
      APP_STATE.filters.pmlKecamatan = "";
      APP_STATE.filters.pmlStatus = "";
      APP_STATE.filters.pmlIssue = "";
    } else if (type === "KRITIS") {
      APP_STATE.filters.pmlStatus = "KRITIS";
      APP_STATE.filters.pmlIssue = "";
    } else {
      APP_STATE.filters.pmlStatus = "";
      APP_STATE.filters.pmlIssue = type;
    }

    syncFilterControl("filterPmlKecamatan", APP_STATE.filters.pmlKecamatan);
    syncFilterControl("filterPmlStatus", APP_STATE.filters.pmlStatus);
    syncFilterControl("filterPmlIssue", APP_STATE.filters.pmlIssue);
    renderPml(APP_STATE.payload.petugas);
  }

  function syncFilterControl(id, value) {
    const el = document.getElementById(id);
    if (el) el.value = value || "";
  }

  function rowHasValue(item, field, fallbackField, expectedValue) {
    return getRowValues(item, field, fallbackField).includes(expectedValue);
  }

  function getOpenHighRatio() {
    const ratio = Number(APP_STATE.payload?.petugas?.meta?.openHighRatio);
    return ratio || 0.75;
  }

  function getDraftHighRatio() {
    const ratio = Number(APP_STATE.payload?.petugas?.meta?.draftHighRatio);
    return ratio || 0.25;
  }

  function getDraftHighMin() {
    const min = Number(APP_STATE.payload?.petugas?.meta?.draftHighMin);
    return min || 10;
  }

  function isDraftHigh(item) {
    const draft = Number(item?.draft || 0);
    const target = Number(item?.targetFasih || 0);
    return draft >= getDraftHighMin() || (!!target && draft / target >= getDraftHighRatio());
  }

  function getLatestFieldText(rows, field) {
    const found = rows
      .map((item) => safe(item && item[field], ""))
      .filter(Boolean)
      .pop();
    return found || "-";
  }

  function getFreshnessLabel(datetimeText) {
    const parsed = parseDashboardDate(datetimeText);
    if (!parsed) return datetimeText && datetimeText !== "-" ? "Cek manual" : "Tidak ada";

    const ageHours = (Date.now() - parsed.getTime()) / 36e5;
    if (ageHours > 24) return "Perlu cek >24j";
    if (ageHours < -1) return "Cek tanggal";
    return "Aktual <24j";
  }

  function parseDashboardDate(value) {
    const text = safe(value, "");
    let match = text.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})(?:\s+(\d{1,2})[:.](\d{1,2}))?/);
    if (match) {
      return new Date(
        Number(match[3]),
        Number(match[2]) - 1,
        Number(match[1]),
        Number(match[4] || 0),
        Number(match[5] || 0),
      );
    }

    match = text.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})(?:\s+(\d{1,2})[:.](\d{1,2}))?/);
    if (match) {
      return new Date(
        Number(match[1]),
        Number(match[2]) - 1,
        Number(match[3]),
        Number(match[4] || 0),
        Number(match[5] || 0),
      );
    }

    return null;
  }

  function applyGlobalSearch() {
    const search = APP_STATE.globalSearch || "";

    Object.values(APP_STATE.tables).forEach(function (table) {
      try {
        table.search(search).draw();
      } catch (e) {}
    });
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  function exportCurrentSection() {
    const section = APP_STATE.currentSection;

    if (section === "kecamatan") return exportTable("tableKecamatan");
    if (section === "petugas") return exportTable("tablePetugas");
    if (section === "pml") return exportTable("tablePml");
    if (section === "sls") return exportTable("tableSls");
    if (section === "risk") return exportTable("tableRisk");

    showToast(
      "Export",
      "Masuk ke halaman tabel yang ingin diekspor.",
      "warning",
    );
  }

  function exportTable(tableId) {
    const table = APP_STATE.tables[tableId];

    if (!table) {
      showToast("Export gagal", "Tabel belum tersedia.", "warning");
      return;
    }

    try {
      table.button(".buttons-excel").trigger();
    } catch (e) {
      showToast("Export gagal", "Tombol export belum siap.", "warning");
    }
  }

  function copyJsonPayload() {
    if (!APP_STATE.payload) return;

    navigator.clipboard
      .writeText(JSON.stringify(APP_STATE.payload, null, 2))
      .then(function () {
        showToast("JSON disalin", "Payload dashboard berhasil disalin.");
      })
      .catch(function () {
        showToast("Copy gagal", "Browser menolak akses clipboard.", "warning");
      });
  }

  function downloadJsonPayload() {
    if (!APP_STATE.payload) return;

    const blob = new Blob([JSON.stringify(APP_STATE.payload, null, 2)], {
      type: "application/json",
    });

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "dashboard-bps-bireuen.json";
    a.click();

    URL.revokeObjectURL(url);
  }

  /* =========================================================
   LEADERBOARD
========================================================= */

  function renderLeaderboard(elementId, data, mapper) {
    const el = document.getElementById(elementId);
    if (!el) return;

    if (!data || !data.length) {
      el.innerHTML = emptyBox("Belum ada data.");
      return;
    }

    el.innerHTML = data
      .map(function (item, index) {
        const row = mapper(item, index);

        return `
      <div class="leader-item">
        <div class="leader-rank">${escapeHtml(row.rank)}</div>
        <div>
          <div class="leader-title" title="${escapeHtml(row.title)}">${escapeHtml(row.title)}</div>
          <div class="leader-sub" title="${escapeHtml(row.sub)}">${escapeHtml(row.sub)}</div>
        </div>
        <div class="leader-value ${cssClassToken(row.valueClass)}">${escapeHtml(row.value)}</div>
      </div>
    `;
      })
      .join("");
  }

  function emptyBox(text) {
    return `
    <div class="leader-item">
      <div class="leader-rank">-</div>
      <div>
        <div class="leader-title">${escapeHtml(text)}</div>
        <div class="leader-sub">Tidak ada data untuk ditampilkan.</div>
      </div>
      <div class="leader-value">-</div>
    </div>
  `;
  }

  /* =========================================================
   DATATABLE
========================================================= */

  function destroyTable(tableId) {
    if (APP_STATE.tables[tableId]) {
      try {
        APP_STATE.tables[tableId].clear();
        APP_STATE.tables[tableId].destroy();
      } catch (e) {}

      APP_STATE.tables[tableId] = null;
    }

    const table = document.getElementById(tableId);
    if (table) {
      const tbody = table.querySelector("tbody");
      if (tbody) tbody.innerHTML = "";
    }
  }

  function tableButtons(filename) {
    return [
      { extend: "copy", title: filename },
      { extend: "excel", title: filename, filename: filename },
      { extend: "csv", title: filename, filename: filename },
      { extend: "print", title: filename },
    ];
  }

  function datatableLanguage() {
    return {
      search: "Cari:",
      lengthMenu: "Tampilkan _MENU_ data",
      info: "Menampilkan _START_ sampai _END_ dari _TOTAL_ data",
      infoEmpty: "Tidak ada data",
      zeroRecords: "Tidak ada data yang cocok",
      emptyTable: "Tabel kosong",
      paginate: {
        first: "Awal",
        last: "Akhir",
        next: "Berikutnya",
        previous: "Sebelumnya",
      },
    };
  }

  /* =========================================================
   RENDER FORMATTERS
========================================================= */

  function textRenderer(value, type) {
    if (type !== "display") return value || "";
    return escapeHtml(value || "-");
  }

  function jumpToSlsDetail(query) {
    APP_STATE.globalSearch = safe(query, "");
    const input = document.getElementById("globalSearch");
    if (input) input.value = APP_STATE.globalSearch;
    switchSection("sls");
    applyGlobalSearch();
  }

  function boldText(value, type) {
    if (type !== "display") return value || "";
    return "<b>" + escapeHtml(value || "-") + "</b>";
  }

  function emailText(value, type) {
    if (type !== "display") return value || "";
    if (!value) return "-";
    return `<span title="${escapeHtml(value)}">${escapeHtml(shorten(value, 28))}</span>`;
  }

  function numberRenderer(value, type) {
    if (type !== "display") return Number(value || 0);
    return formatNumber(value);
  }

  function percentRenderer(value, type) {
    if (type !== "display") return Number(value || 0);
    return percentCell(value);
  }

  function deltaPercentRenderer(value, type) {
    if (type !== "display") return Number(value || 0);
    return percentDeltaCell(value);
  }

  function riskScoreRenderer(value, type) {
    if (type !== "display") return Number(value || 0);
    return riskScoreCell(value);
  }

  function percentCell(value) {
    const n = Number(value || 0);

    if (n >= 20) return `<span class="text-good">${formatPercent(n)}</span>`;
    if (n >= 10) return `<span class="text-warn">${formatPercent(n)}</span>`;

    return `<span class="text-bad">${formatPercent(n)}</span>`;
  }

  function percentDeltaCell(value) {
    const n = Number(value || 0);

    if (n >= 0) return `<span class="text-good">${formatPercent(n)}</span>`;
    return `<span class="text-bad">${formatPercent(n)}</span>`;
  }

  function riskScoreCell(value) {
    const n = Number(value || 0);

    if (n >= 70) return `<span class="text-bad">${formatNumber(n)}</span>`;
    if (n >= 40) return `<span class="text-warn">${formatNumber(n)}</span>`;

    return `<span class="text-good">${formatNumber(n)}</span>`;
  }

  function renderKecamatanStatusBadge(status) {
    const s = cssClassToken(status);
    return `<span class="badge-status ${s}">${escapeHtml(status || "-")}</span>`;
  }

  function renderPetugasStatusBadge(status) {
    const s = cssClassToken(status);
    return `<span class="badge-status ${s}">${escapeHtml(status || "-")}</span>`;
  }

  function renderRiskBadge(value) {
    const s = cssClassToken(value);
    return `<span class="badge-risk ${s}">${escapeHtml(value || "-")}</span>`;
  }

  function renderSlsJumpButton(query) {
    const value = escapeHtml(safe(query, ""));
    if (!value) return "-";
    return `<button type="button" class="ghost-btn table-action-btn" data-sls-jump="${value}">Lihat SLS</button>`;
  }

  /* =========================================================
   HELPERS
========================================================= */

  function setText(id, value) {
    const el = document.getElementById(id);
    if (el) el.innerText = value === undefined || value === null ? "-" : value;
  }

  function setHtml(id, html) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = html;
  }

  function sumBy(rows, field) {
    return rows.reduce(function (total, item) {
      return total + Number((item && item[field]) || 0);
    }, 0);
  }

  function calculatePercent(numerator, denominator) {
    const n = Number(numerator || 0);
    const d = Number(denominator || 0);
    return d ? (n / d) * 100 : 0;
  }

  function safe(value, fallback) {
    return value === undefined || value === null || value === ""
      ? fallback
      : value;
  }

  function formatNumber(value) {
    return new Intl.NumberFormat("id-ID").format(Number(value || 0));
  }

  function formatPercent(value) {
    return (
      new Intl.NumberFormat("id-ID", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      }).format(Number(value || 0)) + "%"
    );
  }

  function shorten(text, max) {
    const value = String(text || "");
    if (value.length <= max) return value;
    return value.substring(0, max - 3) + "...";
  }

  function escapeHtml(value) {
    return String(value === undefined || value === null ? "" : value)
      .replace(/&(?!(amp|lt|gt|quot|#039);)/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function cssClassToken(value) {
    return String(value || "")
      .toLowerCase()
      .replace(/[^a-z0-9_-]/g, "");
  }

  function debounce(fn, delay) {
    let timer = null;

    return function () {
      const args = arguments;
      const context = this;

      clearTimeout(timer);
      timer = setTimeout(function () {
        fn.apply(context, args);
      }, delay);
    };
  }

  function bindClick(id, handler) {
    const el = document.getElementById(id);
    if (el) el.addEventListener("click", handler);
  }

  function bindChange(id, handler) {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener("change", function () {
        handler(this.value);
      });
    }
  }

  function addClass(id, className) {
    const el = document.getElementById(id);
    if (!el || !className) return;
    el.classList.add(className);
  }

  function removeClass(id, className) {
    const el = document.getElementById(id);
    if (!el || !className) return;
    el.classList.remove(className);
  }

  /* =========================================================
   TOAST
========================================================= */

  function showToast(title, body, type = "info") {
    const toastEl = document.getElementById("appToast");

    if (!toastEl || typeof bootstrap === "undefined") {
      console.log(title, body);
      return;
    }

    setText("toastTitle", title);
    setText("toastBody", body);
    setText("toastTime", "baru saja");

    const toast = bootstrap.Toast.getOrCreateInstance(toastEl, {
      delay: type === "warning" ? 6500 : 3200,
    });

    toast.show();
  }
</script>
