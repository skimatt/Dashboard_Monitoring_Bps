<script>
  /* =========================================================
   DASHBOARD MONITORING BPS BIREUEN - JS FINAL V2.4
   Compatible with Code.gs V2.4 + index.html SaaS Final
========================================================= */

  let APP_STATE = {
    payload: null,
    sls: null,
    currentSection: "overview",
    charts: {},
    tables: {},
    globalSearch: "",
    aiBriefText: "",
    aiAnswerText: "",
    aiDefaultPrompt: "",
    sidebarCollapsed: false,
    themeMode: "dark",
    mapMode: "status",
    selectedKecamatan: "",
    filters: {
      kecamatanStatus: "",
      petugasKecamatan: "",
      petugasStatus: "",
      petugasIssue: "",
      pmlKecamatan: "",
      pmlStatus: "",
      pmlIssue: "",
      slsKecamatan: "",
      slsStatus: "",
      riskKecamatan: "",
      riskLevel: "",
      riskStatus: "",
      riskIssue: "",
    },
  };

  let leafMap = null;
  let network = null;
  let hierarchyFallbackState = null;
  const OPTIONAL_SCRIPT_STATE = {};
  const PETUGAS_LEADERBOARD_LIMIT = 10;

  window.APP_STATE = APP_STATE;

  /* =========================================================
   INIT
========================================================= */

  document.addEventListener("DOMContentLoaded", function () {
    initShellUi();
    bindNavigation();
    bindActions();
    bindFilters();

    loadSuperDashboard(true);

    setInterval(function () {
      loadSuperDashboard(false);
    }, 300000);
  });

  /* =========================================================
   DATA LOADER
========================================================= */

  function loadSuperDashboard(showLoading = true) {
    if (showLoading) showLoadingState();

    google.script.run
      .withSuccessHandler(function (payload) {
        if (!payload || payload.success === false) {
          hideLoadingState();
          showErrorState(
            payload && payload.error
              ? payload.error
              : "Data dashboard tidak dapat dimuat.",
          );
          return;
        }

        payload.sls = payload.sls || emptySlsPayload("Data SLS tidak tersedia.");
        APP_STATE.payload = payload;
        APP_STATE.sls = payload.sls;

        hideLoadingState();
        renderAll(payload);
        showToast(
          "Data diperbarui",
          "Dashboard berhasil membaca sheet Progres dan Petugas.",
        );
      })
      .withFailureHandler(function (error) {
        hideLoadingState();
        showErrorState(
          error && error.message
            ? error.message
            : "Terjadi kesalahan pada server. Silakan hubungi administrator.",
        );
        console.error(error);
      })
      .getSuperDashboardData();
  }

  function emptySlsPayload(message) {
    return {
      success: false,
      source: "EMPTY",
      module: "SLS",
      message: message || "Data SLS tidak tersedia.",
      summary: {},
      ranking: {},
      data: [],
    };
  }

  function showLoadingState() {
    const loadingEl = document.getElementById("loadingState");
    if (loadingEl) loadingEl.setAttribute("aria-busy", "true");
    addClass("loadingState", "");
    removeClass("loadingState", "d-none");
    addClass("errorState", "d-none");
    addClass("dashboardContent", "d-none");
  }

  function hideLoadingState() {
    const loadingEl = document.getElementById("loadingState");
    if (loadingEl) loadingEl.setAttribute("aria-busy", "false");
    addClass("loadingState", "d-none");
    removeClass("dashboardContent", "d-none");
  }

  function showErrorState(error) {
    removeClass("errorState", "d-none");
    addClass("dashboardContent", "d-none");

    const message =
      error && error.message ? error.message : String(error || "Unknown error");
    setText("errorMessage", message);
  }

  /* =========================================================
   MAIN RENDER
========================================================= */

  function renderAll(payload) {
    if (!payload || payload.success === false) {
      showErrorState(
        payload && payload.error
          ? payload.error
          : "Payload dashboard tidak valid.",
      );
      return;
    }

    renderSystem(payload);
    populateOperationalFilters(payload);
    renderDataAudit(payload);
    renderOverview(payload);
    renderKecamatan(payload.kecamatan);
    renderPetugas(payload.petugas);
    renderPml(payload.petugas);
    renderSls(payload.sls);
    renderRisk(payload.petugas);
    renderInsightAi(payload);
    renderRaw(payload);

    initPredictiveAnalytics(payload);
    initPredictiveMap(payload);
    initHierarchyNetwork(payload);

    applyGlobalSearch();
  }

  function populateOperationalFilters(payload) {
    const petugasRows = payload?.petugas?.data || [];
    const pmlRows = payload?.petugas?.pml?.data || [];
    const slsRows = payload?.sls?.data || [];
    const riskRows = payload?.petugas?.risk?.data || payload?.petugas?.data || [];

    populateSelectOptions(
      "filterPetugasKecamatan",
      getUniqueFieldValues(petugasRows, "kecamatanList", "kecamatan"),
      APP_STATE.filters.petugasKecamatan,
    );
    populateSelectOptions(
      "filterPmlKecamatan",
      getUniqueFieldValues(pmlRows, "kecamatanList", "kecamatan"),
      APP_STATE.filters.pmlKecamatan,
    );
    populateSelectOptions(
      "filterSlsKecamatan",
      getUniqueFieldValues(slsRows, "kecamatan"),
      APP_STATE.filters.slsKecamatan,
    );
    populateSelectOptions(
      "filterRiskKecamatan",
      getUniqueFieldValues(riskRows, "kecamatanList", "kecamatan"),
      APP_STATE.filters.riskKecamatan,
    );
  }

  function populateSelectOptions(id, values, selectedValue) {
    const el = document.getElementById(id);
    if (!el) return;

    const firstLabel = el.options && el.options[0] ? el.options[0].textContent : "Semua";
    const valueToKeep = selectedValue || el.value || "";

    el.innerHTML = "";
    const defaultOption = document.createElement("option");
    defaultOption.value = "";
    defaultOption.textContent = firstLabel;
    el.appendChild(defaultOption);

    values.forEach(function (value) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      el.appendChild(option);
    });

    el.value = values.includes(valueToKeep) ? valueToKeep : "";
  }

  function getUniqueFieldValues(rows, field, fallbackField) {
    return Array.from(
      new Set(
        rows
          .flatMap((item) => getRowValues(item, field, fallbackField))
          .filter(Boolean),
      ),
    ).sort((a, b) => a.localeCompare(b, "id"));
  }

  function getRowValues(item, field, fallbackField) {
    if (!item) return [];

    const rawValue = item[field];
    if (Array.isArray(rawValue)) {
      return rawValue.map((value) => safe(value, "").trim()).filter(Boolean);
    }

    if (rawValue) {
      return [safe(rawValue, "").trim()].filter(Boolean);
    }

    if (!fallbackField) return [];

    return safe(item[fallbackField], "")
      .split(",")
      .map((value) => value.trim())
      .filter(Boolean);
  }

  function renderSystem(payload) {
    const kecamatan = payload.kecamatan || {};
    const petugas = payload.petugas || {};
    const sls = payload.sls || {};

    setText(
      "kondisiData",
      safe(kecamatan.meta?.kondisiData, "Data kondisi tidak terbaca"),
    );
    setText("lastSync", safe(payload.generatedAt, "-"));
    setText("topbarLastSync", safe(payload.generatedAt, "-"));
    setText("lastPetugasDatetime", getLatestFieldText(sls.data || [], "datetime"));
    setText(
      "targetHarian",
      formatPercent(kecamatan.summary?.targetHarian || 0),
    );
    setText("dataMode", "Sheets");

    setText("diagVersion", payload.version || "-");
    setText("diagKecamatanSource", safe(kecamatan.source, "-"));
    setText("diagPetugasSource", safe(petugas.source, "-"));
    setText(
      "diagPetugasRows",
      formatNumber(petugas.meta?.totalRows || petugas.data?.length || 0),
    );

    if (kecamatan.success && petugas.success) {
      setText("sourceStatus", "Sheets OK");
      setText("topbarSourceStatus", "Sheets OK");
      setSourceDot("ok");
    } else if (kecamatan.success || petugas.success || sls.success) {
      setText("sourceStatus", "Sebagian OK");
      setText("topbarSourceStatus", "Sebagian OK");
      setSourceDot("warn");
    } else {
      setText("sourceStatus", "Gagal");
      setText("topbarSourceStatus", "Gagal");
      setSourceDot("bad");
    }
  }

  function renderDataAudit(payload) {
    const petugas = payload.petugas || {};
    const sls = payload.sls || {};
    const petugasRows = petugas.data || [];
    const pmlRows = petugas.pml?.data || [];
    const slsRows = sls.data || [];
    const auditPersen = sls.summary?.auditPersen || {};

    setText("auditMismatchSls", formatNumber(auditPersen.totalMismatch || 0));
    setText(
      "auditUnknownKecamatan",
      formatNumber(
        slsRows.filter((item) => item.kecamatan === "TIDAK DIKETAHUI").length,
      ),
    );
    setText(
      "auditPplNoEmail",
      formatNumber(petugasRows.filter((item) => !item.pplEmail).length),
    );
    setText(
      "auditPmlNoEmail",
      formatNumber(pmlRows.filter((item) => !item.pmlEmail).length),
    );
    setText(
      "auditTargetZero",
      formatNumber(slsRows.filter((item) => Number(item.targetFasih || 0) === 0).length),
    );
    setText("auditLastGenerated", safe(payload.generatedAt, "-"));
    setText("auditDataStale", getFreshnessLabel(getLatestFieldText(slsRows, "datetime")));
  }

  function setSourceDot(type) {
    const el = document.getElementById("sourceDot");
    if (!el) return;

    el.className = "source-dot";
    if (type === "ok") el.classList.add("ok");
    if (type === "bad") el.classList.add("bad");
  }

  /* =========================================================
   OVERVIEW
========================================================= */

  function renderOverview(payload) {
    const kecamatan = payload.kecamatan || {};
    const petugas = payload.petugas || {};
    const ks = kecamatan.summary || {};
    const ps = petugas.summary || {};

    setText("kpiTotalPrelist", formatNumber(ks.totalPrelist));
    setText("kpiTotalSubmit", formatNumber(ks.totalSubmit));
    setText("kpiTotalApprove", formatNumber(ks.totalApprove));
    setText("kpiTotalPPL", formatNumber(ks.totalPPL));

    setText("kpiSubmitCoverage", "Coverage " + formatPercent(ks.percentSubmit));
    setText(
      "kpiApproveCoverage",
      "Approve " + formatPercent(ks.percentApprove),
    );
    setText(
      "kpiTotalKecamatan",
      formatNumber(ks.totalKecamatan) + " kecamatan",
    );

    setText("miniKecamatanAman", formatNumber(ks.aboveTarget));
    setText("miniKecamatanBelow", formatNumber(ks.belowTarget));

    setText("miniPplElite", formatNumber(ps.elite));
    setText("miniPplKritis", formatNumber(ps.kritis));
    setText("miniTotalOpen", formatNumber(ps.totalOpen));
    setText("miniTotalDraft", formatNumber(ps.totalDraft));
    setText("insightOpenRate", formatPercent(ps.openRate));
    setText("insightDraftRate", formatPercent(ps.draftRate));
    setText("insightActivePpl", formatNumber(ps.activePPL));
    setText("insightTotalSls", formatNumber(ps.totalSLS));

    setText("miniApprovalBacklog", "0");
    setText("miniRejected", "0");

    setText("legendAboveTarget", formatNumber(ks.aboveTarget));
    setText("legendBelowTarget", formatNumber(ks.belowTarget));

    setText("qualityTotalOpen", formatNumber(ps.totalOpen));
    setText("qualityTotalDraft", formatNumber(ps.totalDraft));
    setText("qualityOpenRate", formatPercent(ps.openRate));
    setText("qualityDraftRate", formatPercent(ps.draftRate));

    setText("qualityApprovalRate", "0%");
    setText("qualityRejectedRate", "0%");

    renderKecamatanSubmitChart(
      kecamatan.rankingSubmit || [],
      ks.targetHarian || 0,
    );
    renderKecamatanStatusChart(ks);
    renderPetugasStatusChart(ps);
  }

  /* =========================================================
   KECAMATAN
========================================================= */

  function renderKecamatan(kecamatan) {
    if (!kecamatan || !kecamatan.success) {
      renderTableKecamatan([]);
      return;
    }

    const summary = kecamatan.summary || {};
    const data = kecamatan.data || [];

    renderLeaderboard(
      "listTopKecamatan",
      (kecamatan.rankingSubmit || []).slice(0, 7),
      function (item, index) {
        return {
          rank: index + 1,
          title: item.kecamatan,
          sub:
            formatNumber(item.submit) +
            " submit · " +
            formatNumber(item.jumlahPPL) +
            " PPL",
          value: formatPercent(item.percentSubmit),
          valueClass:
            item.percentSubmit >= summary.targetHarian ? "good" : "bad",
        };
      },
    );

    renderLeaderboard(
      "listWarningKecamatan",
      (kecamatan.warningList || []).slice(0, 7),
      function (item, index) {
        return {
          rank: index + 1,
          title: item.kecamatan,
          sub: "Selisih " + formatPercent(item.selisihPercent) + " dari target",
          value: formatPercent(item.percentSubmit),
          valueClass:
            item.percentSubmit >= summary.targetHarian ? "good" : "bad",
        };
      },
    );

    renderLeaderboard(
      "listBacklogKecamatan",
      (kecamatan.backlogList || []).slice(0, 7),
      function (item, index) {
        return {
          rank: index + 1,
          title: item.kecamatan,
          sub:
            formatNumber(item.submit) +
            " submit · " +
            formatNumber(item.approve) +
            " approve",
          value: formatNumber(item.approvalBacklog),
          valueClass: item.approvalBacklog > 1000 ? "bad" : "",
        };
      },
    );

    const filtered = data.filter(function (item) {
      return (
        !APP_STATE.filters.kecamatanStatus ||
        item.status === APP_STATE.filters.kecamatanStatus
      );
    });

    renderTableKecamatan(filtered);
  }

  function renderTableKecamatan(data) {
    destroyTable("tableKecamatan");

    APP_STATE.tables.tableKecamatan = $("#tableKecamatan").DataTable({
      data: data,
      pageLength: 17,
      lengthMenu: [10, 17, 25, 50],
      dom: "Bfrtip",
      buttons: tableButtons("Kecamatan_Bireuen"),
      order: [[4, "desc"]],
      columns: [
        { data: "kode", render: textRenderer },
        { data: "kecamatan", render: boldText },
        { data: "prelist", render: numberRenderer },
        { data: "submit", render: numberRenderer },
        { data: "percentSubmit", render: percentRenderer },
        { data: "selisihPercent", render: deltaPercentRenderer },
        { data: "approve", render: numberRenderer },
        { data: "percentApprove", render: percentRenderer },
        { data: "jumlahPPL", render: numberRenderer },
        { data: "approvalBacklog", render: numberRenderer },
        { data: "status", render: renderKecamatanStatusBadge },
      ],
      language: datatableLanguage(),
    });
  }

  /* =========================================================
   PETUGAS / PPL
========================================================= */

  function renderPetugas(petugas) {
    if (!petugas || !petugas.success) {
      renderPetugasUnavailable(petugas);
      return;
    }

    const summary = petugas.summary || {};
    const data = petugas.data || [];
    const filteredData = filterPetugasData(data);
    const topRealisasi = filteredData
      .slice()
      .sort((a, b) => Number(b.persenRealisasi || 0) - Number(a.persenRealisasi || 0));
    const bottomRealisasi = filteredData
      .slice()
      .sort((a, b) => Number(a.persenRealisasi || 0) - Number(b.persenRealisasi || 0));
    const highestRisk = filteredData
      .slice()
      .sort((a, b) => Number(b.riskScore || 0) - Number(a.riskScore || 0));
    const topPetugasRows = topRealisasi.slice(0, PETUGAS_LEADERBOARD_LIMIT);
    const bottomPetugasRows = bottomRealisasi.slice(0, PETUGAS_LEADERBOARD_LIMIT);
    const riskPetugasRows = highestRisk.slice(0, PETUGAS_LEADERBOARD_LIMIT);

    setText("pplTotalLive", formatNumber(summary.totalPPL));
    setText("pplTotalPml", formatNumber(summary.totalPML));
    setText("pplTotalSls", formatNumber(summary.totalSLS));
    setText("pplTotalTarget", formatNumber(summary.totalTarget));
    setText("pplTotalBerhasil", formatNumber(summary.totalBerhasil));
    setText("pplPersenRealisasi", formatPercent(summary.persenRealisasi));
    setText("pplMedianRealisasi", formatPercent(summary.medianPercent));

    renderPetugasCardSummary("pplTop", topPetugasRows);
    renderLeaderboard(
      "listTopPetugas",
      topPetugasRows,
      function (item, index) {
        return buildPetugasLeaderboardRow(
          item,
          index,
          formatPercent(item.persenRealisasi),
          "good",
        );
      },
    );

    renderPetugasCardSummary("pplDorongan", bottomPetugasRows);
    renderLeaderboard(
      "listBottomPetugas",
      bottomPetugasRows,
      function (item, index) {
        return buildPetugasLeaderboardRow(
          item,
          index,
          formatPercent(item.persenRealisasi),
          "bad",
        );
      },
    );

    renderPetugasCardSummary("pplRisk", riskPetugasRows);
    renderLeaderboard(
      "listRiskPetugas",
      riskPetugasRows,
      function (item, index) {
        return buildPetugasLeaderboardRow(
          item,
          index,
          formatNumber(item.riskScore),
          item.riskScore >= 70 ? "bad" : "warn",
        );
      },
    );

    renderPetugasFilterSummary(filteredData, data);
    renderTopPetugasChart(topRealisasi);
    renderPetugasOpenBerhasilChart(highestRisk.slice(0, 15));

    renderTablePetugas(filteredData);
  }

  function renderPetugasUnavailable(petugas) {
    setText("pplTotalLive", "0");
    setText("pplTotalPml", "0");
    setText("pplTotalSls", "0");
    setText("pplTotalTarget", "0");
    setText("pplTotalBerhasil", "0");
    setText("pplPersenRealisasi", "0%");
    setText("pplMedianRealisasi", "0%");

    renderPetugasCardSummary("pplTop", []);
    renderPetugasCardSummary("pplDorongan", []);
    renderPetugasCardSummary("pplRisk", []);
    setHtml("listTopPetugas", emptyBox("Data petugas belum tersedia."));
    setHtml(
      "listBottomPetugas",
      emptyBox("Cek sheet Petugas dan header export SERASI."),
    );
    setHtml("listRiskPetugas", emptyBox("Risk belum dapat dihitung."));

    renderTablePetugas([]);

    showToast(
      "Petugas tidak tersedia",
      safe(petugas?.message, "Sheet Petugas belum terbaca."),
      "warning",
    );
  }

  function filterPetugasData(data) {
    const kecamatan = APP_STATE.filters.petugasKecamatan;
    const status = APP_STATE.filters.petugasStatus;
    const issue = APP_STATE.filters.petugasIssue;

    return data.filter(function (item) {
      let ok = true;

      if (kecamatan)
        ok = ok && rowHasValue(item, "kecamatanList", "kecamatan", kecamatan);
      if (status) ok = ok && item.status === status;

      if (issue === "draft" || issue === "draft_high")
        ok = ok && isDraftHigh(item);
      if (issue === "open_high")
        ok =
          ok &&
          item.targetFasih &&
          item.open / item.targetFasih >= getOpenHighRatio();
      if (issue === "risk_high") ok = ok && item.riskScore >= 70;
      if (issue === "zero_progress") ok = ok && Number(item.berhasilDidata || 0) === 0;

      return ok;
    });
  }

  function renderPetugasFilterSummary(filteredData, allData) {
    const kecamatan = APP_STATE.filters.petugasKecamatan;
    const kritis = filteredData.filter((item) => item.status === "KRITIS").length;
    const perhatian = filteredData.filter((item) => item.status === "PERHATIAN").length;
    const totalOpen = sumBy(filteredData, "open");
    const totalDraft = sumBy(filteredData, "draft");
    const totalTarget = sumBy(filteredData, "targetFasih");
    const totalBerhasil = sumBy(filteredData, "berhasilDidata");
    const location = kecamatan ? " di " + kecamatan : "";

    setText(
      "summaryPetugasFilter",
      "Menampilkan " +
      formatNumber(filteredData.length) +
      " dari " +
      formatNumber(allData.length) +
      " PPL" +
      location +
      ". " +
      formatNumber(kritis) +
      " Kritis · " +
      formatNumber(perhatian) +
      " Perhatian · Open " +
      formatNumber(totalOpen) +
      " · Draft " +
      formatNumber(totalDraft) +
      " · Target " +
      formatNumber(totalTarget) +
      " · Berhasil " +
      formatNumber(totalBerhasil) +
      " · Realisasi " +
      formatPercent(calculatePercent(totalBerhasil, totalTarget)),
    );
  }

  function renderPetugasCardSummary(prefix, rows) {
    const data = rows || [];

    setText(prefix + "Open", formatNumber(sumBy(data, "open")));
    setText(prefix + "Sudah", formatNumber(sumBy(data, "berhasilDidata")));
    setText(prefix + "Draft", formatNumber(sumBy(data, "draft")));
  }

  function buildPetugasLeaderboardRow(item, index, value, valueClass) {
    return {
      rank: index + 1,
      title: item.pplNama,
      sub:
        item.kecamatan +
        " · Realisasi " +
        formatPercent(item.persenRealisasi) +
        " · " +
        safe(item.statusLabel, item.status),
      metrics: [
        {
          label: "Sudah",
          value:
            formatNumber(item.berhasilDidata) +
            "/" +
            formatNumber(item.targetFasih),
          className: "good",
        },
        {
          label: "Open",
          value: formatNumber(item.open),
          className: Number(item.open || 0) > 0 ? "bad" : "",
        },
        {
          label: "Draft",
          value: formatNumber(item.draft),
          className: Number(item.draft || 0) > 0 ? "warn" : "",
        },
      ],
      value: value,
      valueClass: valueClass,
    };
  }

  function renderTablePetugas(data) {
    destroyTable("tablePetugas");

    APP_STATE.tables.tablePetugas = $("#tablePetugas").DataTable({
      data: data,
      pageLength: 25,
      lengthMenu: [10, 25, 50, 100, 250],
      dom: "Bfrtip",
      buttons: tableButtons("Petugas_PPL_Bireuen"),
      order: [[9, "desc"]],
      scrollX: true,
      columns: [
        { data: "no" },
        { data: "kecamatan", render: textRenderer },
        { data: "pplNama", render: boldText },
        { data: "pplEmail", render: emailText },
        { data: "pmlNama", render: textRenderer },
        { data: "pmlEmail", render: emailText },
        { data: "totalSLS", render: numberRenderer },
        { data: "targetFasih", render: numberRenderer },
        { data: "berhasilDidata", render: numberRenderer },
        { data: "persenRealisasi", render: percentRenderer },
        { data: "open", render: numberRenderer },
        { data: "draft", render: numberRenderer },
        { data: "riskScore", render: riskScoreRenderer },
        { data: "status", render: renderPetugasStatusBadge },
        { data: "datetime", render: textRenderer },
        {
          data: null,
          orderable: false,
          render: (data, type, row) => renderSlsJumpButton(row.pplNama),
        },
      ],
      language: datatableLanguage(),
    });
  }

  /* =========================================================
   PML / PENGAWAS
========================================================= */

  function renderPml(petugas) {
    if (!petugas || !petugas.success || !petugas.pml) {
      renderTablePml([]);
      return;
    }

    const pml = petugas.pml;
    const summary = pml.summary || {};
    const data = pml.data || [];
    const filteredData = filterPmlData(data);
    const topRealisasi = filteredData
      .slice()
      .sort((a, b) => Number(b.persenRealisasi || 0) - Number(a.persenRealisasi || 0));
    const highestRisk = filteredData
      .slice()
      .sort((a, b) => Number(b.riskScore || 0) - Number(a.riskScore || 0));

    setText("pmlTotal", formatNumber(summary.totalPML));
    setText("pmlTotalTarget", formatNumber(summary.totalTarget));
    setText("pmlTotalBerhasil", formatNumber(summary.totalBerhasil));
    setText("pmlAvgRealisasi", formatPercent(summary.avgRealisasi));
    setText("pmlTotalOpen", formatNumber(summary.totalOpen));
    setText("pmlTotalDraft", formatNumber(summary.totalDraft));

    setText("pmlTotalBacklog", "0");
    setText("pmlBacklogTinggi", "0");
    setText("pmlRejectedTinggi", "0");

    renderPmlFilterSummary(filteredData, data);
    renderTopPmlChart(topRealisasi);

    renderLeaderboard(
      "listPmlRisk",
      highestRisk.slice(0, 8),
      function (item, index) {
        return {
          rank: index + 1,
          title: item.pmlNama,
          sub:
            formatNumber(item.totalPPL) +

      if (issue === "draft" || issue === "draft_high")

  function buildInsightSnapshot(payload) {
    const petugas = payload.petugas || {};
    const petugasSummary = petugas.summary || {};
    const petugasRows = petugas.data || [];
    const pmlRows = petugas.pml?.data || [];
    const kecamatanRows = payload.kecamatan?.data || [];
    const totalTarget = Number(petugasSummary.totalTarget || sumBy(petugasRows, "targetFasih"));
    const totalBerhasil = Number(petugasSummary.totalBerhasil || sumBy(petugasRows, "berhasilDidata"));
    const totalOpen = Number(petugasSummary.totalOpen || sumBy(petugasRows, "open"));
    const totalDraft = Number(petugasSummary.totalDraft || sumBy(petugasRows, "draft"));
    const totalPpl = Number(petugasSummary.totalPPL || petugasRows.length);
    const criticalCount = Number(
      petugasSummary.kritis ||
      petugasRows.filter(function (item) {
        return item.status === "KRITIS";
      }).length,
    );
    const highRiskCount = petugasRows.filter(function (item) {
      return Number(item.riskScore || 0) >= 70;
    }).length;
    const focusKecamatanRow = findFocusKecamatan(kecamatanRows, petugasRows);
    const focusKecamatan = focusKecamatanRow
      ? safe(focusKecamatanRow.kecamatan, "-")
      : "-";
    const priorityRows = buildAiPriorityRows(petugasRows);
    const priorityScore = calculateAiPriorityScore({
      totalOpen: totalOpen,
      totalDraft: totalDraft,
      totalTarget: totalTarget,
      criticalCount: criticalCount,
      highRiskCount: highRiskCount,
      totalPpl: totalPpl,
    });
    const priorityLabel =
      priorityScore >= 70
        ? "Kritis"
        : priorityScore >= 40
          ? "Perlu Atensi"
          : "Terkendali";
    const topPriority = priorityRows[0] || {};
    const heroTitle = petugasRows.length
      ? "Fokus utama: " + safe(topPriority.pplNama, focusKecamatan)
      : "Data petugas belum tersedia";
    const heroSummary = petugasRows.length
      ? "Realisasi " +
      formatPercent(calculatePercent(totalBerhasil, totalTarget)) +
      " dari " +
      formatNumber(totalTarget) +
      " target. Open " +
      formatNumber(totalOpen) +
      ", draft " +
      formatNumber(totalDraft) +
      ", PPL kritis " +
      formatNumber(criticalCount) +
      ". Fokus wilayah: " +
      focusKecamatan +
      "."
      : "Insight prioritas membutuhkan data Petugas/PPL yang berhasil dibaca dari spreadsheet.";

    const insight = {
      generatedAt: safe(payload.generatedAt, "-"),
      totalTarget: totalTarget,
      totalBerhasil: totalBerhasil,
      totalOpen: totalOpen,
      totalDraft: totalDraft,
      totalPpl: totalPpl,
      criticalCount: criticalCount,
      highRiskCount: highRiskCount,
      focusKecamatan: focusKecamatan,
      priorityRows: priorityRows,
      priorityScore: priorityScore,
      priorityLabel: priorityLabel,
      heroTitle: heroTitle,
      heroSummary: heroSummary,
      actions: [],
      pmlRows: pmlRows,
      kecamatanRows: kecamatanRows,
    };

    insight.actions = buildInsightActions(insight, petugasRows, pmlRows, focusKecamatanRow);
    insight.briefText = buildInsightBriefText(insight);

    return insight;
  }

  function buildAiPriorityRows(rows) {
    return (rows || [])
      .map(function (item) {
        const realisasiGap = Math.max(0, 35 - Number(item.persenRealisasi || 0));
        const statusBoost =
          item.status === "KRITIS" ? 42 : item.status === "PERHATIAN" ? 20 : 0;
        const score =
          Number(item.riskScore || 0) +
          Number(item.open || 0) * 1.55 +
          Number(item.draft || 0) * 1.15 +
          realisasiGap * 1.2 +
          statusBoost;

        return Object.assign({}, item, {
          aiPriorityScore: score,
        });
      })
      .sort(function (a, b) {
        return Number(b.aiPriorityScore || 0) - Number(a.aiPriorityScore || 0);
      })
      .slice(0, 8);
  }

  function calculateAiPriorityScore(data) {
    const openRate = calculatePercent(data.totalOpen, data.totalTarget);
    const draftRate = calculatePercent(data.totalDraft, data.totalTarget);
    const criticalRate = calculatePercent(data.criticalCount, data.totalPpl);
    const highRiskRate = calculatePercent(data.highRiskCount, data.totalPpl);

    return Math.min(
      100,
      Math.round(openRate * 0.45 + draftRate * 0.35 + criticalRate * 1.2 + highRiskRate * 1.1),
    );
  }

  function findFocusKecamatan(kecamatanRows, petugasRows) {
    if (kecamatanRows && kecamatanRows.length) {
      return kecamatanRows
        .slice()
        .sort(function (a, b) {
          return kecamatanAttentionScore(b) - kecamatanAttentionScore(a);
        })[0];
    }

    const byKecamatan = {};
    (petugasRows || []).forEach(function (item) {
      const key = safe(item.kecamatan, "TIDAK DIKETAHUI");
      if (!byKecamatan[key]) {
        byKecamatan[key] = {
          kecamatan: key,
          open: 0,
          draft: 0,
          risk: 0,
          count: 0,
        };
      }
      byKecamatan[key].open += Number(item.open || 0);
      byKecamatan[key].draft += Number(item.draft || 0);
      byKecamatan[key].risk += Number(item.riskScore || 0);
      byKecamatan[key].count += 1;
    });

    return Object.values(byKecamatan).sort(function (a, b) {
      const scoreA = a.open * 2 + a.draft + a.risk / Math.max(1, a.count);
      const scoreB = b.open * 2 + b.draft + b.risk / Math.max(1, b.count);
      return scoreB - scoreA;
    })[0];
  }

  function buildInsightActions(insight, petugasRows, pmlRows, focusKecamatanRow) {
    const actions = [];
    const topPriority = insight.priorityRows[0];
    const topOpen = petugasRows
      .slice()
      .sort(function (a, b) {
        return Number(b.open || 0) - Number(a.open || 0);
      })[0];
    const topDraft = petugasRows
      .slice()
      .sort(function (a, b) {
        return Number(b.draft || 0) - Number(a.draft || 0);
      })[0];
    const topPml = pmlRows
      .slice()
      .sort(function (a, b) {
        return Number(b.riskScore || 0) - Number(a.riskScore || 0);
      })[0];
    const zeroProgress = petugasRows.filter(function (item) {
      return Number(item.berhasilDidata || 0) === 0;
    }).length;

    if (topPriority) {
      actions.push({
        type: Number(topPriority.aiPriorityScore || 0) >= 90 ? "danger" : "warning",
        title: "Hubungi PPL prioritas: " + safe(topPriority.pplNama, "-"),
        body:
          safe(topPriority.kecamatan, "-") +
          " - realisasi " +
          formatPercent(topPriority.persenRealisasi) +
          ", open " +
          formatNumber(topPriority.open) +
          ", draft " +
          formatNumber(topPriority.draft) +
          ", risk " +
          formatNumber(topPriority.riskScore) +
          ".",
      });
    }

    if (topOpen && Number(topOpen.open || 0) > 0) {
      actions.push({
        type: "danger",
        title: "Turunkan open terbesar",
        body:
          safe(topOpen.pplNama, "-") +
          " memiliki open " +
          formatNumber(topOpen.open) +
          " di " +
          safe(topOpen.kecamatan, "-") +
          ". Minta update penyelesaian dan hambatan lapangan.",
      });
    }

    if (topDraft && Number(topDraft.draft || 0) > 0) {
      actions.push({
        type: "warning",
        title: "Dorong penyelesaian draft",
        body:
          safe(topDraft.pplNama, "-") +
          " memiliki draft " +
          formatNumber(topDraft.draft) +
          ". Prioritaskan review data agar tidak tertahan di akhir hari.",
      });
    }

    if (topPml) {
      actions.push({
        type: Number(topPml.riskScore || 0) >= 70 ? "danger" : "warning",
        title: "Pantau PML risiko tertinggi",
        body:
          safe(topPml.pmlNama, "-") +
          " membawahi " +
          formatNumber(topPml.totalPPL) +
          " PPL dengan risk " +
          formatNumber(topPml.riskScore) +
          ". Gunakan sebagai titik koordinasi tim.",
      });
    }

    if (focusKecamatanRow) {
      actions.push({
        type: "warning",
        title: "Fokus wilayah: " + safe(focusKecamatanRow.kecamatan, "-"),
        body:
          "Pantau progress wilayah ini karena menjadi titik atensi tertinggi pada dashboard hari ini.",
      });
    }

    if (zeroProgress > 0) {
      actions.push({
        type: "danger",
        title: "Zero progress perlu dicek",
        body:
          formatNumber(zeroProgress) +
          " PPL belum memiliki berhasil didata. Pastikan kendala teknis, akses, atau jadwal lapangan sudah jelas.",
      });
    }

    if (!actions.length) {
      actions.push({
        type: "",
        title: "Kondisi relatif terkendali",
        body: "Pertahankan monitoring harian dan gunakan priority board untuk follow-up ringan.",
      });
    }

    return actions.slice(0, 6);
  }

  function renderInsightActions(actions) {
    const el = document.getElementById("aiActionList");
    if (!el) return;

    el.innerHTML = (actions || [])
      .map(function (item) {
        return (
          '<div class="ai-action-card ' +
          cssClassToken(item.type) +
          '">' +
          "<strong>" +
          escapeHtml(item.title) +
          "</strong>" +
          "<p>" +
          escapeHtml(item.body) +
          "</p>" +
          "</div>"
        );
      })
      .join("");
  }

  function buildInsightBriefText(insight) {
    const priorityRows = insight.priorityRows || [];
    const topLines = priorityRows.slice(0, 3).map(function (item, index) {
      return (
        index + 1 +
        ". " +
        safe(item.pplNama, "-") +
        " - " +
        safe(item.kecamatan, "-") +
        " | Realisasi " +
        formatPercent(item.persenRealisasi) +
        " | Open " +
        formatNumber(item.open) +
        " | Draft " +
        formatNumber(item.draft) +
        " | Risk " +
        formatNumber(item.riskScore)
      );
    });

    const actionLines = (insight.actions || []).slice(0, 4).map(function (item, index) {
      return index + 1 + ". " + item.title + " - " + item.body;
    });

    return [
      "BRIEFING HARIAN BPS BIREUEN",
      "Update: " + insight.generatedAt,
      "",
      "Kondisi utama:",
      "- Realisasi: " + formatPercent(calculatePercent(insight.totalBerhasil, insight.totalTarget)) + " (" + formatNumber(insight.totalBerhasil) + "/" + formatNumber(insight.totalTarget) + ")",
      "- Open: " + formatNumber(insight.totalOpen),
      "- Draft: " + formatNumber(insight.totalDraft),
      "- PPL kritis: " + formatNumber(insight.criticalCount),
      "- Fokus wilayah: " + insight.focusKecamatan,
      "- Skor prioritas: " + insight.priorityScore + " (" + insight.priorityLabel + ")",
      "",
      "Top prioritas PPL:",
      topLines.length ? topLines.join("\n") : "- Belum ada data prioritas.",

  function askInsightAi() {
    if (!APP_STATE.payload) {
      showToast("AI belum siap", "Data dashboard belum dimuat.", "warning");
      return;
    }

    const promptEl = document.getElementById("insightAiPrompt");
    const contextEl = document.getElementById("insightAiContextMode");
    const button = document.getElementById("btnAskAiInsight");
    const prompt = promptEl ? promptEl.value.trim() : APP_STATE.aiDefaultPrompt;

    if (!prompt) {
      showToast("Prompt kosong", "Isi pertanyaan atau gunakan Prompt Briefing.", "warning");
      return;
    }

    setText("insightAiStatus", "Memproses");
    setText("insightAiAnswer", "AI sedang membaca data dashboard dan menyusun jawaban...");
    if (button) button.disabled = true;

    google.script.run
      .withSuccessHandler(function (response) {
        if (button) button.disabled = false;

        if (!response || response.success === false) {
          const message =
            response && response.error
              ? response.error
              : "AI tidak mengembalikan jawaban.";
          setText("insightAiStatus", "Fallback");
          setText("insightAiAnswer", buildInsightAiFallbackAnswer(message));
          showToast("AI gagal", message, "warning");
          return;
        }

        APP_STATE.aiAnswerText = response.answer || "";
        setText("insightAiStatus", "AI OK");
        setText("insightAiAnswer", APP_STATE.aiAnswerText);
        showToast("AI selesai", "Jawaban AI berhasil dibuat.");
      })
      .withFailureHandler(function (error) {
        if (button) button.disabled = false;
        const message =
          error && error.message
            ? error.message
            : "Koneksi AI gagal diproses.";
        setText("insightAiStatus", "Fallback");
        setText("insightAiAnswer", buildInsightAiFallbackAnswer(message));
        showToast("AI gagal", message, "warning");
      })
      .askAiDashboard({
        prompt: prompt,
        contextMode: contextEl ? contextEl.value : "summary",
      });
  }

  function horizontalBarOptions(formatter, stacked = false) {
    const theme = chartThemeColors();

    return {
      indexAxis: "y",
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: stacked,
          labels: { color: theme.legend, usePointStyle: true },
        },
        tooltip: {
          callbacks: {
            label: function (context) {
              return context.dataset.label + ": " + formatter(context.raw);
            },
          },
        },
      },
      scales: {
        x: {
          stacked: stacked,
          ticks: { color: theme.muted },
          grid: { color: theme.grid },
        },
        y: {
          stacked: stacked,
          ticks: {
            color: theme.text,
            font: { size: 11, weight: "700" },
            callback: function (value) {
              return shorten(this.getLabelForValue(value), 24);
            },
          },
          grid: { display: false },
        },
      },
    };
  }

  function doughnutOptions() {
    const theme = chartThemeColors();

    return {
      responsive: true,
      maintainAspectRatio: false,
      cutout: "68%",
      plugins: {
        legend: {
          position: "bottom",
          labels: {
            color: theme.text,
            usePointStyle: true,
            padding: 16,
          },
        },
      },
    };
  }

  function riskDistributionOptions() {
    const theme = chartThemeColors();

    return {
      indexAxis: "y",
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function (context) {
              return "Jumlah PPL: " + formatNumber(context.raw);
            },
          },
        },
      },
      scales: {
        x: {
          beginAtZero: true,
          ticks: {
            color: theme.muted,
            precision: 0,
          },
          grid: { color: theme.grid },
        },
        y: {
          ticks: {
            color: theme.text,
            font: { size: 13, weight: "800" },
          },
          grid: { display: false },
        },
      },
    };
  }

  function chartThemeColors() {
    const isLight = document.body.classList.contains("theme-light");

    return {
      text: isLight ? "#0f172a" : "#f8fafc",
      muted: isLight ? "#475569" : "#cbd5e1",
      legend: isLight ? "#1f2937" : "#e5e7eb",
      grid: isLight ? "rgba(15, 23, 42, 0.1)" : "rgba(255,255,255,.08)",
    };
  }

  function bindNavigation() {
    document.querySelectorAll(".nav-item").forEach(function (button) {
      const label = button.querySelector("span");
      if (label) button.setAttribute("title", label.textContent.trim());

      button.addEventListener("click", function () {
        switchSection(button.getAttribute("data-section"));
        closeMobileSidebar();
      });
    });

    document.querySelectorAll("[data-section-jump]").forEach(function (button) {
      button.addEventListener("click", function () {
        switchSection(button.getAttribute("data-section-jump"));
        closeMobileSidebar();
      });
    });

  function switchSection(section) {
    APP_STATE.currentSection = section;

    document.querySelectorAll(".nav-item").forEach(function (button) {
      button.classList.toggle(
        "active",
        button.getAttribute("data-section") === section,
      );
    });

    document.querySelectorAll(".page-section").forEach(function (el) {
      el.classList.toggle("active", el.id === "section-" + section);
    });

    setTimeout(function () {
      Object.values(APP_STATE.charts).forEach((chart) => {
        try {
          chart.resize();
        } catch (e) { }
      });

      Object.values(APP_STATE.tables).forEach((table) => {
        try {
          table.columns.adjust();
        } catch (e) { }
      });

      // Handle Leaflet Map resize when section is activated
      if (section === "predictive" && leafMap) {
        try {
          leafMap.invalidateSize();
        } catch (e) { }
      }

      // Handle Vis.js Network resize when section is activated
      if (section === "hierarchy" && network) {
        try {
          network.fit();
        } catch (e) { }
      }
    }, 200);
  }

  function isDraftHigh(item) {
    const draft = Number(item?.draft || 0);
    const target = Number(item?.targetFasih || 0);
    return draft >= getDraftHighMin() || (!!target && draft / target >= getDraftHighRatio());
  }

  function getLatestFieldText(rows, field) {
    const found = rows
      .map((item) => safe(item && item[field], ""))
      .filter(Boolean)
      .pop();
    return found || "-";
  }

  function getFreshnessLabel(datetimeText) {
    const parsed = parseDashboardDate(datetimeText);
    if (!parsed) return datetimeText && datetimeText !== "-" ? "Cek manual" : "Tidak ada";

    const ageHours = (Date.now() - parsed.getTime()) / 36e5;
    if (ageHours > 24) return "Perlu cek >24j";
    if (ageHours < -1) return "Cek tanggal";
    return "Aktual <24j";
  }

  function parseDashboardDate(value) {
    const text = safe(value, "");
    let match = text.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})(?:\s+(\d{1,2})[:.](\d{1,2}))?/);
    if (match) {
      return new Date(
        Number(match[3]),
        Number(match[2]) - 1,
        Number(match[1]),
        Number(match[4] || 0),
        Number(match[5] || 0),
      );
    }

    match = text.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})(?:\s+(\d{1,2})[:.](\d{1,2}))?/);
    if (match) {
      return new Date(
        Number(match[1]),
        Number(match[2]) - 1,
        Number(match[3]),
        Number(match[4] || 0),
        Number(match[5] || 0),
      );
    }

    return null;
  }

  function setText(id, value) {

  function calculatePercent(numerator, denominator) {
    const n = Number(numerator || 0);
    const d = Number(denominator || 0);
    return d ? (n / d) * 100 : 0;
  }

  function safe(value, fallback) {
    return value === undefined || value === null || value === ""
      ? fallback
      : value;
  }

  function formatNumber(value) {
    return new Intl.NumberFormat("id-ID").format(Number(value || 0));
  }

  function formatPercent(value) {
    return (
      new Intl.NumberFormat("id-ID", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      }).format(Number(value || 0)) + "%"
    );
  }

  function shorten(text, max) {
    const value = String(text || "");
    if (value.length <= max) return value;
    return value.substring(0, max - 3) + "...";
  }

  function escapeHtml(value) {
    return String(value === undefined || value === null ? "" : value)
      .replace(/&(?!(amp|lt|gt|quot|#039);)/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function cssClassToken(value) {
    return String(value || "")
      .toLowerCase()
      .replace(/[^a-z0-9_-]/g, "");
  }

  function debounce(fn, delay) {
    let timer = null;

    return function () {
      const args = arguments;
      const context = this;

      clearTimeout(timer);
      timer = setTimeout(function () {
        fn.apply(context, args);
      }, delay);
    };
  }

  function loadOptionalScript(key, urls, isReady, onReady, onFail) {
    if (isReady()) {
      onReady();
      return;
    }

    const state = OPTIONAL_SCRIPT_STATE[key] || {
      loading: false,
      failed: false,
      callbacks: [],
      failures: [],
    };
    OPTIONAL_SCRIPT_STATE[key] = state;

    state.callbacks.push(onReady);
    if (onFail) state.failures.push(onFail);

    if (state.loading) return;

    state.loading = true;
    let index = 0;

    function finishReady() {
      state.loading = false;
      state.failed = false;
      const callbacks = state.callbacks.splice(0);
      state.failures.splice(0);
      callbacks.forEach(function (callback) {
        try {
          callback();
        } catch (error) {
          console.error(error);
        }
      });
    }

    function finishFail() {
      state.loading = false;
      state.failed = true;
      state.callbacks.splice(0);
      const failures = state.failures.splice(0);
      failures.forEach(function (callback) {
        try {
          callback();
        } catch (error) {
          console.error(error);
        }
      });
    }

    function tryNext() {
      if (isReady()) {
        finishReady();
        return;
      }

      if (index >= urls.length) {
        finishFail();
        return;
      }

      const script = document.createElement("script");
      let completed = false;
      const timeoutId = setTimeout(function () {
        if (completed) return;
        completed = true;
        script.remove();
        tryNext();
      }, 8000);

      script.async = true;
      script.src = urls[index++];
      script.onload = function () {
        if (completed) return;
        completed = true;
        clearTimeout(timeoutId);
        if (isReady()) finishReady();
        else tryNext();
      };
      script.onerror = function () {
        if (completed) return;
        completed = true;
        clearTimeout(timeoutId);
        script.remove();
        tryNext();
      };
      document.head.appendChild(script);
    }

    tryNext();
  }

  function applyExcelCellFormats(ws) {
    if (!ws || !ws['!ref']) return;
    const range = XLSX.utils.decode_range(ws['!ref']);
    for (let C = range.s.c; C <= range.e.c; ++C) {
      const headerRef = XLSX.utils.encode_cell({ r: 0, c: C });
      const headerCell = ws[headerRef];
      if (!headerCell) continue;

      const headerText = String(headerCell.v);
      const isPercent = headerText.includes("%");

      for (let R = 1; R <= range.e.r; ++R) {
        const cellRef = XLSX.utils.encode_cell({ r: R, c: C });
        const cell = ws[cellRef];
        if (cell && cell.t === 'n') {
          if (isPercent) {
            cell.z = '0.00%';
          } else {
            cell.z = '#,##0';
          }
        }
      }
    }
  }

  function exportCategoryExcel(tableId, filename, formatRowFn, filteredOnly) {
    if (!APP_STATE.payload) {
      showToast("Export Gagal", "Data dashboard belum dimuat.", "warning");
      return;
    }

    if (!isXlsxReady()) {
      showToast("Memuat Export", "Library Excel sedang dimuat. Coba otomatis dilanjutkan.", "info");
      loadOptionalScript(
        "xlsx",
        [
          "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
          "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
        ],
        isXlsxReady,
        function () {
          exportCategoryExcel(tableId, filename, formatRowFn, filteredOnly);
        },
        function () {
          showToast("Export Gagal", "Library Excel tidak dapat dimuat dari CDN.", "danger");
        },
      );
      return;
    }

    try {
      const rawData = getTableDataForExport(tableId, filteredOnly);
      if (!rawData || rawData.length === 0) {
        showToast("Export Kosong", "Tidak ada data untuk diexport.", "warning");
        return;
      }

      const formattedData = rawData.map(formatRowFn);
      const ws = XLSX.utils.json_to_sheet(formattedData);
      applyExcelCellFormats(ws);

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Data Export");

      const suffix = filteredOnly ? "_Terfilter" : "_Semua";
      XLSX.writeFile(wb, filename + suffix + "_" + new Date().toISOString().slice(0, 10) + ".xlsx");

      showToast("Export Berhasil", "Data " + filename + " " + (filteredOnly ? "terfilter" : "semua") + " berhasil diunduh.", "success");
    } catch (error) {
      console.error(error);
      showToast("Export Gagal", "Terjadi kesalahan saat mengekspor data.", "danger");
    }
  }

  /* =========================================================
     PREDICTIVE ANALYTICS & CHART
  ========================================================= */

  let trendChart = null;

  function initPredictiveAnalytics(payload) {
    const progress = Number(payload.petugas.summary.persenRealisasi || 0);
    const startDate = new Date("2026-06-15");
    const today = new Date();

    const elapsedDays = Math.max(1, Math.ceil((today - startDate) / (24 * 3600 * 1000)));
    const velocity = progress / elapsedDays;

    const deadline = new Date("2026-08-20");
    const daysRemaining = Math.max(0, Math.ceil((deadline - today) / (24 * 3600 * 1000)));
    const remainingProgress = 100 - progress;
    const daysToComplete = velocity > 0 ? remainingProgress / velocity : Infinity;

    const estFinishDate = new Date();
    if (daysToComplete !== Infinity) {
      estFinishDate.setDate(estFinishDate.getDate() + daysToComplete);
    }

    setText("predCurrentProgress", formatPercent(progress));
    setText("predDailyVelocity", velocity.toFixed(2) + "% / hari");
    setText("predDaysToComplete", daysToComplete === Infinity ? "-" : Math.round(daysToComplete) + " Hari lagi");
    setText("predFinishDate", daysToComplete === Infinity ? "Tidak terdefinisi" : estFinishDate.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }));

    const statusCard = document.getElementById("predStatusCard");
    const statusText = document.getElementById("predTimeStatus");

    if (statusCard && statusText) {
      statusCard.className = "mini-kpi";
      if (daysToComplete === Infinity || velocity <= 0) {
        statusText.innerText = "Tidak ada progress";
        statusCard.classList.add("danger");
      } else if (estFinishDate <= deadline) {
        statusText.innerText = "Aman (Tepat Waktu)";
        statusCard.classList.add("success");
      } else if (estFinishDate <= new Date(deadline.getTime() + 10 * 24 * 3600 * 1000)) {
        statusText.innerText = "Perlu Perhatian";
        statusCard.classList.add("warning");
      } else {
        statusText.innerText = "Kritis (Terlambat)";
        statusCard.classList.add("danger");
      }
    }

    google.script.run
      .withSuccessHandler(function (response) {
        if (response && response.success && response.data) {
          renderPredictiveChart(response.data, startDate, deadline, velocity, progress);
        } else {
          const mockData = generateMockHistory(progress, elapsedDays);
          renderPredictiveChart(mockData, startDate, deadline, velocity, progress);
        }
      })
      .withFailureHandler(function () {
        const mockData = generateMockHistory(progress, elapsedDays);
        renderPredictiveChart(mockData, startDate, deadline, velocity, progress);
      })
      .getHistoryData();
  }

  function generateMockHistory(currentProgress, elapsedDays) {
    const mock = [];
    for (let i = elapsedDays - 1; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const factor = (elapsedDays - i) / elapsedDays;
      mock.push({
        date: d.toISOString().slice(0, 10),
        berhasil: Math.round(100 * factor),
        target: 100,
        submit: Math.round(100 * factor),
        prelist: 100
      });
    }
    return mock;
  }

  function renderPredictiveChart(historyData, startDate, deadlineDate, velocity, currentProgress) {
    const ctx = document.getElementById("chartPredictiveTrend");
    if (!ctx) return;

    if (trendChart) {
      trendChart.destroy();
    }

    const labels = [];
    const actualData = [];
    const targetData = [];
    const projectedData = [];

    historyData.forEach(h => {
      labels.push(h.date);
      const pct = h.target ? (h.berhasil / h.target) * 100 : (h.prelist ? (h.submit / h.prelist) * 100 : 0);
      actualData.push(pct);

      const hDate = new Date(h.date);
      const daysFromStart = Math.max(0, Math.round((hDate - startDate) / (24 * 3600 * 1000)));
      const targetPct = Math.min(100, (daysFromStart / Math.round((deadlineDate - startDate) / (24 * 3600 * 1000))) * 100);
      targetData.push(targetPct);
      projectedData.push(null);
    });

    const todayIdx = actualData.length - 1;
    projectedData[todayIdx] = actualData[todayIdx];

    const totalDaysToFinish = velocity > 0 ? (100 - currentProgress) / velocity : 0;
    const projectSteps = Math.min(15, Math.ceil(totalDaysToFinish));

    for (let i = 1; i <= projectSteps; i++) {
      const futureDate = new Date();
      futureDate.setDate(futureDate.getDate() + (totalDaysToFinish / projectSteps) * i);
      const dateStr = futureDate.toISOString().slice(0, 10);

      labels.push(dateStr);
      actualData.push(null);

      const daysFromStart = Math.max(0, Math.round((futureDate - startDate) / (24 * 3600 * 1000)));
      const targetPct = Math.min(100, (daysFromStart / Math.round((deadlineDate - startDate) / (24 * 3600 * 1000))) * 100);
      targetData.push(targetPct);

      const projPct = Math.min(100, currentProgress + (velocity * (totalDaysToFinish / projectSteps) * i));
      projectedData.push(projPct);
    }

    const themeColors = chartThemeColors();

    trendChart = new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [
          {
            label: "Progres Aktual (%)",
            data: actualData,
            borderColor: "#3b82f6",
            backgroundColor: "rgba(59, 130, 246, 0.1)",
            borderWidth: 3,
            fill: true,
            spanGaps: true
          },
          {
            label: "Proyeksi Tren (%)",
            data: projectedData,
            borderColor: "#eab308",
            borderDash: [5, 5],
            borderWidth: 2.5,
            fill: false,
            spanGaps: true
          },
          {
            label: "Target Tepat Waktu (%)",
            data: targetData,
            borderColor: "rgba(22, 163, 74, 0.5)",
            borderWidth: 2,
            borderDash: [3, 3],
            fill: false,
            spanGaps: true
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: { color: themeColors.legend }
          }
        },
        scales: {
          x: {
            ticks: { color: themeColors.text },
            grid: { color: themeColors.grid }
          },
          y: {
            min: 0,
            max: 100,
            ticks: { color: themeColors.text, callback: value => value + "%" },
            grid: { color: themeColors.grid }
          }
        }
      }
    });
  }

  function kecamatanMapMetrics(item, mode) {
    item = item || {};
    const status = String(item.status || "KRITIS").toUpperCase();
    const percentSubmit = Number(item.percentSubmit || 0);
    const percentApprove = Number(item.percentApprove || 0);
    const backlog = Number(item.approvalBacklog || 0);
    const open = Number(item.open || item.totalOpen || backlog || 0);
    let color = statusColor(status);
    let label = status;
    let value = percentSubmit;
    let weight = Number(item.prelist || 0);

    if (mode === "submit") {
      value = percentSubmit;
      label = formatPercent(value) + " submit";
      color = value >= 90 ? "#22c55e" : value >= 70 ? "#eab308" : "#ef4444";
      weight = value;
    } else if (mode === "approve") {
      value = percentApprove;
      label = formatPercent(value) + " approve";
      color = value >= 85 ? "#22c55e" : value >= 60 ? "#eab308" : "#ef4444";
      weight = value;
    } else if (mode === "open") {
      value = open || backlog;
      label = formatNumber(value) + " open/backlog";
      color = value <= 5 ? "#22c55e" : value <= 20 ? "#eab308" : "#ef4444";
      weight = value;
    }

    return {
      color: color,
      label: label,
      value: value,
      weight: weight,
      status: status
    };
  }

  function statusColor(status) {
    if (status === "AMAN" || status === "ELITE" || status === "ON_TRACK") return "#22c55e";
    if (status === "PERHATIAN") return "#eab308";
    return "#ef4444";
  }

  function renderKecamatanMapLegend(mode) {
    const el = document.getElementById("mapLegend");
    if (!el) return;
    const rows = mode === "open"
      ? [["#22c55e", "Open/backlog rendah"], ["#eab308", "Perlu dipantau"], ["#ef4444", "Beban tinggi"]]
      : [["#22c55e", "Aman / tinggi"], ["#eab308", "Perhatian / sedang"], ["#ef4444", "Kritis / rendah"]];

  function renderKecamatanRanking(rows) {
    const el = document.getElementById("mapKecamatanRanking");
    if (!el) return;
    rows = rows || [];
    const ranked = rows.slice().sort(function (a, b) {
      const scoreA = kecamatanAttentionScore(a);
      const scoreB = kecamatanAttentionScore(b);
      return scoreB - scoreA;
    }).slice(0, 8);
    if (!ranked.length) {
      el.innerHTML = emptyBox("Belum ada ranking.");
      return;
    }
    el.innerHTML = ranked.map(function (item, index) {
      const status = String(item.status || "KRITIS").toUpperCase();
      return (
        '<div class="leader-item">' +
        '<div class="leader-rank">' + (index + 1) + "</div>" +
        "<div>" +
        '<div class="leader-title">' + escapeHtml(item.kecamatan || "-") + "</div>" +
        '<div class="leader-sub">Submit ' + formatPercent(item.percentSubmit || 0) + " | Backlog " + formatNumber(item.approvalBacklog || 0) + "</div>" +
        "</div>" +
        '<div class="leader-value" style="color:' + statusColor(status) + '">' + escapeHtml(status) + "</div>" +
        "</div>"
      );
    }).join("");
  }

  function kecamatanAttentionScore(item) {
    const status = String(item.status || "").toUpperCase();
    let score = Number(item.approvalBacklog || 0) * 2;
    score += Math.max(0, 100 - Number(item.percentSubmit || 0));
    if (status === "KRITIS") score += 60;
    if (status === "PERHATIAN") score += 25;
    return score;
  }
