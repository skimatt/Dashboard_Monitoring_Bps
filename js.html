  function initHierarchyNetwork(payload) {
    const container = document.getElementById("hierarchyNetwork");
    if (!container) return;

    const fallbackGraph = collectHierarchyGraphData(payload);
    renderHierarchySummary(fallbackGraph.pmls, fallbackGraph.ppls);

    if (!isVisNetworkReady()) {
      renderHierarchyFallbackTree(container, fallbackGraph);
      loadOptionalScript(
        "vis-network",
        [
          "https://unpkg.com/vis-network/standalone/umd/vis-network.min.js",
          "https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js",
        ],
        isVisNetworkReady,
        function () {
          initHierarchyNetwork(payload);
        },
        function () { },
      );
      return;
    }

    const graph = fallbackGraph;
    const nodes = [];
    const edges = [];
    const pmls = graph.pmls;
    const ppls = graph.ppls;
    const pmlKeys = graph.pmlKeys;
    const pplKeys = graph.pplKeys;
    const horizontalLayout = graph.layout;
    const canvasHeight = Math.min(1180, Math.max(640, horizontalLayout.height));
    container.style.height = canvasHeight + "px";

    nodes.push({
      id: "root",
      label: "BPS Bireuen",
      title: "Pusat Komando Monitoring SE2026",
      level: 0,
      shape: "dot",
      size: 13,
      x: horizontalLayout.root.x,
      y: horizontalLayout.root.y,
      fixed: { x: true, y: true },
      color: {
        background: "#2563eb",
        border: "#bfdbfe",
        highlight: { background: "#3b82f6", border: "#ffffff" }
      },
      font: { color: "#dbeafe", size: 12, face: "Inter", strokeWidth: 4, strokeColor: "rgba(15,23,42,0.86)" }
    });

    pmlKeys.forEach(function (key, index) {
      const pml = pmls[key];
      const color = "#60a5fa";
      const point = horizontalLayout.pml[key] || { x: 260, y: horizontalLayout.root.y };

      nodes.push({
        id: key,
        label: shorten(pml.name, 22) + " (" + pml.pplsCount + " PPL)",
        title: "PML: " + pml.name + "\nTim: " + pml.pplsCount + " PPL",
        level: 1,
        shape: "dot",
        size: 10,
        x: point.x,
        y: point.y,
        fixed: { x: true, y: true },
        color: {
          background: color,
          border: color,
          highlight: { background: color, border: "#ffffff" }
        },
        font: { color: "#e5e7eb", size: 11, face: "Inter", strokeWidth: 4, strokeColor: "rgba(15,23,42,0.82)" }
      });

      edges.push({
        from: "root",
        to: key,
        color: { color: "rgba(96, 165, 250, 0.38)", highlight: "#93c5fd" },
        width: 1.2
      });
    });

    pplKeys.forEach(function (key) {
      const ppl = ppls[key];
      const color = hierarchyStatusColor(ppl.status);
      const point = horizontalLayout.ppl[key] || { x: 560, y: horizontalLayout.root.y };

      nodes.push({
        id: key,
        label: "",
        title: "PPL: " + ppl.name + "\nRealisasi: " + ppl.realisasi + "%\nOpen: " + ppl.open + "\nDraft: " + ppl.draft,
        level: 2,
        shape: "dot",
        size: ppl.status === "KRITIS" ? 7 : ppl.status === "PERHATIAN" ? 6 : 5,
        x: point.x,
        y: point.y,
        fixed: { x: true, y: true },
        color: {
          background: color,
          border: color,
          highlight: { background: color, border: "#ffffff" }
        }
      });

      if (ppl.parent) {
        edges.push({
          from: ppl.parent,
          to: key,
          color: { color: "rgba(148, 163, 184, 0.22)", highlight: "#93c5fd" },
          width: 0.8
        });
      }
    });

    const data = {
      nodes: new vis.DataSet(nodes),
      edges: new vis.DataSet(edges)
    };

    const options = {
      layout: {
        improvedLayout: false
      },
      physics: {
        enabled: false,
        stabilization: false
      },
      interaction: {
        hover: true,
        tooltipDelay: 150,
        dragNodes: false,
        dragView: true,
        zoomView: true,
        hideEdgesOnDrag: true,
        navigationButtons: false,
        keyboard: false,
        multiselect: false
      },
      nodes: {
        borderWidth: 1,
        borderWidthSelected: 3,
        shadow: {
          enabled: false
        }
      },
      edges: {
        smooth: {
          enabled: true,
          type: "cubicBezier",
          forceDirection: "horizontal",
          roundness: 0.42
        },
        selectionWidth: 1.8,
        hoverWidth: 1.4
      }
    };

    if (network) {
      try {
        network.destroy();
      } catch (e) { }
    }
    hierarchyFallbackState = null;
    container.classList.remove("hierarchy-fallback-mode");
    container.innerHTML = "";

    try {
      network = new vis.Network(container, data, options);
    } catch (error) {
      console.error(error);
      network = null;
      renderHierarchyFallbackTree(container, graph);
      return;
    }

    network.on("click", function (params) {
      if (params.nodes.length > 0) {
        const nodeId = params.nodes[0];
        showHierarchyDetails(nodeId, pmls, ppls);
        try {
          network.focus(nodeId, { scale: 1.05, animation: { duration: 360, easingFunction: "easeInOutQuad" } });
        } catch (e) { }
      }
    });

    setTimeout(function () {
      fitHierarchyNetwork();
    }, 250);
  }

  function isVisNetworkReady() {
    return typeof vis !== "undefined" && vis && typeof vis.Network === "function";
  }

  function collectHierarchyGraphData(payload) {
    const petugasRows =
      payload && payload.petugas && Array.isArray(payload.petugas.data)
        ? payload.petugas.data
        : [];
    const pmls = {};
    const ppls = {};

    petugasRows.forEach(function (row) {
      row = row || {};
      const pmlKey = row.pmlEmail || row.pmlNama;
      const pplKey = row.pplEmail || row.pplNama;
      const rowStatus = String(row.status || "AMAN").toUpperCase();

      if (pmlKey && !pmls[pmlKey]) {
        pmls[pmlKey] = {
          name: row.pmlNama || "Tanpa Nama",
          email: row.pmlEmail || "",
          status: rowStatus,
          pplsCount: 0,
        };
      } else if (
        pmlKey &&
        hierarchyStatusRank(rowStatus) > hierarchyStatusRank(pmls[pmlKey].status)
      ) {
        pmls[pmlKey].status = rowStatus;
      }

      if (pplKey && !ppls[pplKey]) {
        ppls[pplKey] = {
          name: row.pplNama || "Tanpa Nama",
          email: row.pplEmail || "",
          status: rowStatus,
          parent: pmlKey || "",
          realisasi: row.persenRealisasi || 0,
          target: row.targetFasih || 0,
          berhasil: row.berhasilDidata || 0,
          open: row.open || 0,
          draft: row.draft || 0,
          risk: row.riskScore || 0,
          kecamatan: row.kecamatan || "",
        };
      }
    });

    Object.keys(pmls).forEach(function (key) {
      pmls[key].pplsCount = 0;
    });
    Object.keys(ppls).forEach(function (key) {
      const parent = ppls[key].parent;
      if (parent && pmls[parent]) pmls[parent].pplsCount += 1;
    });

    const pmlKeys = Object.keys(pmls).sort(function (a, b) {
      return String(pmls[a].name || "").localeCompare(String(pmls[b].name || ""));
    });
    const pplKeys = Object.keys(ppls).sort(function (a, b) {
      const parentCompare = String(ppls[a].parent || "").localeCompare(
        String(ppls[b].parent || ""),
      );
      if (parentCompare !== 0) return parentCompare;
      return String(ppls[a].name || "").localeCompare(String(ppls[b].name || ""));
    });

    return {
      petugasRows: petugasRows,
      pmls: pmls,
      ppls: ppls,
      pmlKeys: pmlKeys,
      pplKeys: pplKeys,
      layout: buildHierarchyHorizontalLayout(pmlKeys, ppls),
    };
  }

  function hierarchyStatusRank(status) {
    const value = String(status || "").toUpperCase();
    if (value === "KRITIS") return 3;
    if (value === "PERHATIAN") return 2;
    if (value === "AMAN" || value === "ON_TRACK" || value === "ELITE") return 1;
    return 0;
  }

  function renderHierarchyFallbackTree(container, graph) {
    if (!container) return;
    graph = graph || collectHierarchyGraphData(APP_STATE.payload || {});

    if (network) {
      try {
        network.destroy();
      } catch (e) { }
      network = null;
    }

    hierarchyFallbackState = { container: container, graph: graph };
    container.classList.add("hierarchy-fallback-mode");

    if (!graph.pmlKeys.length && !graph.pplKeys.length) {
      container.style.height = "";
      container.innerHTML = optionalModuleMessage(
        "Hirarki belum tersedia",
        "Data relasi PML-PPL belum terbaca dari payload dashboard.",
      );
      showHierarchyDetails("root", graph.pmls, graph.ppls);
      return;
    }

    const layout = graph.layout || buildHierarchyHorizontalLayout(graph.pmlKeys, graph.ppls);
    const offsetX = 74;
    const svgWidth = 790;
    const svgHeight = Math.max(640, Number(layout.height || 640));
    const viewportHeight = Math.min(860, Math.max(640, svgHeight));
    const rootPoint = layout.root || { x: 0, y: svgHeight / 2 };
    const paths = [];
    const nodes = [];

    function sx(point) {
      return Number((point && point.x) || 0) + offsetX;
    }

    function sy(point) {
      return Number((point && point.y) || 0);
    }

    function edgePath(fromPoint, toPoint) {
      const x1 = sx(fromPoint);
      const y1 = sy(fromPoint);
      const x2 = sx(toPoint);
      const y2 = sy(toPoint);
      const bend = Math.max(80, Math.abs(x2 - x1) * 0.52);
      return (
        "M " +
        x1 +
        " " +
        y1 +
        " C " +
        (x1 + bend) +
        " " +
        y1 +
        ", " +
        (x2 - bend) +
        " " +
        y2 +
        ", " +
        x2 +
        " " +
        y2
      );
    }

    graph.pmlKeys.forEach(function (pmlKey) {
      const pmlPoint = layout.pml[pmlKey];
      if (!pmlPoint) return;
      paths.push(
        '<path class="hierarchy-fallback-edge primary" d="' +
        edgePath(rootPoint, pmlPoint) +
        '"></path>',
      );
    });

    graph.pplKeys.forEach(function (pplKey) {
      const ppl = graph.ppls[pplKey];
      const pplPoint = layout.ppl[pplKey];
      const pmlPoint = ppl && ppl.parent ? layout.pml[ppl.parent] : null;
      if (!pplPoint || !pmlPoint) return;
      paths.push(
        '<path class="hierarchy-fallback-edge" d="' +
        edgePath(pmlPoint, pplPoint) +
        '"></path>',
      );
    });

    nodes.push(
      hierarchySvgNode(
        "root",
        rootPoint,
        offsetX,
        8,
        "#2563eb",
        "BPS Bireuen",
        "Pusat monitoring",
        "root",
        "BPS Kabupaten Bireuen\nPusat monitoring progres Sensus Ekonomi 2026",
      ),
    );

    graph.pmlKeys.forEach(function (pmlKey) {
      const pml = graph.pmls[pmlKey];
      const point = layout.pml[pmlKey];
      if (!point) return;
      nodes.push(
        hierarchySvgNode(
          pmlKey,
          point,
          offsetX,
          7,
          "#60a5fa",
          shorten(pml.name, 24),
          formatNumber(pml.pplsCount || 0) + " PPL",
          "pml",
          "PML: " + pml.name + "\nTim: " + formatNumber(pml.pplsCount || 0) + " PPL",
        ),
      );
    });

    graph.pplKeys.forEach(function (pplKey) {
      const ppl = graph.ppls[pplKey];
      const point = layout.ppl[pplKey];
      if (!point) return;
      const status = String(ppl.status || "").toUpperCase();
      nodes.push(
        hierarchySvgNode(
          pplKey,
          point,
          offsetX,
          status === "KRITIS" ? 6 : status === "PERHATIAN" ? 5.5 : 5,
          hierarchyStatusColor(status),
          "",
          "",
          "ppl " + cssClassToken(status || "unknown"),
          "PPL: " +
          ppl.name +
          "\nPML: " +
          ((graph.pmls[ppl.parent] && graph.pmls[ppl.parent].name) || "-") +
          "\nKecamatan: " +
          (ppl.kecamatan || "-") +
          "\nRealisasi: " +
          formatPercent(ppl.realisasi || 0) +
          "\nOpen: " +
          formatNumber(ppl.open || 0) +
          "\nDraft: " +
          formatNumber(ppl.draft || 0),
        ),
      );
    });

    container.style.height = viewportHeight + "px";
    container.innerHTML =
      '<div class="hierarchy-fallback-stage">' +
      '<svg class="hierarchy-fallback-svg" viewBox="0 0 ' +
      svgWidth +
      " " +
      svgHeight +
      '" role="img" aria-label="Tree horizontal relasi kerja BPS, PML, dan PPL">' +
      '<text class="hierarchy-svg-column" x="' +
      sx(rootPoint) +
      '" y="24">BPS</text>' +
      '<text class="hierarchy-svg-column" x="' +
      (offsetX + 260) +
      '" y="24">PML</text>' +
      '<text class="hierarchy-svg-column" x="' +
      (offsetX + 560) +
      '" y="24">PPL</text>' +
      '<g class="hierarchy-fallback-edges">' +
      paths.join("") +
      "</g>" +
      '<g class="hierarchy-fallback-nodes">' +
      nodes.join("") +
      "</g>" +
      "</svg>" +
      "</div>";

    bindHierarchyFallbackNodes(container, graph);
    selectHierarchyFallbackNode(container, "root");
    showHierarchyDetails("root", graph.pmls, graph.ppls);

    setTimeout(function () {
      centerHierarchyFallback(container);
    }, 60);
  }

  function hierarchySvgNode(id, point, offsetX, radius, color, label, subLabel, className, title) {
    const x = Number((point && point.x) || 0) + offsetX;
    const y = Number((point && point.y) || 0);
    const labelHtml = label
      ? '<text class="hierarchy-svg-label" x="' +
      (x + 14) +
      '" y="' +
      (y - 3) +
      '">' +
      escapeHtml(label) +
      "</text>"
      : "";
    const subLabelHtml = subLabel
      ? '<text class="hierarchy-svg-label muted" x="' +
      (x + 14) +
      '" y="' +
      (y + 13) +
      '">' +
      escapeHtml(subLabel) +
      "</text>"
      : "";

    return (
      '<g class="hierarchy-svg-node ' +
      escapeHtml(className || "") +
      '" data-hierarchy-node="' +
      escapeHtml(id) +
      '" role="button" tabindex="0">' +
      "<title>" +
      escapeHtml(title || label || id) +
      "</title>" +
      '<circle cx="' +
      x +
      '" cy="' +
      y +
      '" r="' +
      radius +
      '" fill="' +
      escapeHtml(color) +
      '"></circle>' +
      labelHtml +
      subLabelHtml +
      "</g>"
    );
  }

  function bindHierarchyFallbackNodes(container, graph) {
    const nodeEls = container.querySelectorAll("[data-hierarchy-node]");
    Array.prototype.forEach.call(nodeEls, function (nodeEl) {
      nodeEl.addEventListener("click", function () {
        const nodeId = this.getAttribute("data-hierarchy-node");
        selectHierarchyFallbackNode(container, nodeId);
        showHierarchyDetails(nodeId, graph.pmls, graph.ppls);
      });
      nodeEl.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          this.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        }
      });
    });
  }

  function selectHierarchyFallbackNode(container, nodeId) {
    if (!container) return;
    const nodeEls = container.querySelectorAll("[data-hierarchy-node]");
    Array.prototype.forEach.call(nodeEls, function (nodeEl) {
      nodeEl.classList.toggle(
        "is-selected",
        nodeEl.getAttribute("data-hierarchy-node") === nodeId,
      );
    });
  }

  function centerHierarchyFallback(container) {
    container = container || document.getElementById("hierarchyNetwork");
    if (!container || !container.classList.contains("hierarchy-fallback-mode")) return;
    const top = Math.max(0, (container.scrollHeight - container.clientHeight) / 2);
    try {
      container.scrollTo({ left: 0, top: top, behavior: "smooth" });
    } catch (e) {
      container.scrollTop = top;
      container.scrollLeft = 0;
    }
  }

  function buildHierarchyHorizontalLayout(pmlKeys, ppls) {
    const pmlPositions = {};
    const pplPositions = {};
    const pmlX = 260;
    const pplX = 560;
    const topPadding = 44;
    const bottomPadding = 44;
    const groupGap = 28;
    const pplSpacing = 28;
    let cursorY = topPadding;

    pmlKeys.forEach(function (pmlKey) {
      const team = Object.keys(ppls || {})
        .filter(function (pplKey) {
          return ppls[pplKey].parent === pmlKey;
        })
        .sort(function (a, b) {
          return String(ppls[a].name || "").localeCompare(String(ppls[b].name || ""));
        });
      const groupHeight = Math.max(52, Math.max(1, team.length) * pplSpacing);
      const pmlY = cursorY + groupHeight / 2;

      pmlPositions[pmlKey] = { x: pmlX, y: pmlY };

      if (team.length) {
        team.forEach(function (pplKey, teamIndex) {
          pplPositions[pplKey] = {
            x: pplX,
            y: cursorY + pplSpacing * teamIndex + pplSpacing / 2,
          };
        });
      }

      cursorY += groupHeight + groupGap;
    });

    const orphanTeam = Object.keys(ppls || {})
      .filter(function (pplKey) {
        return !ppls[pplKey].parent || !pmlPositions[ppls[pplKey].parent];
      })
      .sort(function (a, b) {
        return String(ppls[a].name || "").localeCompare(String(ppls[b].name || ""));
      });

    if (orphanTeam.length) {
      const orphanHeight = Math.max(52, orphanTeam.length * pplSpacing);
      orphanTeam.forEach(function (pplKey, teamIndex) {
        pplPositions[pplKey] = {
          x: pplX,
          y: cursorY + pplSpacing * teamIndex + pplSpacing / 2,
        };
      });
      cursorY += orphanHeight + groupGap;
    }

    const totalHeight = Math.max(640, cursorY + bottomPadding - groupGap);

    return {
      root: { x: 0, y: totalHeight / 2 },
      pml: pmlPositions,
      ppl: pplPositions,
      height: totalHeight,
    };
  }

  function hierarchyStatusColor(status) {
    const value = String(status || "").toUpperCase();
    if (value === "KRITIS") return "#ef4444";
    if (value === "PERHATIAN") return "#eab308";
    if (value === "ELITE" || value === "ON_TRACK" || value === "AMAN") return "#22c55e";
    return "#94a3b8";
  }

  function renderHierarchySummary(pmls, ppls) {
    const el = document.getElementById("hierarchySummary");
    if (!el) return;
    const pmlCount = Object.keys(pmls || {}).length;
    const pplList = Object.values(ppls || {});
    const critical = pplList.filter(function (item) {
      return item.status === "KRITIS";
    }).length;
    const attention = pplList.filter(function (item) {
      return item.status === "PERHATIAN";
    }).length;
    const avgProgress = pplList.length
      ? pplList.reduce(function (total, item) {
        return total + Number(item.realisasi || 0);
      }, 0) / pplList.length
      : 0;
    el.innerHTML =
      hierarchySummaryCard("Total PML", formatNumber(pmlCount)) +
      hierarchySummaryCard("Total PPL", formatNumber(pplList.length)) +
      hierarchySummaryCard("PPL Kritis", formatNumber(critical)) +
      hierarchySummaryCard("Rata-rata Realisasi", formatPercent(avgProgress));
  }

  function hierarchySummaryCard(label, value) {
    return '<div class="hierarchy-summary-card"><span>' + escapeHtml(label) + "</span><b>" + escapeHtml(value) + "</b></div>";
  }

  function fitHierarchyNetwork() {
    if (network) {
      try {
        network.fit({ animation: { duration: 420, easingFunction: "easeInOutQuad" } });
      } catch (e) { }
      return;
    }
    centerHierarchyFallback();
  }

  function stabilizeHierarchyNetwork() {
    if (!network) {
      if (hierarchyFallbackState) {
        renderHierarchyFallbackTree(
          hierarchyFallbackState.container,
          hierarchyFallbackState.graph,
        );
      }
      return;
    }
    try {
      network.setOptions({
        layout: {
          improvedLayout: false
        },
        physics: { enabled: false },
        edges: {
          smooth: {
            enabled: true,
            type: "cubicBezier",
            forceDirection: "horizontal",
            roundness: 0.42
          }
        }
      });
      fitHierarchyNetwork();
    } catch (e) { }
  }

  function showHierarchyDetails(nodeId, pmls, ppls) {
    const detailDiv = document.getElementById("hierarchyDetail");
    if (!detailDiv) return;

    if (nodeId === "root") {
      detailDiv.innerHTML =
        '<div class="leader-item">' +
        '<div class="leader-rank">HQ</div>' +
        "<div>" +
        '<div class="leader-title">BPS Kabupaten Bireuen</div>' +
        '<div class="leader-sub">Pusat monitoring progres Sensus Ekonomi 2026.</div>' +
        "</div>" +
        "</div>";
      return;
    }

    if (pmls[nodeId]) {
      const pml = pmls[nodeId];
      const team = Object.values(ppls).filter(p => p.parent === nodeId);

      const teamListHtml = team.map(p => {
        let col = "text-warn";
        if (p.status === "AMAN" || p.status === "ELITE" || p.status === "ON_TRACK") col = "text-good";
        else if (p.status === "KRITIS") col = "text-bad";

        return (
          '<div class="leader-item">' +
          '<div class="leader-rank"><i class="fa-solid fa-user"></i></div>' +
          "<div>" +
          '<div class="leader-title">' +
          escapeHtml(p.name) +
          "</div>" +
          '<div class="leader-sub">Real: ' +
          escapeHtml(p.realisasi) +
          "% | Open: " +
          escapeHtml(p.open) +
          " | Draft: " +
          escapeHtml(p.draft) +
          "</div>" +
          "</div>" +
          '<div class="leader-value ' +
          col +
          '">' +
          escapeHtml(p.status) +
          "</div>" +
          "</div>"
        );
      }).join("");

      detailDiv.innerHTML =
        '<div style="border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:12px;">' +
        '<h5 style="color:#fff;margin:0 0 4px;font-weight:bold;">' +
        escapeHtml(pml.name) +
        "</h5>" +
        '<span style="font-size:12px;color:var(--text-muted);">' +
        escapeHtml(pml.email) +
        "</span>" +
        '<div style="margin-top:8px;font-size:13px;color:var(--text-soft);">Total Anggota Tim: <b>' +
        team.length +
        " PPL</b></div>" +
        "</div>" +
        '<div style="max-height:350px;overflow-y:auto;">' +
        teamListHtml +
        "</div>";
    } else if (ppls[nodeId]) {
      const ppl = ppls[nodeId];
      const pmlName = pmls[ppl.parent] ? pmls[ppl.parent].name : "Tidak Diketahui";
      detailDiv.innerHTML =
        "<div>" +
        '<h5 style="color:#fff;margin:0 0 4px;font-weight:bold;">' +
        escapeHtml(ppl.name) +
        "</h5>" +
        '<span style="font-size:12px;color:var(--text-muted);">' +
        escapeHtml(ppl.email) +
        "</span>" +
        '<table width="100%" style="font-size:13px;color:var(--text-soft);margin-top:15px;border-collapse:collapse;">' +
        hierarchyDetailRow("Pengawas (PML):", pmlName) +
        hierarchyDetailRow("Kecamatan:", ppl.kecamatan) +
        hierarchyDetailRow("Target FASIH:", ppl.target) +
        hierarchyDetailRow("Berhasil Didata:", ppl.berhasil) +
        '<tr style="border-bottom:1px solid rgba(255,255,255,0.05);"><td style="padding:6px 0;"><b>Realisasi:</b></td><td align="right" style="color:var(--primary);font-weight:bold;">' +
        escapeHtml(ppl.realisasi) +
        "%</td></tr>" +
        hierarchyDetailRow("Open:", ppl.open) +
        hierarchyDetailRow("Draft:", ppl.draft) +
        hierarchyDetailRow("Risk Score:", ppl.risk) +
        '<tr><td style="padding:6px 0;"><b>Status:</b></td><td align="right"><span class="badge-status ' +
        cssClassToken(ppl.status) +
        '">' +
        escapeHtml(ppl.status) +
        "</span></td></tr>" +
        "</table>" +
        "</div>";
    }
  }

  function hierarchyDetailRow(label, value) {
    return (
      '<tr style="border-bottom:1px solid rgba(255,255,255,0.05);">' +
      '<td style="padding:6px 0;"><b>' +
      escapeHtml(label) +
      "</b></td>" +
      '<td align="right">' +
      escapeHtml(value) +
      "</td>" +
      "</tr>"
    );
  }

  function showToast(title, body, type = "info") {
    const toastEl = document.getElementById("appToast");

    if (!toastEl || typeof bootstrap === "undefined") {
      console.log(title, body);
      return;
    }

    setText("toastTitle", title);
    setText("toastBody", body);
    setText("toastTime", "baru saja");

    const toast = bootstrap.Toast.getOrCreateInstance(toastEl, {
      delay: type === "warning" ? 6500 : 3200,
    });

    toast.show();
  }
</script>
