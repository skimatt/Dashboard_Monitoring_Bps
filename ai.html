<!-- AI ASSISTANT PANEL -->
<div class="ai-fab" id="aiFab" title="Buka asisten AI">
  <img
    src="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/claude-ai/default.svg"
    alt="SkieAI"
  />
</div>

<aside class="ai-drawer" id="aiDrawer" aria-label="Asisten AI Dashboard">
  <div class="ai-head">
    <div class="ai-brand">
      <img
        src="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/claude-ai/default.svg"
        alt=""
      />
      <div>
        <span>SkieAI</span>
        <h3>Analisis Dashboard</h3>
      </div>
    </div>
    <div class="ai-head-actions">
      <button class="ai-icon-btn" id="aiClear" title="Bersihkan chat">
        <i class="fa-solid fa-trash"></i>
      </button>
      <button class="ai-icon-btn" id="aiClose" title="Tutup">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <div class="ai-tools">
    <select id="aiContextMode" class="ai-select" title="Mode konteks data">
      <option value="summary">Ringkasan cepat</option>
      <option value="detail">Detail terbatas</option>
      <option value="deep">Analisis mendalam</option>
    </select>
  </div>

  <div class="ai-messages" id="aiMessages">
    <div class="ai-welcome" id="aiWelcome">
      <img
        src="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/claude-ai/default.svg"
        alt=""
      />
      <div class="ai-welcome-copy">
        <span>SkieAI siap membantu</span>
        <h3>Pilih pertanyaan cepat</h3>
      </div>
      <div class="ai-suggestions" aria-label="Contoh pertanyaan AI">
        <button class="ai-tool-btn" data-ai-prompt="Ringkas kondisi dashboard hari ini. Sebutkan prioritas utama yang perlu ditindaklanjuti.">Ringkas kondisi hari ini</button>
        <button class="ai-tool-btn" data-ai-prompt="Apa 3 prioritas utama hari ini berdasarkan data dashboard?">3 prioritas utama</button>
        <button class="ai-tool-btn" data-ai-prompt="Siapa PPL paling berisiko? Jelaskan alasannya berdasarkan open, draft, realisasi, dan risk score.">PPL paling berisiko</button>
        <button class="ai-tool-btn" data-ai-prompt="SLS mana yang open-nya paling tinggi dan perlu ditindaklanjuti lebih dulu?">SLS open tertinggi</button>
        <button class="ai-tool-btn" data-ai-prompt="Kecamatan mana yang tertinggal dari target harian? Urutkan dari paling perlu perhatian.">Kecamatan tertinggal</button>
        <button class="ai-tool-btn" data-ai-prompt="Buat rencana tindak lanjut hari ini yang praktis dan berurutan.">Rencana tindak lanjut</button>
      </div>
    </div>
    <div class="ai-message assistant">
      <div class="ai-bubble">
        Saya bisa membantu membaca ringkasan, risiko, open, draft, PPL, PML, dan SLS berdasarkan data dashboard yang sedang dimuat.
      </div>
    </div>
  </div>

  <form class="ai-compose" id="aiForm">
    <textarea
      id="aiPrompt"
      rows="3"
      maxlength="4000"
      placeholder="Tulis pertanyaan analisis..."
    ></textarea>
    <div class="ai-compose-hint">Enter untuk baris baru. Ctrl+Enter untuk kirim.</div>
    <button type="submit" id="aiSend">
      <i class="fa-solid fa-paper-plane"></i>
      Kirim
    </button>
  </form>
</aside>

<script>
  (function () {
    var AI_WORKER_CHAT_URL = "https://bps.rahmatyoung10.workers.dev/chat";
    var AI_MODEL_CHAIN = [
      "cohere/north-mini-code:free",
      "meta-llama/llama-3.3-70b-instruct:free",
      "poolside/laguna-xs-2.1:free",
    ];
    var AI_MODEL = AI_MODEL_CHAIN[0];
    var AI_CHAT_HISTORY = [];
    var AI_HISTORY_STORAGE_KEY = "skieAiChatHistory:v1";
    var AI_SPEAKING_ID = "";
    var AI_MIN_REASONING_MS = 1000;
    var AI_REVEAL_TICK_MS = 24;

    document.addEventListener("DOMContentLoaded", function () {
      restoreAiHistory();

      var fab = document.getElementById("aiFab");
      var drawer = document.getElementById("aiDrawer");
      var close = document.getElementById("aiClose");
      var clear = document.getElementById("aiClear");
      var form = document.getElementById("aiForm");
      var prompt = document.getElementById("aiPrompt");
      var send = document.getElementById("aiSend");
      var mode = document.getElementById("aiContextMode");

      if (!fab || !drawer || !form || !prompt || !send) return;

      fab.addEventListener("click", function () {
        document.body.classList.add("ai-open");
        setTimeout(function () {
          prompt.focus();
        }, 120);
      });

      if (close) {
        close.addEventListener("click", function () {
          document.body.classList.remove("ai-open");
        });
      }

      if (clear) {
        clear.addEventListener("click", function () {
          clearAiChat();
        });
      }

      drawer.addEventListener("click", function (event) {
        var suggestion = event.target.closest("[data-ai-prompt]");
        if (suggestion) {
          prompt.value = suggestion.getAttribute("data-ai-prompt") || "";
          resizeAiPrompt(prompt);
          prompt.focus();
        }
      });

      if (AI_CHAT_HISTORY.length) {
        hideAiWelcome(true);
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        askAi();
      });

      prompt.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          askAi();
        }
      });

      prompt.addEventListener("input", function () {
        resizeAiPrompt(prompt);
      });

      resizeAiPrompt(prompt);

      function askAi() {
        var text = prompt.value.trim();
        if (!text || send.disabled) return;

        if (!window.APP_STATE || !window.APP_STATE.payload) {
          addAiMessage(
            "assistant",

      function requestAiAnswer(text, contextMode) {
        if (
          window.google &&

          typeof google.script.run.askAiDashboard === "function"

          return askAiDashboardViaAppsScript(text, contextMode);

        return askAiDashboardViaWorker(text, contextMode);

      function askAiDashboardViaAppsScript(text, contextMode) {
        return new Promise(function (resolve, reject) {
          google.script.run
            .withSuccessHandler(function (response) {
              if (!response || response.success === false) {
                reject(
                  new Error(
                    response && response.error
                      ? response.error
                      : "AI server tidak mengembalikan jawaban.",
                  ),
                );
                return;
              }

              resolve(response);
            })
            .withFailureHandler(function (error) {
              reject(
                new Error(
                  error && error.message
                    ? error.message
                    : "Panggilan AI melalui Apps Script gagal.",
                ),
              );
            })
            .askAiDashboard({
              prompt: text,
              contextMode: normalizeAiContextMode(contextMode),
              history: AI_CHAT_HISTORY.slice(-8),
            });
        });
      }

      function askAiDashboardViaWorker(text, contextMode) {
        return fetch(AI_WORKER_CHAT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(buildAiWorkerPayload(text, contextMode)),
        }).then(function (response) {
          return response.json().then(function (payload) {
            payload.__status = response.status;
            return payload;
          });
        });

      function normalizeAiContextMode(contextMode) {
        var mode = String(contextMode || "summary").toLowerCase();

    function buildAiLocalFallbackAnswer(prompt, contextMode, errorMessage) {
      var payload = window.APP_STATE && window.APP_STATE.payload ? window.APP_STATE.payload : null;
      if (!payload) {
        return [
          "## AI Belum Siap",
          "",
          "Data dashboard belum tersedia di browser. Tunggu sampai data selesai dimuat, lalu kirim ulang pertanyaan.",
          "",
          "**Detail teknis:** " + safeAiText(errorMessage || "Payload belum tersedia."),
        ].join("\n");
      }

      var petugas = payload.petugas || {};
      var petugasRows = petugas.data || [];
      var petugasSummary = petugas.summary || {};
      var sls = payload.sls || {};
      var kecamatan = payload.kecamatan || {};
      var totalTarget = num(petugasSummary.totalTarget || sumRows(petugasRows, "targetFasih"));
      var totalBerhasil = num(petugasSummary.totalBerhasil || sumRows(petugasRows, "berhasilDidata"));
      var totalOpen = num(petugasSummary.totalOpen || sumRows(petugasRows, "open"));
      var totalDraft = num(petugasSummary.totalDraft || sumRows(petugasRows, "draft"));
      var critical = num(
        petugasSummary.kritis ||
          petugasRows.filter(function (item) {
            return item.status === "KRITIS";
          }).length,
      );
      var topRisk = petugasRows
        .slice()
        .sort(function (a, b) {
          return aiPriorityScore(b) - aiPriorityScore(a);
        })
        .slice(0, 5);
      var focusKecamatan = (kecamatan.warningList || kecamatan.data || [])
        .slice()
        .sort(function (a, b) {
          return num(a.percentSubmit || 100) - num(b.percentSubmit || 100);
        })[0];

      var lines = [
        "## Mode Fallback Lokal",
        "",
        "AI eksternal belum bisa dihubungi, tetapi saya tetap membaca payload dashboard yang sedang aktif.",
        "",
        "**Detail teknis:** " + safeAiText(errorMessage || "Koneksi AI tidak tersedia."),
        "",
        "### Kondisi Utama",
        "- Realisasi: **" + formatAiPercent(percent(totalBerhasil, totalTarget)) + "** (" + formatAiNumber(totalBerhasil) + "/" + formatAiNumber(totalTarget) + ")",
        "- Open: **" + formatAiNumber(totalOpen) + "**",
        "- Draft: **" + formatAiNumber(totalDraft) + "**",
        "- PPL kritis: **" + formatAiNumber(critical) + "**",
        "- Data SLS: **" + formatAiNumber((sls.data || []).length) + "** baris",
      ];

      if (focusKecamatan) {
        lines.push(
          "- Fokus kecamatan: **" +
            safeAiText(focusKecamatan.kecamatan || "-") +
            "**" +
            (focusKecamatan.percentSubmit !== undefined
              ? " dengan submit " + formatAiPercent(focusKecamatan.percentSubmit)
              : ""),
        );
      }

      lines.push("", "### Prioritas PPL");
      if (topRisk.length) {
        topRisk.forEach(function (item, index) {
          lines.push(
            index +
              1 +
              ". **" +
              safeAiText(item.pplNama || "-") +
              "** - " +
              safeAiText(item.kecamatan || "-") +
              " | Realisasi " +
              formatAiPercent(item.persenRealisasi) +
              " | Open " +
              formatAiNumber(item.open) +
              " | Draft " +
              formatAiNumber(item.draft) +
              " | Risk " +
              formatAiNumber(item.riskScore) +
              " | " +
              safeAiText(item.status || "-"),
          );
        });
      } else {
        lines.push("- Data PPL belum tersedia.");
      }

      lines.push(
        "",
        "### Rekomendasi Cepat",
        "- Hubungi PPL dengan kombinasi open, draft, dan risk tertinggi lebih dulu.",
        "- Minta PML memvalidasi hambatan lapangan pada PPL kritis/perhatian.",
        "- Pakai menu Petugas / PPL dan Risk Monitor untuk melihat tabel lengkap.",

          "### Narasi Siap Kirim",

            formatAiNumber(totalOpen) +

            formatAiNumber(totalDraft) +
            ", PPL kritis " +
            formatAiNumber(critical) +
            ". Prioritas tindak lanjut adalah PPL dengan risk/open/draft tertinggi dan wilayah yang submit-nya tertinggal.",
        );
      }

      return lines.join("\n");
    }

    function aiPriorityScore(item) {
      return (
        num(item && item.riskScore) +
        num(item && item.open) * 1.6 +
        num(item && item.draft) * 1.15 +
        Math.max(0, 35 - num(item && item.persenRealisasi)) * 1.1 +
        (item && item.status === "KRITIS" ? 40 : item && item.status === "PERHATIAN" ? 18 : 0)
      );
    }

    function formatAiNumber(value) {
      return new Intl.NumberFormat("id-ID").format(num(value));
    }

    function formatAiPercent(value) {
      return (
        new Intl.NumberFormat("id-ID", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(num(value)) + "%"
      );
    }

    function safeAiText(value) {
      return String(value === undefined || value === null ? "" : value);

    function classifyQueryIntent(promptText) {
      var text = String(promptText || "").toLowerCase();
      var intent = {
        raw: text.slice(0, 180),
        scope: "general",
        includeKecamatan: false,
        includePetugas: false,
        includePml: false,
        includeSls: false,
        includeRisk: false,
        includeAudit: false,
      };

      if (/\b(ppl|petugas|pencacah|enumerator)\b/.test(text)) {
        intent.scope = "petugas";
        intent.includePetugas = true;
      }
      if (/\b(pml|pengawas)\b/.test(text)) {
        intent.scope = "pml";
        intent.includePml = true;
      }
      if (/\b(sls|blok|wilayah kerja)\b/.test(text)) {
        intent.scope = "sls";
        intent.includeSls = true;
      }
      if (/\b(kecamatan|submit|approve|approval|prelist|target harian)\b/.test(text)) {
        intent.scope = "kecamatan";
        intent.includeKecamatan = true;
      }
      if (/\b(risiko|risk|kritis|perhatian|open|draft|terlambat|tertinggal|backlog)\b/.test(text)) {
        intent.includeRisk = true;
        if (!intent.includePml && !intent.includeSls && !intent.includeKecamatan) {
          intent.includePetugas = true;
          intent.scope = "risk";
        }
      }
      if (/\b(audit|janggal|selisih|validasi|cek ulang|mismatch|anomali)\b/.test(text)) {
        intent.includeAudit = true;
      }
      if (/\b(ringkas|brief|briefing|kondisi|prioritas|rekomendasi|rencana|whatsapp|pimpinan)\b/.test(text)) {
        intent.scope = intent.scope === "general" ? "executive" : intent.scope;
      }

      if (!intent.includeKecamatan && !intent.includePetugas && !intent.includePml && !intent.includeSls) {
        intent.includeKecamatan = true;
        intent.includePetugas = true;
        intent.includePml = true;
        intent.includeSls = true;
      }

      if (intent.includeRisk && !intent.includePetugas && !intent.includePml && !intent.includeSls) {
        intent.includePetugas = true;
      }

      return intent;
    }

            "totalSLS",
            "targetFasih",
            "berhasilDidata",
            "persenRealisasi",
            "open",

            "riskScore",
          ]),
          highestRisk: slimRows((petugas.pml && petugas.pml.highestRisk) || [], maxRows, [

            "kecamatan",
            "totalPPL",

        sls: intent.includeSls ? {

        },
      };

      if (mode === "detail" || mode === "deep") {

    function buildAiComputedChecks(payload) {
      var kecamatan = (payload && payload.kecamatan) || {};
      var petugas = (payload && payload.petugas) || {};
      var sls = (payload && payload.sls) || {};
      var kecRows = kecamatan.data || [];
      var petugasRows = petugas.data || [];
      var slsRows = sls.data || [];

      var totalKecamatanSubmit = sumRows(kecRows, "submit");
      var totalKecamatanPrelist = sumRows(kecRows, "prelist");
      var totalKecamatanApprove = sumRows(kecRows, "approve");
      var totalPetugasTarget = sumRows(petugasRows, "targetFasih");
      var totalPetugasBerhasil = sumRows(petugasRows, "berhasilDidata");
      var totalPetugasOpen = sumRows(petugasRows, "open");
      var totalPetugasDraft = sumRows(petugasRows, "draft");
      var totalSlsTarget = sumRows(slsRows, "targetFasih");
      var totalSlsBerhasil = sumRows(slsRows, "berhasilDidata");

      return {
        rowCounts: {
          kecamatan: kecRows.length,
          petugas: petugasRows.length,
          sls: slsRows.length,
        },
        recomputedKecamatan: {
          totalPrelistFromRows: totalKecamatanPrelist,
          totalSubmitFromRows: totalKecamatanSubmit,
          totalApproveFromRows: totalKecamatanApprove,
          percentSubmitFromRows: percent(totalKecamatanSubmit, totalKecamatanPrelist),
          percentApproveFromRows: percent(totalKecamatanApprove, totalKecamatanSubmit),
          summaryPercentSubmit: num(kecamatan.summary && kecamatan.summary.percentSubmit),
          summaryPercentApprove: num(kecamatan.summary && kecamatan.summary.percentApprove),
          targetHarian: num(kecamatan.summary && kecamatan.summary.targetHarian),
        },
        recomputedPetugas: {
          totalTargetFromRows: totalPetugasTarget,
          totalBerhasilFromRows: totalPetugasBerhasil,
          totalOpenFromRows: totalPetugasOpen,
          totalDraftFromRows: totalPetugasDraft,
          persenRealisasiFromRows: percent(totalPetugasBerhasil, totalPetugasTarget),
          openRateFromRows: percent(totalPetugasOpen, totalPetugasTarget),
          draftRateFromRows: percent(totalPetugasDraft, totalPetugasTarget),
          summaryPersenRealisasi: num(petugas.summary && petugas.summary.persenRealisasi),
          summaryOpenRate: num(petugas.summary && petugas.summary.openRate),
          summaryDraftRate: num(petugas.summary && petugas.summary.draftRate),
        },
        recomputedSls: {
          totalTargetFromRows: totalSlsTarget,
          totalBerhasilFromRows: totalSlsBerhasil,
          persenRealisasiFromRows: percent(totalSlsBerhasil, totalSlsTarget),
          summaryTotalTarget: num(sls.summary && sls.summary.totalTarget),
          summaryTotalBerhasil: num(sls.summary && sls.summary.totalBerhasil),
        },
        riskSignals: {
          petugasKritis: petugasRows.filter(function (row) {
            return row && row.status === "KRITIS";
          }).length,
          petugasPerhatian: petugasRows.filter(function (row) {
            return row && row.status === "PERHATIAN";
          }).length,
          zeroProgressPpl: petugasRows.filter(function (row) {
            return row && num(row.berhasilDidata) === 0;
          }).length,
          highRiskPpl: petugasRows.filter(function (row) {
            return row && num(row.riskScore) >= 70;
          }).length,
        },
      };
    }

    function slimRows(rows, limit, keys) {
      return (rows || []).slice(0, limit).map(function (row) {
        var item = {};
        keys.forEach(function (key) {
          if (row && row[key] !== undefined) item[key] = row[key];
        });
        return item;
      });
    }

    function num(value) {
      var number = Number(value);
      return Number.isFinite(number) ? number : 0;
    }

    function sumRows(rows, key) {
      return (rows || []).reduce(function (total, row) {
        return total + num(row && row[key]);
      }, 0);
    }

    function percent(value, total) {
      value = num(value);
      total = num(total);
      if (!total) return 0;
      return Math.round((value / total) * 10000) / 100;
    }

    function startAiProgress(messageId) {
      var steps = [
        "Tahap 2/4 - Memvalidasi sumber dan ranking...",
        "Tahap 3/4 - Menghitung ulang angka penting...",
        "Tahap 4/4 - Menyusun jawaban relevan...",
      ];

      return steps.map(function (text, index) {
        return setTimeout(function () {
          updateAiMessage(messageId, text);
        }, 250 + index * 250);
      });
    }

    function clearAiProgress(timers) {
      (timers || []).forEach(function (timer) {
        clearTimeout(timer);
      });
    }

    function restoreAiHistory() {
      try {
        var raw = sessionStorage.getItem(AI_HISTORY_STORAGE_KEY);
        var parsed = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(parsed)) return;
        AI_CHAT_HISTORY = parsed
          .filter(function (item) {
            return (
              item &&
              (item.role === "user" || item.role === "assistant") &&
              item.content
            );
          })
          .slice(-10)
          .map(function (item) {
            return {
              role: item.role,
              content: String(item.content).slice(0, 2500),
            };
          });
      } catch (error) {
        AI_CHAT_HISTORY = [];
        try {
          sessionStorage.removeItem(AI_HISTORY_STORAGE_KEY);
        } catch (e) {}
      }
    }

    function addAiMessage(role, text, temporary) {
      var list = document.getElementById("aiMessages");
      if (!list) return "";

      var id = "ai-msg-" + Date.now() + "-" + Math.floor(Math.random() * 1000);
      var row = document.createElement("div");
      row.className = "ai-message " + role;
      row.id = id;
      row.setAttribute("data-raw-text", text || "");

      var bubble = document.createElement("div");
      bubble.className = "ai-bubble";
      if (temporary) bubble.classList.add("ai-loading");

      if (role === "assistant") {
        bubble.innerHTML = renderAiMarkdown(text);
      } else {
        bubble.textContent = text;
      }
      row.appendChild(bubble);

      if (role === "assistant" && !temporary) {
        var menuLinks = createAiMenuLinks(text);
        if (menuLinks) row.appendChild(menuLinks);
        row.appendChild(createAiMessageActions());
      }

      list.appendChild(row);
      list.scrollTop = list.scrollHeight;

      return id;
    }

    function updateAiMessage(id, text) {
      var row = id ? document.getElementById(id) : null;
      var bubble = row ? row.querySelector(".ai-bubble") : null;
      if (!bubble) return;
      row.setAttribute("data-raw-text", text || "");
      bubble.innerHTML = renderAiMarkdown(text);
    }

    function finalizeAiMessage(id, text) {
      var row = id ? document.getElementById(id) : null;
      var bubble = row ? row.querySelector(".ai-bubble") : null;
      if (!row || !bubble) return;

      bubble.classList.remove("ai-loading");
      row.setAttribute("data-raw-text", text || "");

      var menuLinks = createAiMenuLinks(text);
      if (menuLinks) row.appendChild(menuLinks);
      row.appendChild(createAiMessageActions());
    }

    function revealAiMarkdownMessage(id, text, done) {
      var row = id ? document.getElementById(id) : null;
      var bubble = row ? row.querySelector(".ai-bubble") : null;
      var list = document.getElementById("aiMessages");
      if (!bubble) {
        if (typeof done === "function") done();
        return;
      }

      bubble.classList.remove("ai-loading");

      var answer = String(text || "");
      var tokens = answer.split(/(\s+)/).filter(function (token) {
        return token !== "";
      });
      var targetMs = Math.min(1800, Math.max(900, answer.length * 3));
      var chunkSize = Math.max(
        2,
        Math.ceil(tokens.length / Math.max(1, Math.floor(targetMs / AI_REVEAL_TICK_MS))),
      );
      var index = 0;
      var visible = "";

      function tick() {
        visible += tokens.slice(index, index + chunkSize).join("");
        index += chunkSize;
        updateAiMessage(id, visible);
        if (list) list.scrollTop = list.scrollHeight;

        if (index < tokens.length) {
          setTimeout(tick, AI_REVEAL_TICK_MS);
          return;
        }

        updateAiMessage(id, answer);
        if (typeof done === "function") done();
      }

      tick();
    }

    function renderAiMarkdown(value) {
      var text = String(value === undefined || value === null ? "" : value).trim();
      if (!text) return "";

      var blocks = extractCodeBlocks(text);
      text = blocks.text;

      var lines = text.split(/\n/);
      var html = "";
      var listType = "";
      var paragraph = [];

      function flushParagraph() {
        if (!paragraph.length) return;
        html += "<p>" + renderInlineMarkdown(paragraph.join(" ")) + "</p>";
        paragraph = [];
      }

      function closeList() {
        if (!listType) return;
        html += "</" + listType + ">";
        listType = "";
      }

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var tableInfo = isMarkdownTable(lines, i);
        var trimmed = line.trim();
        var heading = trimmed.match(/^(#{1,3})\s+(.+)$/);
        var ordered = trimmed.match(/^\d+\.\s+(.*)$/);
        var unordered = trimmed.match(/^[-*]\s+(.*)$/);
        var quote = trimmed.match(/^>\s?(.*)$/);

        if (!trimmed) {
          flushParagraph();
          closeList();
          continue;
        }

        if (tableInfo) {
          flushParagraph();
          closeList();
          html += renderMarkdownTable(tableInfo.rows);
          i = tableInfo.endIndex;
          continue;
        }

        if (/^---+$/.test(trimmed) || /^\*\*\*+$/.test(trimmed)) {
          flushParagraph();
          closeList();
          html += "<hr>";
          continue;
        }

        if (/^@@CODE_BLOCK_\d+@@$/.test(trimmed)) {
          flushParagraph();
          closeList();
          html += blocks.html[trimmed] || "";
          continue;
        }

        if (heading) {
          flushParagraph();
          closeList();
          html +=
            "<h" +
            heading[1].length +
            ">" +
            renderInlineMarkdown(heading[2]) +
            "</h" +
            heading[1].length +
            ">";
          continue;
        }

        if (quote) {
          flushParagraph();
          closeList();
          html += "<blockquote>" + renderInlineMarkdown(quote[1]) + "</blockquote>";
          continue;
        }

        if (ordered || unordered) {
          var type = ordered ? "ol" : "ul";
          if (listType !== type) {
            flushParagraph();
            closeList();
            html += "<" + type + ">";
            listType = type;
          }
          html += "<li>" + renderInlineMarkdown(ordered ? ordered[1] : unordered[1]) + "</li>";
          continue;
        }

        paragraph.push(trimmed);
      }

      flushParagraph();
      closeList();
      return enhanceAiOutput(html);
    }

    function extractCodeBlocks(value) {
      var html = {};
      var index = 0;
      var text = value.replace(/```([\s\S]*?)```/g, function (_, code) {
        var key = "@@CODE_BLOCK_" + index++ + "@@";
        html[key] =
          "<pre><code>" +
          escapeAiHtml(code.replace(/^\n|\n$/g, "")) +
          "</code></pre>";
        return key;
      });

      return { text: text, html: html };
    }

    function renderInlineMarkdown(value) {
      var text = escapeAiHtml(value || "");
      text = text.replace(
        /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
        function (_, label, url) {
          return (
            '<a href="' +
            escapeAiHtml(url) +
            '" target="_blank" rel="noopener noreferrer">' +
            label +
            "</a>"
          );
        },
      );
      text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
      text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      text = text.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, "$1<em>$2</em>");
      return text;
    }

    function isMarkdownTable(lines, startIndex) {
      if (startIndex + 1 >= lines.length) return null;
      var header = lines[startIndex].trim();
      var separator = lines[startIndex + 1].trim();
      if (!/^\|.+\|$/.test(header) || !/^\|?[\s:-]+\|[\s|:-]+\|?$/.test(separator)) {
        return null;
      }

      var rows = [header];
      var endIndex = startIndex + 1;
      for (var i = startIndex + 2; i < lines.length; i++) {
        if (!/^\|.+\|$/.test(lines[i].trim())) break;
        rows.push(lines[i].trim());
        endIndex = i;
      }

      return { rows: rows, endIndex: endIndex };
    }

    function splitTableRow(row) {
      return row
        .replace(/^\||\|$/g, "")
        .split("|")
        .map(function (cell) {
          return cell.trim();
        });
    }

    function renderMarkdownTable(rows) {
      var headers = splitTableRow(rows[0]);
      var bodyRows = rows.slice(1).map(splitTableRow);
      var html = '<div class="ai-table-wrap"><table class="ai-md-table"><thead><tr>';
      headers.forEach(function (cell) {
        html += "<th>" + renderInlineMarkdown(cell) + "</th>";
      });
      html += "</tr></thead><tbody>";
      bodyRows.forEach(function (row) {
        html += "<tr>";
        headers.forEach(function (_, index) {
          var className = isLongTextColumn(headers[index]) ? ' class="ai-col-long"' : "";
          html += "<td" + className + ">" + renderInlineMarkdown(row[index] || "") + "</td>";
        });
        html += "</tr>";
      });
      html += "</tbody></table></div>";
      return html;
    }

    function isLongTextColumn(header) {
      return /nama|email|petugas|ppl|pml|sls|kecamatan/i.test(header || "");
    }

    function createAiMenuLinks(text) {
      var sections = detectAiSections(text || "");
      if (!sections.length) return null;

      var wrap = document.createElement("div");
      wrap.className = "ai-menu-links";
      sections.forEach(function (item) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "ai-action-btn ai-menu-link";
        button.setAttribute("data-ai-section", item.section);
        button.textContent = item.label;
        wrap.appendChild(button);
      });
      return wrap;
    }

    function detectAiSections(text) {
      var found = [];
      var rules = [
        { pattern: /\b(PPL|Petugas)\b/i, section: "petugas", label: "Lihat menu Petugas / PPL" },
        { pattern: /\b(PML|Pengawas)\b/i, section: "pml", label: "Lihat menu PML / Pengawas" },
        { pattern: /\bSLS\b/i, section: "sls", label: "Lihat menu SLS Detail" },
        { pattern: /\bKecamatan\b/i, section: "kecamatan", label: "Lihat menu Kecamatan" },
      ];

      rules.forEach(function (rule) {
        if (rule.pattern.test(text)) found.push(rule);
      });
      return found.slice(0, 3);
    }

    function navigateAiSection(section) {
      if (!section) return;
      var button =
        document.querySelector('[data-section="' + section + '"]') ||
        document.querySelector('[data-section-jump="' + section + '"]');

      if (button) {
        button.click();
      } else {
        var target = document.getElementById("section-" + section);
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      document.body.classList.remove("ai-open");
    }

    function enhanceAiOutput(html) {
      html = html.replace(
        /(^|>)(Prioritas|Catatan audit|Rekomendasi)(:?)(?=<|$)/gi,
        '$1<span class="ai-callout-title">$2$3</span>',
      );
      html = html.replace(/\b(KRITIS|PERHATIAN|AMAN)\b/g, function (match) {
        return '<span class="ai-status-badge ' + match.toLowerCase() + '">' + match + "</span>";
      });
      html = html.replace(
        /<p><span class="ai-callout-title">([^<]+)<\/span>([\s\S]*?)<\/p>/g,
        '<div class="ai-callout"><strong>$1</strong>$2</div>',
      );

      return html;
    }

    function createAiMessageActions() {
      var actions = document.createElement("div");
      actions.className = "ai-message-actions";
      actions.innerHTML =
        '<button type="button" class="ai-action-btn" data-ai-action="copy">Salin</button>' +
        '<button type="button" class="ai-action-btn" data-ai-action="speak">Suara</button>' +
        '<button type="button" class="ai-action-btn ai-stop" data-ai-action="stop">Stop Suara</button>';
      return actions;
    }

    function resizeAiPrompt(prompt) {
      if (!prompt) return;
      prompt.style.height = "auto";
      prompt.style.height = Math.min(prompt.scrollHeight, 150) + "px";
    }

    function copyAiText(text, button) {
      if (!text) return setAiButtonFeedback(button, "Kosong");

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard
          .writeText(text)
          .then(function () {
            setAiButtonFeedback(button, "Tersalin");
          })
          .catch(function () {
            fallbackCopyAiText(text, button);
          });
        return;
      }

      fallbackCopyAiText(text, button);
    }

    function fallbackCopyAiText(text, button) {
      var textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();

      try {
        document.execCommand("copy");
        setAiButtonFeedback(button, "Tersalin");
      } catch (error) {
        setAiButtonFeedback(button, "Gagal");
      }

      document.body.removeChild(textarea);
    }

    function speakAiText(text, button, messageId) {
      if (!("speechSynthesis" in window) || !window.SpeechSynthesisUtterance) {
        setAiButtonFeedback(button, "Tidak support");
        return;
      }

      if (!text) return;
      window.speechSynthesis.cancel();
      document.querySelectorAll(".ai-message.is-speaking").forEach(function (item) {
        item.classList.remove("is-speaking");
      });
      AI_SPEAKING_ID = messageId || "";
      var message = messageId ? document.getElementById(messageId) : null;
      if (message) message.classList.add("is-speaking");

      var utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "id-ID";
      utterance.rate = 0.96;
      utterance.pitch = 1;
      utterance.onend = function () {
        AI_SPEAKING_ID = "";
        if (message) message.classList.remove("is-speaking");
      };
      utterance.onerror = function () {
        AI_SPEAKING_ID = "";
        if (message) message.classList.remove("is-speaking");
        setAiButtonFeedback(button, "Gagal");
      };

      window.speechSynthesis.speak(utterance);
      setAiButtonFeedback(button, "Membaca");
    }

    function stopAiSpeech() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      document.querySelectorAll(".ai-message.is-speaking").forEach(function (item) {
        item.classList.remove("is-speaking");
      });
      AI_SPEAKING_ID = "";
    }

    function setAiButtonFeedback(button, label) {
      if (!button) return;
      var original = button.getAttribute("data-original-label") || button.textContent;
      button.setAttribute("data-original-label", original);
      button.textContent = label;
      setTimeout(function () {
        button.textContent = original;
      }, 1200);
    }

    function escapeAiHtml(value) {
      return String(value === undefined || value === null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function removeAiMessage(id) {
      var el = id ? document.getElementById(id) : null;
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }
  })();
</script>
