<aside class="ai-drawer" id="aiDrawer" aria-label="Asisten AI Dashboard">
  <div class="ai-head">
    <div>
      <span>SkieAI</span>
      <h3>Analisis Dashboard</h3>
    </div>
    <button class="ai-icon-btn" id="aiClose" title="Tutup">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="ai-tools">
    <select id="aiContextMode" class="ai-select" title="Mode konteks data">
      <option value="summary">Ringkasan cepat</option>
      <option value="detail">Detail terbatas</option>
      <option value="deep">Analisis mendalam</option>
    </select>
    <div class="ai-suggestions" aria-label="Contoh pertanyaan AI">
      <button class="ai-tool-btn" data-ai-prompt="Ringkas kondisi dashboard hari ini. Sebutkan prioritas utama yang perlu ditindaklanjuti.">Ringkas kondisi hari ini</button>
      <button class="ai-tool-btn" data-ai-prompt="Apa 3 prioritas utama hari ini berdasarkan data dashboard?">3 prioritas utama</button>
      <button class="ai-tool-btn" data-ai-prompt="Siapa PPL paling berisiko? Jelaskan alasannya berdasarkan open, draft, realisasi, dan risk score.">PPL paling berisiko</button>
      <button class="ai-tool-btn" data-ai-prompt="SLS mana yang open-nya paling tinggi dan perlu ditindaklanjuti lebih dulu?">SLS open tertinggi</button>
      <button class="ai-tool-btn" data-ai-prompt="Kecamatan mana yang tertinggal dari target harian? Urutkan dari paling perlu perhatian.">Kecamatan tertinggal</button>
      <button class="ai-tool-btn" data-ai-prompt="PML mana yang perlu perhatian berdasarkan agregasi PPL, open, draft, dan realisasi?">PML perlu perhatian</button>
      <button class="ai-tool-btn" data-ai-prompt="Bandingkan PPL terbaik dan PPL terendah. Apa pembeda utamanya?">Bandingkan PPL</button>
      <button class="ai-tool-btn" data-ai-prompt="Buat rencana tindak lanjut hari ini yang praktis dan berurutan.">Rencana tindak lanjut</button>
      <button class="ai-tool-btn" data-ai-prompt="Buat pesan WhatsApp singkat untuk PML agar menindaklanjuti PPL/SLS berisiko.">Pesan WhatsApp PML</button>
      <button class="ai-tool-btn" data-ai-prompt="Jelaskan kondisi data ini untuk pimpinan dengan bahasa singkat dan jelas.">Brief pimpinan</button>
      <button class="ai-tool-btn" data-ai-prompt="Audit apakah ada angka yang janggal atau perlu dicek ulang dari dashboard ini.">Audit angka janggal</button>
      <button class="ai-tool-btn" data-ai-prompt="Buat briefing 1 menit untuk rapat pagi berdasarkan kondisi dashboard terbaru.">Briefing rapat pagi</button>
      <button class="ai-tool-btn" data-ai-prompt="Apa risiko terbesar dari data sekarang dan dampaknya terhadap target?">Risiko terbesar</button>
      <button class="ai-tool-btn" data-ai-prompt="Buat rekomendasi tindakan per kecamatan berdasarkan kondisi submit, target, dan risiko.">Rekomendasi per kecamatan</button>
    </div>
  </div>

  <div class="ai-messages" id="aiMessages">
    <div class="ai-message assistant">
      <div class="ai-bubble">
        Saya bisa membantu membaca ringkasan, risiko, open, draft, PPL, PML, dan SLS berdasarkan data dashboard yang sedang dimuat.
      </div>
    </div>
  </div>

  <form class="ai-compose" id="aiForm">
    <textarea
      id="aiPrompt"
      rows="3"
      maxlength="4000"
      placeholder="Tulis pertanyaan analisis..."
    ></textarea>
    <div class="ai-compose-hint">Enter untuk baris baru. Ctrl+Enter untuk kirim.</div>
    <button type="submit" id="aiSend">
      <i class="fa-solid fa-paper-plane"></i>
      Kirim
    </button>
  </form>
</aside>

<style>
  .ai-fab {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 80;
    width: 60px;
    height: 60px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 18px 42px rgba(37, 99, 235, 0.34);
    border: 1px solid rgba(191, 219, 254, 0.28);
    transition: 0.2s ease;
  }

  .ai-fab img {
    width: 34px;
    height: 34px;
    display: block;
    object-fit: contain;
  }

  .ai-fab:hover {
    transform: translateY(-2px);
    box-shadow: 0 22px 50px rgba(37, 99, 235, 0.42);
  }

  .ai-drawer {
    position: fixed;
    inset: 0 0 0 auto;
    z-index: 75;
    width: min(420px, 100vw);
    transform: translateX(104%);
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    background: rgba(15, 23, 42, 0.97);
    border-left: 1px solid rgba(148, 163, 184, 0.18);
    box-shadow: -24px 0 60px rgba(2, 6, 23, 0.38);
    transition: transform 0.24s cubic-bezier(0.2, 0, 0, 1);
    box-sizing: border-box;
    max-width: 100%;
    min-width: 0;
  }

  body.ai-open .ai-drawer {
    transform: translateX(0);
  }

  body.ai-open .ai-fab {
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
  }

  @media (min-width: 1201px) {
    body.ai-open .main {
      width: calc(100% - var(--sidebar-width) - 420px);
    }

    body.sidebar-collapsed.ai-open .main {
      width: calc(100% - var(--sidebar-collapsed-width) - 420px);
    }
  }

  .ai-head {
    min-height: 78px;
    padding: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.14);
  }

  .ai-head span {
    color: #93c5fd;
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
  }

  .ai-head h3 {
    margin: 3px 0 0;
    font-size: 18px;
    font-weight: 950;
  }

  .ai-icon-btn,
  .ai-tool-btn,
  .ai-compose button {
    border: 1px solid rgba(148, 163, 184, 0.16);
    background: rgba(255, 255, 255, 0.055);
    color: #e5e7eb;
    border-radius: 12px;
    font-weight: 800;
    transition: 0.18s ease;
  }

  .ai-icon-btn {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
  }

  .ai-tools {
    padding: 14px 18px;
    display: grid;
    gap: 8px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    min-width: 0;
  }

  .ai-select {
    min-height: 36px;
    border-radius: 11px;
    padding: 0 10px;
    color: #e5e7eb;
    background: rgba(255, 255, 255, 0.055);
    border: 1px solid rgba(148, 163, 184, 0.16);
    font-size: 12px;
    font-weight: 800;
  }

  .ai-select option {
    background: #111827;
  }

  .ai-tool-btn {
    min-height: 36px;
    padding: 0 11px;
    font-size: 12px;
    white-space: nowrap;
  }

  .ai-suggestions {
    max-width: 100%;
    min-width: 0;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: thin;
  }

  .ai-icon-btn:hover,
  .ai-tool-btn:hover,
  .ai-compose button:hover {
    border-color: rgba(96, 165, 250, 0.34);
    background: rgba(37, 99, 235, 0.14);
  }

  .ai-messages {
    min-height: 0;
    min-width: 0;
    max-width: 100%;
    overflow: auto;
    padding: 18px 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    box-sizing: border-box;
  }

  .ai-message {

    flex-direction: column;
    gap: 7px;
    min-width: 0;
    max-width: 100%;
    box-sizing: border-box;

  .ai-message.user {
    align-items: flex-end;
  }

  .ai-bubble {
    min-width: 0;

    overflow-wrap: anywhere;
    word-break: break-word;

    color: #ffffff;

  }

  .ai-bubble em {
    color: #c7d2fe;
  }

  .ai-bubble p {
    margin: 0 0 10px;
  }

  .ai-bubble p:last-child {
    margin-bottom: 0;
  }

  .ai-bubble ul,
  .ai-bubble ol {
    margin: 8px 0 12px;
    padding-left: 20px;
  }

  .ai-bubble li {
    margin: 5px 0;
  }

  .ai-bubble code {
    padding: 2px 5px;

    background: rgba(15, 23, 42, 0.65);
    color: #bfdbfe;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .ai-bubble pre {

    padding: 0;
    background: transparent;
    color: #dbeafe;

  .ai-bubble h1 {
    font-size: 18px;
  }

  .ai-bubble h2 {
    font-size: 16px;
  }

  .ai-bubble h3 {
    font-size: 14px;
  }

  .ai-bubble blockquote,
  .ai-callout {
    margin: 10px 0 12px;
    padding: 10px 12px;

    margin: 14px 0;

  }

  .ai-table-wrap {

    overflow-y: hidden;

    box-sizing: border-box;
  }

<script>
  (function () {
    var AI_WORKER_CHAT_URL = "https://bps.rahmatyoung10.workers.dev/chat";
    var AI_MODEL = "cohere/north-mini-code:free";
    var AI_CHAT_HISTORY = [];
    var AI_SPEAKING_ID = "";

    document.addEventListener("DOMContentLoaded", function () {
      var fab = document.getElementById("aiFab");
      var drawer = document.getElementById("aiDrawer");
      var close = document.getElementById("aiClose");
      var form = document.getElementById("aiForm");
      var prompt = document.getElementById("aiPrompt");
      var send = document.getElementById("aiSend");
      var mode = document.getElementById("aiContextMode");

      if (!fab || !drawer || !form || !prompt || !send) return;

      fab.addEventListener("click", function () {
        document.body.classList.add("ai-open");
        setTimeout(function () {
          prompt.focus();
        }, 120);
      });

      if (close) {
        close.addEventListener("click", function () {
          document.body.classList.remove("ai-open");
        });
      }

      document.querySelectorAll("[data-ai-prompt]").forEach(function (button) {
        button.addEventListener("click", function () {
          prompt.value = button.getAttribute("data-ai-prompt") || "";
          resizeAiPrompt(prompt);
          prompt.focus();
        });
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        askAi();
      });

      prompt.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          askAi();
        }
      });

      prompt.addEventListener("input", function () {
        resizeAiPrompt(prompt);
      });

      resizeAiPrompt(prompt);

      function askAi() {
        var text = prompt.value.trim();
        if (!text || send.disabled) return;

        if (!window.APP_STATE || !window.APP_STATE.payload) {
          addAiMessage(
            "assistant",
            "Data dashboard belum selesai dimuat. Tunggu sampai status data menjadi Sheets OK, lalu coba lagi.",
          );
          return;
        }

        addAiMessage("user", text);
        prompt.value = "";
        resizeAiPrompt(prompt);
        send.disabled = true;
        send.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Menganalisis';

        var loadingId = addAiMessage(
          "assistant",
          "Tahap 1/4 - Membaca data dashboard dari Sheet Progres, Petugas, dan SLS...",
          true,
        );
        var progressTimers = startAiProgress(loadingId);

        fetch(AI_WORKER_CHAT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(buildAiWorkerPayload(text, mode ? mode.value : "summary")),
        })
          .then(function (response) {
            return response.json().then(function (payload) {
              payload.__status = response.status;
              return payload;
            });
          })
          .then(function (response) {
            clearAiProgress(progressTimers);
            removeAiMessage(loadingId);

            if (!response || response.success === false) {
              addAiMessage(
                "assistant",
                response && response.error
                  ? response.error
                  : "AI belum bisa memproses permintaan.",
              );
            } else {
              var answer = response.answer || "Tidak ada jawaban.";
              if (response.finish_reason === "length") {
                answer +=
                  "\n\nCatatan: jawaban terpotong karena batas output model. Ketik \"lanjutkan\" atau persempit pertanyaan.";
              }
              addAiMessage("assistant", answer);
              pushAiHistory("user", text);
              pushAiHistory("assistant", answer);
            }

            resetAiSend();
          })
          .catch(function (error) {
            clearAiProgress(progressTimers);
            removeAiMessage(loadingId);
            addAiMessage(
              "assistant",
              "Terjadi kesalahan saat menghubungi AI Worker. Cek URL Worker, CORS, dan secret OPENROUTER_API_KEY.",
            );
            console.error(error);
            resetAiSend();
          });
      }

    function resetAiSend() {
        send.disabled = false;
        send.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim';
      }
    });

    document.addEventListener("click", function (event) {
      var sectionButton = event.target.closest("[data-ai-section]");
      if (sectionButton) {
        navigateAiSection(sectionButton.getAttribute("data-ai-section"));
        return;
      }

      var button = event.target.closest("[data-ai-action]");
      if (!button) return;

      var message = button.closest(".ai-message");
      var text = message ? message.getAttribute("data-raw-text") || "" : "";
      var action = button.getAttribute("data-ai-action");

      if (action === "copy") {
        copyAiText(text, button);
      }

      if (action === "speak") {
        speakAiText(text, button, message ? message.id : "");
      }

      if (action === "stop") {
        stopAiSpeech();
      }
    });

    function buildAiWorkerPayload(prompt, contextMode) {
      var context = buildAiDashboardContext(contextMode);

      return {
        model: AI_MODEL,
        temperature: 0.15,
        max_tokens: contextMode === "deep" ? 3200 : 2400,
        messages: [
          {
            role: "system",
            content:
              "Anda adalah asisten analisis dashboard monitoring BPS Bireuen. " +
              "Anda harus bekerja seperti analis data operasional yang teliti. " +
              "Gunakan hanya DATA_DASHBOARD_JSON yang diberikan sebagai sumber kebenaran. Jangan mengarang angka, nama, email, kecamatan, SLS, atau status. " +
              "Sebelum menjawab, lakukan proses internal bertahap: baca metadata sumber, cek ringkasan dashboard, hitung ulang rasio penting dari angka mentah bila tersedia, bandingkan ranking/status, lalu susun jawaban. " +
              "Jangan tampilkan chain-of-thought panjang. Tampilkan hanya ringkasan proses singkat jika relevan, misalnya 'Data dicek dari Progres/Petugas/SLS'. " +
              "Jika data tidak tersedia, katakan tidak tersedia dan sebutkan field yang kurang. " +
              "Beri prioritas, temuan, dan rekomendasi praktis yang bisa ditindaklanjuti. " +
              "Untuk pertanyaan tertinggi/terbaik gunakan daftar topRealisasi atau topBerhasil. " +
              "Untuk pertanyaan terendah gunakan bottomRealisasi atau bottomSls. " +
              "Untuk risiko gunakan topRisk/highestRisk. Jangan membalik tertinggi dan terendah. " +
              "Untuk pertanyaan komputasi, pakai computedChecks dan data mentah yang tersedia, lalu jelaskan hasil akhirnya dengan angka konkret. " +
              "Format jawaban dengan heading pendek, bullet, dan angka konkret. " +
              "Untuk pertanyaan ranking, tampilkan 5 teratas kecuali diminta lebih. " +
              "Jika membuat tabel ranking atau daftar Petugas/PML/SLS/Kecamatan, tampilkan maksimal 5 baris secara default. " +
              "Jika data terlalu banyak, tampilkan ringkasan 3 sampai 5 baris saja. " +
              "Jangan membuat tabel terlalu banyak kolom. Prioritaskan kolom penting: Nama, Kecamatan, Realisasi %, Open, Draft, Risk Score, Status. " +
              "Email jangan ditampilkan default kecuali user secara eksplisit meminta email. " +
              "Target dan Berhasil Didata tampilkan hanya jika relevan dengan pertanyaan. " +
              "Setelah tabel ranking, tambahkan kalimat: Buka menu terkait untuk melihat data lengkap. " +
              "Jika ada selisih antara summary dan hasil hitung ulang, sebutkan sebagai catatan audit. " +
              "Jangan menampilkan JSON mentah.",
          },
          {
            role: "user",
            content:
              "DATA_DASHBOARD_JSON:\n" +
              JSON.stringify(context) +
              "\n\nGunakan data ini sebagai sumber kebenaran utama.",
          },
        ].concat(AI_CHAT_HISTORY.slice(-8), [
          {
            role: "user",
            content: prompt,
          },
        ]),
      };
    }

    function buildAiDashboardContext(mode) {
      var payload = window.APP_STATE && window.APP_STATE.payload ? window.APP_STATE.payload : null;
      if (!payload) {
        return {
          mode: mode,
          dataReady: false,
          note: "Payload dashboard belum tersedia di browser.",
        };
      }

      var kecamatan = payload.kecamatan || {};
      var petugas = payload.petugas || {};
      var sls = payload.sls || {};
      var maxRows = mode === "deep" ? 80 : 25;

      var context = {
        app: payload.app,
        version: payload.version,
        generatedAt: payload.generatedAt,
        mode: mode,
        dataReady: true,
        model: AI_MODEL,
        sourceAudit: {
          dashboardGeneratedAt: payload.generatedAt || "-",
          kecamatanSource: kecamatan.source || "-",
          petugasSource: petugas.source || "-",
          slsSource: sls.source || "-",
          kondisiData: kecamatan.meta && kecamatan.meta.kondisiData ? kecamatan.meta.kondisiData : "-",
          kondisiDataCell: "Progres!B3:D3",
          targetHarianCell:
            kecamatan.meta && kecamatan.meta.targetCell
              ? "Progres!" + kecamatan.meta.targetCell
              : "Progres!E3",
        },
        computedChecks: buildAiComputedChecks(payload),
        executive: payload.executive || {},
        rankingGuide: {
          topRealisasi: "Petugas dengan persentase realisasi tertinggi.",
          bottomRealisasi: "Petugas dengan persentase realisasi terendah.",
          topBerhasil: "Petugas dengan jumlah berhasil didata terbanyak.",
          topOpen: "Petugas/SLS dengan open terbanyak.",
          topDraft: "Petugas/SLS dengan draft terbanyak.",
          topRisk: "Petugas dengan risk score tertinggi.",
          rankingSubmit: "Kecamatan dengan percentSubmit tertinggi.",
          warningList: "Kecamatan yang perlu perhatian karena submit rendah.",
        },
        kecamatan: {
          summary: kecamatan.summary || {},
          rankingSubmit: slimRows(kecamatan.rankingSubmit || [], maxRows, [
            "kode",
            "kecamatan",
            "percentSubmit",
            "submit",
            "approve",
            "jumlahPPL",
            "status",
          ]),
          warningList: slimRows(kecamatan.warningList || [], maxRows, [
            "kode",
            "kecamatan",
            "percentSubmit",
            "submit",
            "approve",
            "jumlahPPL",
            "status",
          ]),
        },
        petugas: {
          summary: petugas.summary || {},
          topRealisasi: slimRows((petugas.ranking && petugas.ranking.topRealisasi) || [], maxRows, [
            "pplNama",
            "pplEmail",
            "pmlNama",
            "kecamatan",
            "targetFasih",
            "berhasilDidata",
            "persenRealisasi",
            "open",
            "draft",
            "riskScore",
            "status",
          ]),
          topBerhasil: slimRows((petugas.ranking && petugas.ranking.topBerhasil) || [], maxRows, [
            "pplNama",
            "pplEmail",
            "pmlNama",
            "kecamatan",
            "targetFasih",
            "berhasilDidata",
            "persenRealisasi",
            "open",
            "draft",
            "riskScore",
            "status",
          ]),
          topRisk: slimRows((petugas.ranking && petugas.ranking.highestRisk) || [], maxRows, [
            "pplNama",
            "pplEmail",
            "pmlNama",
            "kecamatan",
            "persenRealisasi",
            "open",
            "draft",
            "riskScore",
            "status",
          ]),
          bottomRealisasi: slimRows(
            (petugas.ranking && petugas.ranking.bottomRealisasi) || [],
            maxRows,
            [
              "pplNama",
              "pplEmail",
              "pmlNama",
              "kecamatan",
              "targetFasih",
              "berhasilDidata",
              "persenRealisasi",
              "open",
              "draft",
              "status",
            ],
          ),
          topOpen: slimRows((petugas.ranking && petugas.ranking.topOpen) || [], maxRows, [
            "pplNama",
            "pmlNama",
            "kecamatan",
            "targetFasih",
            "berhasilDidata",
            "open",
            "draft",
            "riskScore",
          ]),
          topDraft: slimRows((petugas.ranking && petugas.ranking.topDraft) || [], maxRows, [
            "pplNama",
            "pmlNama",
            "kecamatan",
            "targetFasih",
            "berhasilDidata",
            "open",
            "draft",
            "riskScore",
          ]),
        },
        pml: {
          summary: petugas.pml && petugas.pml.summary ? petugas.pml.summary : {},
          topRealisasi: slimRows((petugas.pml && petugas.pml.topRealisasi) || [], maxRows, [
            "pmlNama",
            "pmlEmail",
            "kecamatan",
            "totalPPL",
            "totalSLS",
            "targetFasih",
            "berhasilDidata",
            "persenRealisasi",
            "open",
            "draft",
            "riskScore",
          ]),
          topBerhasil: slimRows((petugas.pml && petugas.pml.topBerhasil) || [], maxRows, [
            "pmlNama",
            "pmlEmail",
            "kecamatan",
            "totalPPL",
            "totalSLS",
            "targetFasih",
            "berhasilDidata",
            "persenRealisasi",
            "open",
            "draft",
            "riskScore",
          ]),
          highestRisk: slimRows((petugas.pml && petugas.pml.highestRisk) || [], maxRows, [
            "pmlNama",
            "pmlEmail",
            "kecamatan",
            "totalPPL",
            "totalSLS",
            "targetFasih",
            "berhasilDidata",
            "persenRealisasi",
            "open",
            "draft",
            "riskScore",
          ]),
        },
        sls: {
          summary: sls.summary || {},
          topSls: slimRows((sls.ranking && sls.ranking.topSls) || [], maxRows, [
            "kodeSls",
            "kecamatan",
            "pplNama",
            "pmlNama",
            "targetFasih",
            "berhasilDidata",
            "persenRealisasi",
            "open",
            "draft",
            "riskScore",
            "status",
          ]),
          topOpen: slimRows((sls.ranking && sls.ranking.topOpen) || [], maxRows, [
            "kodeSls",
            "kecamatan",
            "pplNama",
            "pmlNama",
            "targetFasih",
            "berhasilDidata",
            "persenRealisasi",
            "open",
            "draft",
            "riskScore",
            "status",
          ]),
          bottomSls: slimRows((sls.ranking && sls.ranking.bottomSls) || [], maxRows, [
            "kodeSls",
            "kecamatan",
            "pplNama",
            "pmlNama",
            "targetFasih",
            "berhasilDidata",
            "persenRealisasi",
            "open",
            "draft",
            "riskScore",
            "status",
          ]),
        },
      };

      if (mode === "detail" || mode === "deep") {
        context.petugas.dataPreview = slimRows(petugas.data || [], maxRows, [
          "pplNama",
          "pplEmail",
          "pmlNama",
          "pmlEmail",
          "kecamatan",
          "totalSLS",
          "targetFasih",
          "berhasilDidata",
          "persenRealisasi",
          "open",
          "draft",

          "status",
        ]);
        context.sls.dataPreview = slimRows(sls.data || [], maxRows, [
          "kodeSls",

        ]);
      }

      if (mode === "deep") {
        context.kecamatan.dataPreview = slimRows(kecamatan.data || [], maxRows, [
          "kode",
          "kecamatan",
          "prelist",
          "submit",
          "percentSubmit",
          "selisihPercent",
          "approve",
          "percentApprove",
          "jumlahPPL",
          "status",
        ]);
      }

      return context;
    }

    function buildAiComputedChecks(payload) {
      var kecamatan = (payload && payload.kecamatan) || {};
      var petugas = (payload && payload.petugas) || {};
      var sls = (payload && payload.sls) || {};
      var kecRows = kecamatan.data || [];
      var petugasRows = petugas.data || [];
      var slsRows = sls.data || [];

      var totalKecamatanSubmit = sumRows(kecRows, "submit");
      var totalKecamatanPrelist = sumRows(kecRows, "prelist");
      var totalKecamatanApprove = sumRows(kecRows, "approve");
      var totalPetugasTarget = sumRows(petugasRows, "targetFasih");
      var totalPetugasBerhasil = sumRows(petugasRows, "berhasilDidata");
      var totalPetugasOpen = sumRows(petugasRows, "open");
      var totalPetugasDraft = sumRows(petugasRows, "draft");
      var totalSlsTarget = sumRows(slsRows, "targetFasih");
      var totalSlsBerhasil = sumRows(slsRows, "berhasilDidata");

      return {
        rowCounts: {
          kecamatan: kecRows.length,
          petugas: petugasRows.length,
          sls: slsRows.length,
        },
        recomputedKecamatan: {
          totalPrelistFromRows: totalKecamatanPrelist,
          totalSubmitFromRows: totalKecamatanSubmit,
          totalApproveFromRows: totalKecamatanApprove,
          percentSubmitFromRows: percent(totalKecamatanSubmit, totalKecamatanPrelist),
          percentApproveFromRows: percent(totalKecamatanApprove, totalKecamatanSubmit),
          summaryPercentSubmit: num(kecamatan.summary && kecamatan.summary.percentSubmit),
          summaryPercentApprove: num(kecamatan.summary && kecamatan.summary.percentApprove),
          targetHarian: num(kecamatan.summary && kecamatan.summary.targetHarian),
        },
        recomputedPetugas: {
          totalTargetFromRows: totalPetugasTarget,
          totalBerhasilFromRows: totalPetugasBerhasil,
          totalOpenFromRows: totalPetugasOpen,
          totalDraftFromRows: totalPetugasDraft,
          persenRealisasiFromRows: percent(totalPetugasBerhasil, totalPetugasTarget),
          openRateFromRows: percent(totalPetugasOpen, totalPetugasTarget),
          draftRateFromRows: percent(totalPetugasDraft, totalPetugasTarget),
          summaryPersenRealisasi: num(petugas.summary && petugas.summary.persenRealisasi),
          summaryOpenRate: num(petugas.summary && petugas.summary.openRate),
          summaryDraftRate: num(petugas.summary && petugas.summary.draftRate),
        },
        recomputedSls: {
          totalTargetFromRows: totalSlsTarget,
          totalBerhasilFromRows: totalSlsBerhasil,
          persenRealisasiFromRows: percent(totalSlsBerhasil, totalSlsTarget),
          summaryTotalTarget: num(sls.summary && sls.summary.totalTarget),
          summaryTotalBerhasil: num(sls.summary && sls.summary.totalBerhasil),
        },
        riskSignals: {
          petugasKritis: petugasRows.filter(function (row) {
            return row && row.status === "KRITIS";
          }).length,
          petugasPerhatian: petugasRows.filter(function (row) {
            return row && row.status === "PERHATIAN";
          }).length,
          zeroProgressPpl: petugasRows.filter(function (row) {
            return row && num(row.berhasilDidata) === 0;
          }).length,
          highRiskPpl: petugasRows.filter(function (row) {
            return row && num(row.riskScore) >= 70;
          }).length,
        },
      };
    }

    function slimRows(rows, limit, keys) {
      return (rows || []).slice(0, limit).map(function (row) {
        var item = {};
        keys.forEach(function (key) {
          if (row && row[key] !== undefined) item[key] = row[key];
        });
        return item;
      });
    }

    function num(value) {
      var number = Number(value);
      return Number.isFinite(number) ? number : 0;
    }

    function sumRows(rows, key) {
      return (rows || []).reduce(function (total, row) {
        return total + num(row && row[key]);
      }, 0);
    }

    function percent(value, total) {
      value = num(value);
      total = num(total);
      if (!total) return 0;
      return Math.round((value / total) * 10000) / 100;
    }

    function startAiProgress(messageId) {
      var steps = [
        "Tahap 2/4 - Memvalidasi ringkasan, ranking, status risiko, dan sumber data...",
        "Tahap 3/4 - Menghitung ulang persentase, open, draft, target, dan realisasi...",
        "Tahap 4/4 - Menyusun jawaban operasional berdasarkan hasil cek data...",
      ];

      return steps.map(function (text, index) {
        return setTimeout(function () {
          updateAiMessage(messageId, text);
        }, 1200 + index * 1400);
      });
    }

    function clearAiProgress(timers) {
      (timers || []).forEach(function (timer) {
        clearTimeout(timer);
      });
    }

    function pushAiHistory(role, content) {
      if (!content) return;
      AI_CHAT_HISTORY.push({
        role: role,
        content: String(content).slice(0, 2500),
      });
      if (AI_CHAT_HISTORY.length > 10) {
        AI_CHAT_HISTORY = AI_CHAT_HISTORY.slice(AI_CHAT_HISTORY.length - 10);
      }
    }

    function addAiMessage(role, text, temporary) {
      var list = document.getElementById("aiMessages");
      if (!list) return "";

      var id = "ai-msg-" + Date.now() + "-" + Math.floor(Math.random() * 1000);
      var row = document.createElement("div");
      row.className = "ai-message " + role;
      row.id = id;
      row.setAttribute("data-raw-text", text || "");

      var bubble = document.createElement("div");
      bubble.className = "ai-bubble";
      if (temporary) bubble.classList.add("ai-loading");

      if (role === "assistant") {
        bubble.innerHTML = renderAiMarkdown(text);
      } else {
        bubble.textContent = text;
      }
      row.appendChild(bubble);

      if (role === "assistant" && !temporary) {
        var menuLinks = createAiMenuLinks(text);
        if (menuLinks) row.appendChild(menuLinks);
        row.appendChild(createAiMessageActions());
      }

      list.appendChild(row);
      list.scrollTop = list.scrollHeight;

      return id;
    }

    function updateAiMessage(id, text) {
      var row = id ? document.getElementById(id) : null;
      var bubble = row ? row.querySelector(".ai-bubble") : null;
      if (!bubble) return;
      row.setAttribute("data-raw-text", text || "");
      bubble.innerHTML = renderAiMarkdown(text);
    }

    function renderAiMarkdown(value) {
      var text = String(value === undefined || value === null ? "" : value).trim();
      if (!text) return "";

      var blocks = extractCodeBlocks(text);
      text = blocks.text;

      var lines = text.split(/\n/);
      var html = "";
      var listType = "";
      var paragraph = [];

      function flushParagraph() {
        if (!paragraph.length) return;
        html += "<p>" + renderInlineMarkdown(paragraph.join(" ")) + "</p>";
        paragraph = [];
      }

      function closeList() {
        if (!listType) return;
        html += "</" + listType + ">";
        listType = "";
      }

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var tableInfo = isMarkdownTable(lines, i);
        var trimmed = line.trim();
        var heading = trimmed.match(/^(#{1,3})\s+(.+)$/);
        var ordered = trimmed.match(/^\d+\.\s+(.*)$/);
        var unordered = trimmed.match(/^[-*]\s+(.*)$/);
        var quote = trimmed.match(/^>\s?(.*)$/);

        if (!trimmed) {
          flushParagraph();
          closeList();
          continue;
        }

        if (tableInfo) {
          flushParagraph();
          closeList();
          html += renderMarkdownTable(tableInfo.rows);
          i = tableInfo.endIndex;
          continue;
        }

        if (/^---+$/.test(trimmed) || /^\*\*\*+$/.test(trimmed)) {
          flushParagraph();
          closeList();
          html += "<hr>";
          continue;
        }

        if (/^@@CODE_BLOCK_\d+@@$/.test(trimmed)) {
          flushParagraph();
          closeList();
          html += blocks.html[trimmed] || "";
          continue;
        }

        if (heading) {
          flushParagraph();
          closeList();
          html +=
            "<h" +
            heading[1].length +
            ">" +
            renderInlineMarkdown(heading[2]) +
            "</h" +
            heading[1].length +
            ">";
          continue;
        }

        if (quote) {
          flushParagraph();
          closeList();
          html += "<blockquote>" + renderInlineMarkdown(quote[1]) + "</blockquote>";
          continue;
        }

        if (ordered || unordered) {
          var type = ordered ? "ol" : "ul";
          if (listType !== type) {
            flushParagraph();
            closeList();
            html += "<" + type + ">";
            listType = type;
          }
          html += "<li>" + renderInlineMarkdown(ordered ? ordered[1] : unordered[1]) + "</li>";
          continue;
        }

        paragraph.push(trimmed);
      }

      flushParagraph();
      closeList();
      return enhanceAiOutput(html);
    }

    function extractCodeBlocks(value) {
      var html = {};
      var index = 0;
      var text = value.replace(/```([\s\S]*?)```/g, function (_, code) {
        var key = "@@CODE_BLOCK_" + index++ + "@@";
        html[key] =
          "<pre><code>" +
          escapeAiHtml(code.replace(/^\n|\n$/g, "")) +
          "</code></pre>";
        return key;
      });

      return { text: text, html: html };
    }

    function renderInlineMarkdown(value) {
      var text = escapeAiHtml(value || "");
      text = text.replace(
        /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
        function (_, label, url) {
          return (
            '<a href="' +
            escapeAiHtml(url) +
            '" target="_blank" rel="noopener noreferrer">' +
            label +
            "</a>"
          );
        },
      );
      text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
      text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      text = text.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, "$1<em>$2</em>");
      return text;
    }

    function isMarkdownTable(lines, startIndex) {
      if (startIndex + 1 >= lines.length) return null;
      var header = lines[startIndex].trim();
      var separator = lines[startIndex + 1].trim();
      if (!/^\|.+\|$/.test(header) || !/^\|?[\s:-]+\|[\s|:-]+\|?$/.test(separator)) {
        return null;
      }

      var rows = [header];
      var endIndex = startIndex + 1;
      for (var i = startIndex + 2; i < lines.length; i++) {
        if (!/^\|.+\|$/.test(lines[i].trim())) break;
        rows.push(lines[i].trim());
        endIndex = i;
      }

      return { rows: rows, endIndex: endIndex };
    }

    function splitTableRow(row) {
      return row
        .replace(/^\||\|$/g, "")
        .split("|")
        .map(function (cell) {
          return cell.trim();
        });
    }

    function renderMarkdownTable(rows) {
      var headers = splitTableRow(rows[0]);
      var bodyRows = rows.slice(1).map(splitTableRow);
      var html = '<div class="ai-table-wrap"><table class="ai-md-table"><thead><tr>';
      headers.forEach(function (cell) {
        html += "<th>" + renderInlineMarkdown(cell) + "</th>";
      });
      html += "</tr></thead><tbody>";
      bodyRows.forEach(function (row) {
        html += "<tr>";
        headers.forEach(function (_, index) {
          var className = isLongTextColumn(headers[index]) ? ' class="ai-col-long"' : "";
          html += "<td" + className + ">" + renderInlineMarkdown(row[index] || "") + "</td>";
        });
        html += "</tr>";
      });
      html += "</tbody></table></div>";
      return html;
    }

    function isLongTextColumn(header) {
      return /nama|email|petugas|ppl|pml|sls|kecamatan/i.test(header || "");
    }

    function createAiMenuLinks(text) {
      var sections = detectAiSections(text || "");
      if (!sections.length) return null;

      var wrap = document.createElement("div");
      wrap.className = "ai-menu-links";
      sections.forEach(function (item) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "ai-action-btn ai-menu-link";
        button.setAttribute("data-ai-section", item.section);
        button.textContent = item.label;
        wrap.appendChild(button);
      });
      return wrap;
    }

    function detectAiSections(text) {
      var found = [];
      var rules = [
        { pattern: /\b(PPL|Petugas)\b/i, section: "petugas", label: "Lihat menu Petugas / PPL" },
        { pattern: /\b(PML|Pengawas)\b/i, section: "pml", label: "Lihat menu PML / Pengawas" },
        { pattern: /\bSLS\b/i, section: "sls", label: "Lihat menu SLS Detail" },
        { pattern: /\bKecamatan\b/i, section: "kecamatan", label: "Lihat menu Kecamatan" },
      ];

      rules.forEach(function (rule) {
        if (rule.pattern.test(text)) found.push(rule);
      });
      return found.slice(0, 3);
    }

    function navigateAiSection(section) {
      if (!section) return;
      var button =
        document.querySelector('[data-section="' + section + '"]') ||
        document.querySelector('[data-section-jump="' + section + '"]');

      if (button) {
        button.click();
      } else {
        var target = document.getElementById("section-" + section);
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      document.body.classList.remove("ai-open");
    }

    function enhanceAiOutput(html) {
      html = html.replace(
        /(^|>)(Prioritas|Catatan audit|Rekomendasi)(:?)(?=<|$)/gi,
        '$1<span class="ai-callout-title">$2$3</span>',
      );
      html = html.replace(/\b(KRITIS|PERHATIAN|AMAN)\b/g, function (match) {
        return '<span class="ai-status-badge ' + match.toLowerCase() + '">' + match + "</span>";
      });
      html = html.replace(
        /<p><span class="ai-callout-title">([^<]+)<\/span>([\s\S]*?)<\/p>/g,
        '<div class="ai-callout"><strong>$1</strong>$2</div>',
      );

      return html;
    }

    function createAiMessageActions() {
      var actions = document.createElement("div");
      actions.className = "ai-message-actions";
      actions.innerHTML =
        '<button type="button" class="ai-action-btn" data-ai-action="copy">Salin</button>' +
        '<button type="button" class="ai-action-btn" data-ai-action="speak">Suara</button>' +
        '<button type="button" class="ai-action-btn ai-stop" data-ai-action="stop">Stop Suara</button>';
      return actions;
    }

    function resizeAiPrompt(prompt) {
      if (!prompt) return;
      prompt.style.height = "auto";
      prompt.style.height = Math.min(prompt.scrollHeight, 150) + "px";
    }

    function copyAiText(text, button) {
      if (!text) return setAiButtonFeedback(button, "Kosong");

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard
          .writeText(text)
          .then(function () {
            setAiButtonFeedback(button, "Tersalin");
          })
          .catch(function () {
            fallbackCopyAiText(text, button);
          });
        return;
      }

      fallbackCopyAiText(text, button);
    }

    function fallbackCopyAiText(text, button) {
      var textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();

      try {
        document.execCommand("copy");
        setAiButtonFeedback(button, "Tersalin");
      } catch (error) {
        setAiButtonFeedback(button, "Gagal");
      }

      document.body.removeChild(textarea);
    }

    function speakAiText(text, button, messageId) {
      if (!("speechSynthesis" in window) || !window.SpeechSynthesisUtterance) {
        setAiButtonFeedback(button, "Tidak support");
        return;
      }

      if (!text) return;
      window.speechSynthesis.cancel();
      document.querySelectorAll(".ai-message.is-speaking").forEach(function (item) {
        item.classList.remove("is-speaking");
      });
      AI_SPEAKING_ID = messageId || "";
      var message = messageId ? document.getElementById(messageId) : null;
      if (message) message.classList.add("is-speaking");

      var utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "id-ID";
      utterance.rate = 0.96;
      utterance.pitch = 1;
      utterance.onend = function () {
        AI_SPEAKING_ID = "";
        if (message) message.classList.remove("is-speaking");
      };
      utterance.onerror = function () {
        AI_SPEAKING_ID = "";
        if (message) message.classList.remove("is-speaking");
        setAiButtonFeedback(button, "Gagal");
      };

      window.speechSynthesis.speak(utterance);
      setAiButtonFeedback(button, "Membaca");
    }

    function stopAiSpeech() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      document.querySelectorAll(".ai-message.is-speaking").forEach(function (item) {
        item.classList.remove("is-speaking");
      });
      AI_SPEAKING_ID = "";
    }

    function setAiButtonFeedback(button, label) {
      if (!button) return;
      var original = button.getAttribute("data-original-label") || button.textContent;
      button.setAttribute("data-original-label", original);
      button.textContent = label;
      setTimeout(function () {
        button.textContent = original;
      }, 1200);
    }

    function escapeAiHtml(value) {
      return String(value === undefined || value === null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function removeAiMessage(id) {
      var el = id ? document.getElementById(id) : null;
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }
  })();
</script>
