<style>
  /* ========================================================= DASHBOARD MONITORING BPS BIREUEN - CSS V2 Dark Command Center UI ========================================================= */
  :root {
    --bg-main: #060914;
    --bg-side: #080d19;
    --bg-card: rgba(15, 23, 42, 0.86);
    --bg-card-2: rgba(17, 24, 39, 0.92);
    --bg-soft: rgba(255, 255, 255, 0.045);
    --border: rgba(148, 163, 184, 0.18);
    --border-strong: rgba(255, 122, 24, 0.35);
    --text-main: #f8fafc;
    --text-soft: #cbd5e1;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --primary: #ff7a18;
    --primary-2: #ff5a00;
    --blue: #3b82f6;
    --green: #16a34a;
    --orange: #f97316;
    --yellow: #facc15;
    --red: #ef4444;
    --purple: #8b5cf6;
    --cyan: #06b6d4;
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 22px;
    --radius-xl: 28px;
    --shadow-card: 0 22px 70px rgba(0, 0, 0, 0.34);
    --shadow-glow: 0 0 45px rgba(255, 122, 24, 0.16);
    --sidebar-width: 280px;
    --topbar-height: 84px;
  }
  * {
    box-sizing: border-box;
  }
  html {
    scroll-behavior: smooth;
  }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(
        circle at top left,
        rgba(255, 122, 24, 0.18),
        transparent 32%
      ),
      radial-gradient(
        circle at top right,
        rgba(59, 130, 246, 0.12),
        transparent 28%
      ),
      linear-gradient(135deg, #060914, #0a1020 45%, #040610);
    color: var(--text-main);
    font-family:
      "Inter",
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      sans-serif;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
    z-index: -1;
  } /* ========================================================= APP LAYOUT ========================================================= */
  .app {
    display: flex;
    min-height: 100vh;
  }
  .sidebar {
    width: var(--sidebar-width);
    min-height: 100vh;
    background:
      linear-gradient(180deg, rgba(8, 13, 25, 0.98), rgba(4, 7, 14, 0.98)),
      radial-gradient(circle at top, rgba(255, 122, 24, 0.12), transparent 35%);
    border-right: 1px solid var(--border);
    padding: 24px 18px;
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    box-shadow: 14px 0 60px rgba(0, 0, 0, 0.26);
  }
  .main {
    margin-left: var(--sidebar-width);
    width: calc(100% - var(--sidebar-width));
    min-height: 100vh;
  } /* ========================================================= SIDEBAR ========================================================= */
  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 8px 28px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .brand-logo {
    width: 52px;
    height: 52px;
    flex: 0 0 52px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 18px 40px rgba(2, 6, 23, 0.26);
  }
  .brand-logo img,
  .sidebar-logo {
    display: block;
    width: 82%;
    height: 82%;
    object-fit: contain;
    image-rendering: auto;
    filter: none !important;
    opacity: 1 !important;
    mix-blend-mode: normal !important;
  }
  .sidebar-logo-fallback {
    display: none;
    color: #0f172a;
    font-size: 13px;
    font-weight: 950;
    letter-spacing: 0;
  }
  .brand-logo.logo-missing .sidebar-logo {
    display: none;
  }
  .brand-logo.logo-missing .sidebar-logo-fallback {
    display: block;
  }
  .brand-text h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.6px;
  }
  .brand-text p {
    margin: 2px 0 0;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
  }
  .sidebar-nav {
    display: grid;
    gap: 8px;
    margin-top: 8px;
  }
  .nav-item {
    border: 0;
    background: transparent;
    color: var(--text-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    border-radius: 14px;
    font-weight: 700;
    text-align: left;
    transition: 0.22s ease;
    position: relative;
  }
  .nav-item i {
    width: 20px;
    color: var(--text-muted);
    transition: 0.22s ease;
  }
  .nav-item:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-main);
    transform: translateX(3px);
  }
  .nav-item.active {
    background: linear-gradient(
      135deg,
      rgba(255, 122, 24, 0.23),
      rgba(59, 130, 246, 0.1)
    );
    color: var(--text-main);
    border: 1px solid rgba(255, 122, 24, 0.25);
    box-shadow: var(--shadow-glow);
  }
  .nav-item.active i {
    color: var(--primary);
  }
  .sidebar-footer {
    margin-top: auto;
    padding-top: 20px;
  }
  .source-box {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
  }
  .source-box p {
    margin: 0;
    color: var(--text-muted);
    font-size: 12px;
  }
  .source-box b {
    font-size: 13px;
  }
  .source-dot {
    width: 12px;
    height: 12px;
    border-radius: 999px;
    background: var(--yellow);
    box-shadow: 0 0 18px rgba(250, 204, 21, 0.75);
  }
  .source-dot.ok {
    background: var(--green);
    box-shadow: 0 0 18px rgba(22, 163, 74, 0.75);
  }
  .source-dot.bad {
    background: var(--red);
    box-shadow: 0 0 18px rgba(239, 68, 68, 0.75);
  } /* ========================================================= TOPBAR ========================================================= */
  .topbar {
    height: var(--topbar-height);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 22px;
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(6, 9, 20, 0.78);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 300px;
  }
  .topbar-left h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.5px;
  }
  .topbar-left p {
    margin: 3px 0 0;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
  }
  .topbar-center {
    flex: 1;
    display: flex;
    justify-content: center;
  }
  .global-search {
    width: min(620px, 100%);
    height: 46px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.055);
    border-radius: 999px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    transition: 0.25s ease;
  }
  .global-search:focus-within {
    border-color: rgba(255, 122, 24, 0.55);
    box-shadow: 0 0 0 4px rgba(255, 122, 24, 0.1);
  }
  .global-search i {
    color: var(--text-muted);
  }
  .global-search input {
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text-main);
    font-size: 14px;
  }
  .global-search input::placeholder {
    color: var(--text-dim);
  }
  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .theme-toggle {
    height: 43px;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 0 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.07);
    color: var(--text-main);
  }
  .theme-toggle i {
    color: var(--text-muted);
  }
  .theme-toggle select {
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text-main);
    font-weight: 800;
    cursor: pointer;
  }
  .theme-toggle select option {
    background: #111827;
    color: #f8fafc;
  }
  .icon-btn,
  .action-btn,
  .primary-btn,
  .ghost-btn {
    border: 0;
    outline: 0;
    border-radius: 12px;
    font-weight: 800;
    transition: 0.22s ease;
    white-space: nowrap;
  }
  .icon-btn,
  .action-btn {
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.07);
    color: var(--text-main);
    border: 1px solid var(--border);
  }
  .icon-btn:hover,
  .action-btn:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 122, 24, 0.45);
  }
  .primary-btn {
    min-height: 43px;
    padding: 0 18px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: white;
    box-shadow: 0 12px 30px rgba(255, 122, 24, 0.25);
  }
  .primary-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 44px rgba(255, 122, 24, 0.34);
  }
  .ghost-btn {
    min-height: 38px;
    padding: 0 14px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-soft);
    border: 1px solid var(--border);
  }
  .ghost-btn:hover {
    color: var(--text-main);
    border-color: rgba(255, 122, 24, 0.45);
    background: rgba(255, 122, 24, 0.1);
  } /* ========================================================= SYSTEM STRIP ========================================================= */
  .table-action-btn {
    min-height: 30px;
    padding: 0 10px;
    font-size: 12px;
    white-space: nowrap;
  }
  .system-strip {
    padding: 18px 28px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .system-info {
    min-height: 42px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.045);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .system-info span {
    color: var(--text-muted);
    font-size: 13px;
  }
  .system-info b {
    color: #ffd7ad;
    font-size: 13px;
  } /* ========================================================= LOADING / ERROR ========================================================= */
  .loading-state,
  .error-state {
    margin: 28px;
    min-height: 280px;
    border-radius: var(--radius-lg);
    background:
      radial-gradient(
        circle at top right,
        rgba(255, 122, 24, 0.16),
        transparent 38%
      ),
      var(--bg-card);
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    text-align: center;
    box-shadow: var(--shadow-card);
  }
  .loading-state p {
    margin-top: 18px;
    color: var(--text-muted);
    font-weight: 700;
  }
  .spinner {
    width: 54px;
    height: 54px;
    border-radius: 999px;
    border: 4px solid rgba(255, 255, 255, 0.12);
    border-top-color: var(--primary);
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
  .error-state {
    display: flex;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    color: var(--text-main);
  }
  .error-state i {
    font-size: 38px;
    color: var(--red);
  }
  .error-state h4 {
    margin: 0 0 4px;
    font-weight: 900;
  }
  .error-state p {
    margin: 0;
    color: var(--text-muted);
  } /* ========================================================= CONTENT / SECTIONS ========================================================= */
  .dashboard-content {
    padding: 24px 28px 48px;
  }
  .page-section {
    display: none;
    animation: fadeUp 0.36s ease both;
  }
  .page-section.active {
    display: block;
  }
  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .section-header {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    align-items: flex-start;
    margin-bottom: 20px;
  }
  .section-header h3 {
    margin: 0;
    font-size: 24px;
    font-weight: 950;
    letter-spacing: -0.7px;
  }
  .section-header p {
    margin: 6px 0 0;
    color: var(--text-muted);
  }
  .section-actions,
  .panel-actions,
  .filter-group {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .form-select,
  .form-control {
    background-color: rgba(255, 255, 255, 0.06) !important;
    color: var(--text-main) !important;
    border: 1px solid var(--border) !important;
    border-radius: 12px !important;
    font-weight: 700;
  }
  .form-select option {
    background: #111827;
    color: var(--text-main);
  } /* ========================================================= KPI CARDS ========================================================= */
  .kpi-grid {
    display: grid;
    gap: 16px;
    margin-bottom: 18px;
  }
  .kpi-grid-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .kpi-grid-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
  .kpi-grid-6 {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
  .kpi-card,
  .mini-kpi,
  .panel {
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before,
  .panel::before,
  .mini-kpi::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      circle at top right,
      rgba(255, 255, 255, 0.1),
      transparent 38%
    );
    pointer-events: none;
  }
  .kpi-card {
    min-height: 156px;
    padding: 22px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    background: linear-gradient(
      135deg,
      rgba(15, 23, 42, 0.92),
      rgba(12, 18, 32, 0.78)
    );
    box-shadow: var(--shadow-card);
    display: flex;
    gap: 18px;
    align-items: flex-start;
    transition: 0.25s ease;
  }
  .kpi-card:hover {
    transform: translateY(-4px);
    border-color: var(--border-strong);
  }
  .kpi-icon {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    font-size: 22px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    flex-shrink: 0;
  }
  .kpi-content p {
    margin: 0;
    color: var(--text-soft);
    font-size: 14px;
    font-weight: 700;
  }
  .kpi-content h2 {
    margin: 7px 0 4px;
    font-size: 32px;
    font-weight: 950;
    letter-spacing: -0.8px;
  }
  .kpi-content span {
    color: var(--text-muted);
    font-size: 13px;
  }
  .accent-blue .kpi-icon {
    color: #bfdbfe;
    background: rgba(59, 130, 246, 0.17);
  }
  .accent-green .kpi-icon {
    color: #bbf7d0;
    background: rgba(22, 163, 74, 0.17);
  }
  .accent-orange .kpi-icon {
    color: #fed7aa;
    background: rgba(249, 115, 22, 0.2);
  }
  .accent-purple .kpi-icon {
    color: #ddd6fe;
    background: rgba(139, 92, 246, 0.17);
  }
  .mini-kpi {
    min-height: 112px;
    padding: 18px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: linear-gradient(
      135deg,
      rgba(17, 24, 39, 0.88),
      rgba(8, 13, 25, 0.82)
    );
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.24);
  }
  .mini-kpi p {
    position: relative;
    margin: 0;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 800;
  }
  .mini-kpi h3 {
    position: relative;
    margin: 10px 0 0;
    font-size: 26px;
    font-weight: 950;
    letter-spacing: -0.5px;
  }
  .mini-kpi.success h3 {
    color: #86efac;
  }
  .mini-kpi.warning h3 {
    color: #fde68a;
  }
  .mini-kpi.danger h3 {
    color: #fca5a5;
  } /* ========================================================= PANELS & GRIDS ========================================================= */
  .grid-2,
  .grid-2-1,
  .grid-3 {
    display: grid;
    gap: 18px;
    margin-bottom: 18px;
  }
  .grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .grid-2-1 {
    grid-template-columns: 2fr 1fr;
  }
  .grid-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .panel {
    padding: 20px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    background:
      radial-gradient(
        circle at top right,
        rgba(255, 122, 24, 0.1),
        transparent 34%
      ),
      linear-gradient(135deg, rgba(15, 23, 42, 0.88), rgba(7, 12, 24, 0.88));
    box-shadow: var(--shadow-card);
  }
  .panel.compact {
    min-height: 360px;
  }
  .panel-head {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    gap: 14px;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .panel-head h4 {
    margin: 0;
    font-size: 16px;
    font-weight: 950;
  }
  .panel-head p,
  .panel-head span {
    margin: 4px 0 0;
    color: var(--text-muted);
    font-size: 13px;
  }
  .panel-badge {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    padding: 0 10px;
    border-radius: 999px;
    background: rgba(255, 122, 24, 0.13);
    color: #fed7aa !important;
    border: 1px solid rgba(255, 122, 24, 0.25);
    font-weight: 800;
    white-space: nowrap;
  }
  .chart-wrap {
    position: relative;
    z-index: 1;
    height: 330px;
  }
  .chart-wrap.tall {
    height: 470px;
  }
  .chart-wrap.donut {
    height: 260px;
  }
  .chart-wrap.risk-distribution {
    height: 360px;
  } /* ========================================================= LEADERBOARD ========================================================= */
  .leaderboard {
    position: relative;
    z-index: 1;
    display: grid;
    gap: 10px;
  }
  .leader-item {
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    min-height: 62px;
    padding: 11px 12px;
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.07);
    transition: 0.2s ease;
  }
  .leader-item:hover {
    background: rgba(255, 255, 255, 0.07);
    transform: translateX(3px);
  }
  .leader-rank {
    width: 34px;
    height: 34px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: rgba(255, 122, 24, 0.16);
    color: #fed7aa;
    font-weight: 950;
  }
  .leader-title {
    font-weight: 900;
    line-height: 1.15;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .leader-sub {
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .leader-value {
    font-weight: 950;
    color: #fbbf24;
    white-space: nowrap;
  }
  .leader-value.good {
    color: #86efac;
  }
  .leader-value.bad {
    color: #fca5a5;
  } /* ========================================================= LEGEND / QUALITY / DIAGNOSTIC ========================================================= */
  .legend-stack {
    position: relative;
    z-index: 1;
    display: grid;
    gap: 10px;
    margin-top: 18px;
  }
  .legend-stack div {
    display: flex;
    align-items: center;
    color: var(--text-soft);
    font-weight: 700;
  }
  .legend-dot {
    width: 11px;
    height: 11px;
    border-radius: 999px;
    display: inline-block;
    margin-right: 9px;
  }
  .legend-dot.green {
    background: var(--green);
    box-shadow: 0 0 16px rgba(22, 163, 74, 0.55);
  }
  .legend-dot.orange {
    background: var(--orange);
    box-shadow: 0 0 16px rgba(249, 115, 22, 0.55);
  }
  .quality-grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .quality-item,
  .diagnostic-box div,
  .endpoint-list div {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.045);
    border-radius: 16px;
    padding: 16px;
  }
  .quality-item span,
  .diagnostic-box span {
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 800;
    display: block;
  }
  .quality-item b,
  .diagnostic-box b {
    display: block;
    margin-top: 8px;
    font-size: 24px;
    font-weight: 950;
  }
  .data-audit-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
